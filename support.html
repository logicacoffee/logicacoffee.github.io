提供可选的打赏 — 完全由您决定。"], ["faq", "Logica Coffee 支持 iPad 吗？", "支持 — 从 1.2.0 版本起，本应用为通用应用。在 iPad 上，您可以在专为大屏幕设计的布局中获得相同的功能，冲煮、日志和 James 以并排面板呈现。如果开启了 iCloud 同步，您的日志、咖啡豆和配方会在您的 iPhone 和 iPad 之间自动保持同步。"], ["faq", "我的数据保存在哪里？", "您的所有冲煮日志条目、咖啡豆库存和自定义配方都保存在您的设备上。如果您启用了 iCloud，它们会通过您的个人 iCloud 账户在您的设备之间自动同步。不会向任何外部服务器发送任何内容。"], ["faq", "如何备份或将数据转移到新 iPhone？", "如果启用了 iCloud 同步，当您在新设备上登录时，您的数据会自动转移。或者，从 iCloud 或 iTunes 备份恢复也会包含所有 Logica Coffee 数据。"], ["faq", "Apple Watch 应用无法与我的 iPhone 同步。我该怎么办？", "请确保两台设备使用同一 Apple ID，并已开启蓝牙。先在 iPhone 上打开应用，然后在 Watch 上启动它。如果问题仍然存在，强制退出并重新打开两个应用通常可以解决。"], ["faq", "如何创建自定义配方？", "在&ldquo;冲煮&rdquo;标签页点按&ldquo;更换冲煮方式或配方&rdquo;，选择&ldquo;更换配方…&rdquo;，然后点按配方列表顶部的 + 按钮。您可以添加任意数量的阶段，为每个阶段设置注水量、时间和水的类型。更省事的做法：在任意内置配方上打开 ⋯ 菜单，选择&ldquo;存为我的配方&rdquo;，即可得到一份可编辑的副本。"], ["faq", "如何与朋友共享配方？", "在&ldquo;冲煮&rdquo;标签页点按&ldquo;更换冲煮方式或配方&rdquo;，选择&ldquo;更换配方…&rdquo;。然后在您创建的任意自定义配方上点按 ⋯ 菜单，选择&ldquo;分享配方&rdquo;。您将获得一个二维码和一个链接，可以通过信息、邮件或其他任何方式发送。您的朋友点按链接（或扫描二维码）即可在 Logica Coffee 中打开，在那里预览配方并添加到自己的库中。只有自定义配方可以共享 — 而且配方绝不会自动添加，因此在任何内容保存之前您总会确认。"], ["faq", "应用支持哪些冲煮方法？", "Hario V60、爱乐压、Chemex、法压壶、Hario Switch、聪明杯、ORIGAMI Dripper、Kalita Wave、OXO Rapid Brewer、摩卡壶、虹吸壶、冷萃、土耳其咖啡、越南滴滤壶 Phin、Ceado Hoop、浓缩咖啡、Ristretto、Lungo、美式、卡布奇诺、Flat White、拿铁、Cortado、玛奇朵和新加坡 Kopi。"], ["faq", "咖啡袋扫描器如何工作？", "添加新咖啡豆时，点按扫描图标并拍摄您的咖啡袋照片。应用使用设备端 AI 自动读取并填写烘焙商、产地、处理法和品鉴记录等详情。"], ["faq", "引导式 Dial-in 会话如何工作？", "Dial-in 不仅适用于浓缩咖啡 — 它适用于任何方法。开始一个会话，应用会引导您完成一个闭环：冲煮，告诉它这杯的味道（太酸、太苦、太淡、均衡），它会为下一次尝试建议一项具体的研磨度、用量或比例调整。它记录每一步，让您准确地看到自己是如何调出完美配方的，并且您可以稍后从上次停下的地方继续该会话。"], ["faq", "Coach（James）是什么？", "James 是您的内置咖啡教练。告诉他您冲了什么以及味道如何，他会解释杯中正在发生什么以及接下来该改变什么 — 研磨度、温度、比例或手法。他完全在您的设备上运行：无需账户、无需互联网连接，您告诉他的任何内容都绝不会离开您的设备。"], ["faq", "什么是设备端冲煮分析？为什么我可能看不到它？", "在受支持的 iPhone 和 iPad 上（即已开启 Apple 智能的设备），你可以让 James 分析一条已记录的冲煮，Apple 的设备端模型会为这杯咖啡给出量身定制的解读。整个过程完全在你的设备上运行，不会向 Apple、向我们或任何服务器发送任何内容。你可以在 App 的“设置”中的“偏好设置”（设备端分析）里找到它，在支持的设备上默认开启。如果你的设备不支持 Apple 智能，你将看不到这个开关——但 James 依然会通过内置的离线引擎为每一次冲煮提供指导，你不会错过任何东西。"], ["faq", "Logica Coffee 可以将我的咖啡因记录到 Apple 健康吗？", "可以。在<strong>设置 → Apple 健康</strong>中，开启咖啡因记录并授予权限。从那时起，您保存的每次冲煮都会向 Apple 健康写入估算的咖啡因量，使其与您的其余健康数据一同显示。应用只会写入此数值 — 绝不会读取您的任何健康数据 — 您可以随时在健康应用中关闭它或撤销访问权限。"], ["faq", "如何删除我的所有数据？", "您可以在应用内删除单个日志条目和咖啡豆。要删除所有数据，请卸载应用。如果启用了 iCloud 同步，您还可以在<strong>设置 → [您的姓名] → iCloud → 管理账户存储</strong>中移除 Logica Coffee 的数据。"], ["faq", "我发现了一个 bug。如何报告？", "请发邮件至 <a href=\"mailto:khatskevich.mv@gmail.com\">khatskevich.mv@gmail.com</a>，并附上发生情况的描述、您的 iPhone 型号和 iOS 版本。截图总是很有帮助。"], ["h2", "隐私"], ["p", "Logica Coffee 不收集、传输或共享任何个人数据。请阅读完整的<a href=\"./privacy.html\">隐私政策</a>。"]]}};
  var UI  = {"en": {"langLabel": "Language", "contactEmail": "Email", "footerPrivacy": "Privacy Policy"}, "be": {"langLabel": "Мова", "contactEmail": "Пошта", "footerPrivacy": "Палітыка прыватнасці"}, "de": {"langLabel": "Sprache", "contactEmail": "E-Mail", "footerPrivacy": "Datenschutzerklärung"}, "es": {"langLabel": "Idioma", "contactEmail": "Correo", "footerPrivacy": "Política de Privacidad"}, "fr": {"langLabel": "Langue", "contactEmail": "E-mail", "footerPrivacy": "Politique de confidentialité"}, "it": {"langLabel": "Lingua", "contactEmail": "E-mail", "footerPrivacy": "Informativa sulla privacy"}, "ja": {"langLabel": "言語", "contactEmail": "メール", "footerPrivacy": "プライバシーポリシー"}, "pl": {"langLabel": "Język", "contactEmail": "E-mail", "footerPrivacy": "Polityka prywatności"}, "pt-BR": {"langLabel": "Idioma", "contactEmail": "E-mail", "footerPrivacy": "Política de Privacidade"}, "ru": {"langLabel": "Язык", "contactEmail": "Почта", "footerPrivacy": "Политика конфиденциальности"}, "uk": {"langLabel": "Мова", "contactEmail": "Пошта", "footerPrivacy": "Політика конфіденційності"}, "zh-Hans": {"langLabel": "语言", "contactEmail": "邮箱", "footerPrivacy": "隐私政策"}};
  var KIND = "support"; // 'privacy' or 'support'

  function esc(){return arguments[0];}

  function pickLang() {
    var h = location.hash.replace('#','');
    if (STR[h]) return h;
    try { var s = localStorage.getItem('lc_lang'); if (s && STR[s]) return s; } catch(e){}
    var n = (navigator.language || navigator.userLanguage || 'en');
    if (STR[n]) return n;
    var base = n.toLowerCase().split('-')[0];
    if (base === 'pt') return STR['pt-BR'] ? 'pt-BR' : 'en';
    if (base === 'zh') return STR['zh-Hans'] ? 'zh-Hans' : 'en';
    for (var i=0;i<LANGS.length;i++){ if (LANGS[i][0].toLowerCase().split('-')[0] === base && STR[LANGS[i][0]]) return LANGS[i][0]; }
    return 'en';
  }

  function renderBlocks(blocks, ui) {
    var html = '';
    var open = false;
    function openSec(){ if(!open){ html += '<section>'; open = true; } }
    function closeSec(){ if(open){ html += '</section>'; open = false; } }
    for (var i=0;i<blocks.length;i++) {
      var b = blocks[i];
      var t = b[0];
      if (t === 'highlight') {
        closeSec();
        html += '<section><div class="highlight-box"><p>' + b[1] + '</p></div></section>';
      } else if (t === 'h2') {
        closeSec(); openSec();
        html += '<h2>' + b[1] + '</h2>';
      } else if (t === 'p') {
        openSec();
        html += '<p>' + b[1] + '</p>';
      } else if (t === 'ul') {
        openSec();
        html += '<ul>';
        for (var j=0;j<b[1].length;j++) html += '<li>' + b[1][j] + '</li>';
        html += '</ul>';
      } else if (t === 'faq') {
        openSec();
        html += '<div class="faq-item"><p class="faq-q">' + b[1] + '</p><p class="faq-a">' + b[2] + '</p></div>';
      } else if (t === 'contact') {
        closeSec();
        html += '<section><div class="contact-card"><span class="label">' + b[1] +
                '</span><a class="email" href="mailto:khatskevich.mv@gmail.com">khatskevich.mv@gmail.com</a><span class="note">' +
                b[2] + '</span></div></section>';
      }
    }
    closeSec();
    return html;
  }

  function apply(loc) {
    var d = STR[loc] || STR['en'];
    var ui = UI[loc] || UI['en'];
    document.documentElement.lang = loc;
    document.title = d.title + ' — Logica Coffee';
    document.getElementById('title').textContent = d.title;
    document.getElementById('updated').textContent = d.updated;
    document.getElementById('langLabel').textContent = '';
    document.getElementById('content').innerHTML = renderBlocks(d.blocks, ui);
    var foot = document.getElementById('footer');
    if (foot) {
      foot.innerHTML = 'Logica Coffee &mdash; Mikita Khatskevich &mdash; 2026' +
        (KIND === 'support' ? ' &mdash; <a href="./privacy.html">' + ui.footerPrivacy + '</a>' : '');
    }
    document.getElementById('lang').value = loc;
    try { localStorage.setItem('lc_lang', loc); } catch(e){}
  }

  var sel = document.getElementById('lang');
  sel.addEventListener('change', function(){ location.hash = this.value; apply(this.value); });
  window.addEventListener('hashchange', function(){ var h = location.hash.replace('#',''); if (STR[h]) apply(h); });
  apply(pickLang());
</script>
