<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Support — Logica Coffee</title>
  <style>
    :root {
      --bg:      #100f0d;
      --surface: #1a1613;
      --orange:  #d68757;
      --white:   #f4f1ea;
      --gray:    #8a8076;
      --border:  #2c2722;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--white);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      font-size: 16px;
      line-height: 1.7;
      padding: 0 16px 80px;
    }
    .wrap { max-width: 680px; margin: 0 auto; }
    header {
      padding: 56px 0 40px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 48px;
    }
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin-bottom: 14px;
    }
    .app-label {
      font-family: "SF Mono", "Fira Mono", monospace;
      font-size: 12px;
      letter-spacing: 0.12em;
      color: var(--orange);
      text-transform: uppercase;
    }
    .lang-switch {
      position: relative;
      flex-shrink: 0;
    }
    .lang-switch select {
      appearance: none;
      -webkit-appearance: none;
      background: var(--surface);
      color: var(--white);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 7px 30px 7px 12px;
      font-size: 13px;
      font-family: inherit;
      cursor: pointer;
      letter-spacing: 0.02em;
    }
    .lang-switch::after {
      content: "";
      position: absolute;
      right: 12px;
      top: 50%;
      width: 7px;
      height: 7px;
      border-right: 1.5px solid var(--gray);
      border-bottom: 1.5px solid var(--gray);
      transform: translateY(-65%) rotate(45deg);
      pointer-events: none;
    }
    .lang-switch select:focus { outline: none; border-color: var(--orange); }
    h1 {
      font-family: "New York", "Iowan Old Style", Georgia, "Times New Roman", serif;
      font-size: clamp(34px, 6.5vw, 56px);
      font-weight: 700;
      letter-spacing: -0.01em;
      line-height: 1.08;
      color: var(--white);
    }
    .updated {
      margin-top: 16px;
      font-size: 13px;
      color: var(--gray);
      font-family: "SF Mono", "Fira Mono", monospace;
      letter-spacing: 0.05em;
    }
    section { margin-bottom: 48px; }
    h2 {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--orange);
      font-family: "SF Mono", "Fira Mono", monospace;
      margin-bottom: 16px;
    }
    p { color: #ccc; margin-bottom: 14px; }
    p:last-child { margin-bottom: 0; }
    ul { list-style: none; padding: 0; }
    ul li {
      color: #ccc;
      padding: 10px 0 10px 20px;
      border-bottom: 1px solid var(--border);
      position: relative;
    }
    ul li:first-child { border-top: 1px solid var(--border); }
    ul li::before {
      content: "—";
      position: absolute;
      left: 0;
      color: var(--orange);
      font-weight: 700;
    }
    .highlight-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-left: 3px solid var(--orange);
      border-radius: 8px;
      padding: 20px 24px;
      margin-bottom: 32px;
    }
    .highlight-box p { color: var(--white); font-size: 15px; margin: 0; }
    .faq-item { border-bottom: 1px solid var(--border); padding: 20px 0; }
    .faq-item:first-of-type { border-top: 1px solid var(--border); }
    .faq-q { color: var(--white); font-weight: 600; margin-bottom: 8px; }
    .faq-a { color: #ccc; margin: 0; }
    .faq-a strong { color: var(--white); }
    a { color: var(--orange); text-decoration: none; }
    a:hover { text-decoration: underline; }
    .contact-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .contact-card .label {
      font-family: "SF Mono", "Fira Mono", monospace;
      font-size: 11px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--gray);
    }
    .contact-card .email { font-size: 17px; font-weight: 600; color: var(--orange); }
    .contact-card .note { font-size: 13px; color: var(--gray); margin-top: 4px; }
    footer {
      border-top: 1px solid var(--border);
      padding-top: 32px;
      font-size: 13px;
      color: var(--gray);
      font-family: "SF Mono", "Fira Mono", monospace;
    }
    footer a { color: var(--gray); }
    footer a:hover { color: var(--orange); text-decoration: underline; }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="topbar">
        <p class="app-label">Logica Coffee</p>
        <div class="lang-switch">
          <label id="langLabel" for="lang" style="display:none"></label>
          <select id="lang" aria-label="Language">
          <option value="en" selected>English</option>
          <option value="be">Беларуская</option>
          <option value="de">Deutsch</option>
          <option value="es">Español</option>
          <option value="fr">Français</option>
          <option value="it">Italiano</option>
          <option value="ja">日本語</option>
          <option value="pl">Polski</option>
          <option value="pt-BR">Português (BR)</option>
          <option value="ru">Русский</option>
          <option value="uk">Українська</option>
          <option value="zh-Hans">中文</option>
          </select>
        </div>
      </div>
      <h1 id="title">Support</h1>
      <p class="updated" id="updated"></p>
    </header>

    <div id="content"></div>

    <footer><p id="footer"></p></footer>
  </div>
  <script>
  var LANGS = [["en", "English"], ["be", "Беларуская"], ["de", "Deutsch"], ["es", "Español"], ["fr", "Français"], ["it", "Italiano"], ["ja", "日本語"], ["pl", "Polski"], ["pt-BR", "Português (BR)"], ["ru", "Русский"], ["uk", "Українська"], ["zh-Hans", "中文"]];
  var STR = {"en": {"title": "Support", "updated": "We typically respond within 24 hours", "blocks": [["highlight", "Have a question, found a bug, or want to suggest something? Drop an email — every message is read personally."], ["contact", "Email", "Include your iPhone model and iOS version if reporting a bug."], ["h2", "Frequently Asked Questions"], ["faq", "Is Logica Coffee free?", "Yes, completely. No subscription, no paywall, no ads. Every feature is fully unlocked from the moment you install. Optional tips are available inside if you'd like to support development — entirely your choice."], ["faq", "Does Logica Coffee work on iPad?", "Yes — as of version 1.2.0 the app is universal. On iPad you get the same features in a layout designed for the larger screen, with side-by-side panes for brewing, your journal, and James. If iCloud sync is on, your journal, beans, and recipes stay in step between your iPhone and iPad automatically."], ["faq", "Where is my data stored?", "All your brew journal entries, bean inventory, and custom recipes are stored on your device. If you have iCloud enabled, they sync automatically across your devices via your personal iCloud account. Nothing is sent to any external server."], ["faq", "How do I back up or transfer my data to a new iPhone?", "If iCloud sync is enabled, your data transfers automatically when you sign in on a new device. Alternatively, restoring from an iCloud or iTunes backup will include all Logica Coffee data."], ["faq", "The Apple Watch app isn't syncing with my iPhone. What do I do?", "Make sure both devices are on the same Apple ID and that Bluetooth is enabled. Open the app on your iPhone first, then launch it on your Watch. If the problem persists, force-quitting and reopening both apps usually resolves it."], ["faq", "How do I create a custom recipe?", "On the Brew tab, tap &ldquo;Change method or recipe&rdquo;, choose &ldquo;Change recipe…&rdquo;, then tap the + button at the top of the recipe list. Add as many stages as you like, setting pour amount, timing, and water type for each one. Quicker still: open the ⋯ menu on any built-in recipe and choose &ldquo;Save as My Recipe&rdquo; to get an editable copy you can adjust."], ["faq", "How do I share a recipe with a friend?", "On the Brew tab, tap &ldquo;Change method or recipe&rdquo; and choose &ldquo;Change recipe…&rdquo;. Then tap the ⋯ menu on any custom recipe you've created and choose &ldquo;Share Recipe&rdquo;. You'll get a QR code and a link you can send through Messages, Mail, or anywhere else. Your friend taps the link (or scans the code) to open it in Logica Coffee, where they can preview the recipe and add it to their own library. Only custom recipes can be shared — and a recipe is never added automatically, so you always confirm before anything is saved."], ["faq", "What brew methods does the app support?", "Hario V60, AeroPress, Chemex, French Press, Hario Switch, Clever Dripper, ORIGAMI Dripper, Kalita Wave, OXO Rapid Brewer, Moka Pot, Syphon, Cold Brew, Turkish Coffee, Vietnamese Phin, Ceado Hoop, Espresso, Ristretto, Lungo, Americano, Cappuccino, Flat White, Latte, Cortado, Macchiato, and Singapore Kopi."], ["faq", "How does the coffee bag scanner work?", "When adding new beans, tap the scan icon and take a photo of your coffee bag. The app uses on-device AI to automatically read and fill in details like the roaster, origin, process, and tasting notes."], ["faq", "How do the guided Dial-in sessions work?", "Dial-in isn't just for espresso — it works with any method. Start a session and the app walks you through a closed loop: brew, tell it how the cup tasted (too sour, too bitter, weak, balanced), and it suggests a single concrete adjustment to grind, dose, or ratio for the next attempt. It records every step so you can see exactly how you converged on your perfect recipe, and you can pick a session back up later right where you left off."], ["faq", "What is the Coach (James)?", "James is your built-in coffee coach. Tell him what you brewed and how it tasted and he'll explain what's happening in the cup and what to change next — grind, temperature, ratio, or technique. He runs entirely on your device: there's no account, no internet connection required, and nothing you tell him ever leaves your device."], ["faq", "What is on-device brew analysis, and why might I not see it?", "On supported iPhones and iPads — those with Apple Intelligence turned on — you can ask James to analyze a logged brew, and Apple's on-device model gives a tailored read of the cup. It runs entirely on your device; nothing is sent to Apple, to us, or to any server. You'll find it in the app's Settings under Preferences (On-Device Analysis), on by default where it's available. If your device doesn't support Apple Intelligence, you won't see the toggle — but James still coaches every brew with the built-in offline engine, so you don't miss out."], ["faq", "Can Logica Coffee log my caffeine to Apple Health?", "Yes. In <strong>Settings → Apple Health</strong>, turn on caffeine logging and grant permission. From then on, each brew you save writes an estimated caffeine amount to Apple Health, so it shows up alongside the rest of your health data. The app only ever writes this value — it never reads any of your health data — and you can turn it off or revoke access at any time in the Health app."], ["faq", "How do I delete all my data?", "You can delete individual journal entries and beans from within the app. To remove all data, uninstall the app. If iCloud sync is enabled, you can also remove Logica Coffee data from <strong>Settings → [Your Name] → iCloud → Manage Account Storage</strong>."], ["faq", "I found a bug. How do I report it?", "Email us at <a href=\"mailto:khatskevich.mv@gmail.com\">khatskevich.mv@gmail.com</a> with a description of what happened, your iPhone model, and your iOS version. Screenshots are always helpful."], ["h2", "Privacy"], ["p", "Logica Coffee does not collect, transmit, or share any personal data. Read the full <a href=\"./privacy.html\">Privacy Policy</a>."]]}, "be": {"title": "Падтрымка", "updated": "Звычайна мы адказваем на працягу 24 гадзін", "blocks": [["highlight", "Маеце пытанне, знайшлі памылку ці хочаце нешта прапанаваць? Напішыце на пошту — кожнае паведамленне чытаецца асабіста."], ["contact", "Пошта", "Калі паведамляеце пра памылку, пазначце мадэль вашага iPhone і версію iOS."], ["h2", "Частыя пытанні"], ["faq", "Logica Coffee бясплатны?", "Так, цалкам. Без падпіскі, без платнага доступу, без рэкламы. Усе функцыі цалкам разблакіраваны з моманту ўсталявання. Унутры даступныя неабавязковыя чаявыя, калі вы хочаце падтрымаць распрацоўку — цалкам на ваш выбар."], ["faq", "Ці працуе Logica Coffee на iPad?", "Так — пачынаючы з версіі 1.2.0 праграма ўніверсальная. На iPad вы атрымліваеце тыя ж функцыі ў афармленні, прадуманым для большага экрана, з размешчанымі побач панэлямі для заварвання, вашага журнала і Джэймса. Калі сінхранізацыя iCloud уключана, ваш журнал, зерні і рэцэпты аўтаматычна застаюцца сінхранізаванымі паміж вашым iPhone і iPad."], ["faq", "Дзе захоўваюцца мае даныя?", "Усе запісы вашага журнала заварак, запас зерня і ўласныя рэцэпты захоўваюцца на вашай прыладзе. Калі ў вас уключаны iCloud, яны аўтаматычна сінхранізуюцца паміж вашымі прыладамі праз ваш асабісты ўліковы запіс iCloud. Нічога не адпраўляецца на знешнія серверы."], ["faq", "Як зрабіць рэзервовую копію або перанесці даныя на новы iPhone?", "Калі сінхранізацыя iCloud уключана, вашы даныя пераносяцца аўтаматычна пры ўваходзе на новай прыладзе. Акрамя таго, аднаўленне з рэзервовай копіі iCloud або iTunes уключыць усе даныя Logica Coffee."], ["faq", "Праграма Apple Watch не сінхранізуецца з маім iPhone. Што рабіць?", "Пераканайцеся, што абедзве прылады выкарыстоўваюць той жа Apple ID і што Bluetooth уключаны. Спачатку адкрыйце праграму на iPhone, потым запусціце яе на Watch. Калі праблема не знікае, звычайна дапамагае прымусова закрыць і зноў адкрыць абедзве праграмы."], ["faq", "Як стварыць уласны рэцэпт?", "На ўкладцы &ldquo;Заварванне&rdquo; націсніце &ldquo;Змяніць метад ці рэцэпт&rdquo;, выберыце &ldquo;Змяніць рэцэпт…&rdquo; і націсніце кнопку + уверсе спісу рэцэптаў. Вы можаце дадаць колькі заўгодна этапаў, задаючы для кожнага аб'ём праліву, таймінг і тып вады. Яшчэ хутчэй: адкрыйце меню ⋯ у любога ўбудаванага рэцэпта і выберыце &ldquo;Захаваць як свой рэцэпт&rdquo; — атрымаеце копію, якую можна правіць."], ["faq", "Як падзяліцца рэцэптам з сябрам?", "На ўкладцы &ldquo;Заварванне&rdquo; націсніце &ldquo;Змяніць метад ці рэцэпт&rdquo; і выберыце &ldquo;Змяніць рэцэпт…&rdquo;. Потым націсніце меню ⋯ любога створанага вамі ўласнага рэцэпта і выберыце &ldquo;Падзяліцца рэцэптам&rdquo;. Вы атрымаеце QR-код і спасылку, якія можна адправіць праз Паведамленні, Пошту ці куды заўгодна. Ваш сябар націскае на спасылку (або сканіруе код), каб адкрыць яе ў Logica Coffee, дзе ён можа прагледзець рэцэпт і дадаць яго ў сваю бібліятэку. Дзяліцца можна толькі ўласнымі рэцэптамі — і рэцэпт ніколі не дадаецца аўтаматычна, так што вы заўсёды пацвярджаеце перад захаваннем."], ["faq", "Якія метады заварвання падтрымлівае праграма?", "Hario V60, AeroPress, Chemex, фрэнч-прэс, Hario Switch, Clever Dripper, ORIGAMI Dripper, Kalita Wave, OXO Rapid Brewer, гейзерная кававарка (мока), сіфон, колд брю, турэцкая кава, в'етнамскі фін, Ceado Hoop, эспрэса, рыстрэта, лунга, амерыкана, капучына, флэт уайт, латэ, картада, макіята і сінгапурскі копі."], ["faq", "Як працуе сканер пакетаў кавы?", "Дадаючы новыя зерні, націсніце на значок сканіравання і сфатаграфуйце пакет кавы. Праграма выкарыстоўвае ШІ на прыладзе, каб аўтаматычна счытаць і запоўніць такія дэталі, як абсмажвальнік, паходжанне, апрацоўка і дэгустацыйныя нататкі."], ["faq", "Як працуюць пакрокавыя сесіі наладкі (dial-in)?", "Наладка не толькі для эспрэса — яна працуе з любым метадам. Распачніце сесію, і праграма правядзе вас замкнёным цыклам: заварыце, скажыце, якім быў смак кубка (занадта кіслая, занадта горкая, слабая, збалансаваная), і яна прапануе адну канкрэтную карэкціроўку памолу, дозы ці прапорцыі для наступнай спробы. Яна запісвае кожны крок, каб вы бачылі дакладна, як прыйшлі да ідэальнага рэцэпта, і вы можаце вярнуцца да сесіі пазней з таго ж месца, дзе спыніліся."], ["faq", "Што такое Коуч (Джэймс)?", "Джэймс — гэта ваш убудаваны кававы коуч. Раскажыце яму, што вы заварылі і якім быў смак, і ён растлумачыць, што адбываецца ў кубку і што змяніць далей — памол, тэмпературу, прапорцыю ці тэхніку. Ён працуе цалкам на вашай прыладзе: без уліковага запісу, без патрэбы ў інтэрнэце, і нічога з таго, што вы яму расказваеце, ніколі не пакідае вашу прыладу."], ["faq", "Што такое аналіз заваркі на прыладзе і чаму я магу яго не бачыць?", "На падтрыманых iPhone і iPad — тых, дзе ўключаны Apple Intelligence — можна папрасіць Джэймса разабраць захаваную заварку, і мадэль Apple прама на прыладзе дае індывідуальную ацэнку кубка. Усё працуе цалкам на вашай прыладзе; нічога не адпраўляецца ні ў Apple, ні нам, ні на які-небудзь сервер. Функцыю можна знайсці ў наладах праграмы, у раздзеле «Параметры» («Аналіз на прыладзе»); там, дзе яна даступная, яна ўключана па змаўчанні. Калі ваша прылада не падтрымлівае Apple Intelligence, пераключальніка не будзе — але Джэймс усё роўна падказвае па кожнай заварцы з дапамогай убудаванага афлайн-рухавіка, так што вы нічога не прапусціце."], ["faq", "Ці можа Logica Coffee запісваць мой кафеін у Apple Здароўе?", "Так. У раздзеле <strong>Налады → Apple Здароўе</strong> уключыце запіс кафеіну і дайце дазвол. З гэтага моманту кожная захаваная вамі заварка запісвае арыентоўную колькасць кафеіну ў Apple Здароўе, так што яно адлюстроўваецца побач з астатнімі вашымі данымі пра здароўе. Праграма толькі запісвае гэтае значэнне — яна ніколі не чытае ніякіх вашых даных пра здароўе — і вы можаце адключыць гэта або адклікаць доступ у любы момант у праграме Здароўе."], ["faq", "Як выдаліць усе мае даныя?", "Вы можаце выдаляць асобныя запісы журнала і зерні з праграмы. Каб выдаліць усе даныя, выдаліце праграму. Калі сінхранізацыя iCloud уключана, вы таксама можаце выдаліць даныя Logica Coffee у раздзеле <strong>Налады → [Ваша імя] → iCloud → Кіраванне сховішчам уліковага запісу</strong>."], ["faq", "Я знайшоў памылку. Як пра яе паведаміць?", "Напішыце нам на <a href=\"mailto:khatskevich.mv@gmail.com\">khatskevich.mv@gmail.com</a> з апісаннем таго, што адбылося, мадэллю вашага iPhone і версіяй iOS. Здымкі экрана заўсёды карысныя."], ["h2", "Прыватнасць"], ["p", "Logica Coffee не збірае, не перадае і не дзеліцца ніякімі асабістымі данымі. Прачытайце поўную <a href=\"./privacy.html\">Палітыку прыватнасці</a>."]]}, "de": {"title": "Support", "updated": "Wir antworten in der Regel innerhalb von 24 Stunden", "blocks": [["highlight", "Eine Frage, einen Fehler gefunden oder einen Vorschlag? Schreiben Sie eine E-Mail — jede Nachricht wird persönlich gelesen."], ["contact", "E-Mail", "Geben Sie bei einer Fehlermeldung Ihr iPhone-Modell und Ihre iOS-Version an."], ["h2", "Häufig gestellte Fragen"], ["faq", "Ist Logica Coffee kostenlos?", "Ja, vollständig. Kein Abo, keine Bezahlschranke, keine Werbung. Jede Funktion ist ab der Installation vollständig freigeschaltet. Optionale Trinkgelder sind in der App verfügbar, falls Sie die Entwicklung unterstützen möchten — ganz nach Ihrer Wahl."], ["faq", "Funktioniert Logica Coffee auf dem iPad?", "Ja — seit Version 1.2.0 ist die App universal. Auf dem iPad erhalten Sie dieselben Funktionen in einem für den größeren Bildschirm gestalteten Layout, mit nebeneinander liegenden Bereichen zum Brühen, für Ihr Journal und für James. Wenn die iCloud-Synchronisierung aktiviert ist, bleiben Ihr Journal, Ihre Bohnen und Ihre Rezepte automatisch zwischen Ihrem iPhone und Ihrem iPad im Einklang."], ["faq", "Wo werden meine Daten gespeichert?", "Alle Ihre Journal-Einträge, Ihr Bohnenbestand und Ihre eigenen Rezepte werden auf Ihrem Gerät gespeichert. Wenn iCloud aktiviert ist, werden sie über Ihr persönliches iCloud-Konto automatisch zwischen Ihren Geräten synchronisiert. Es wird nichts an einen externen Server gesendet."], ["faq", "Wie sichere oder übertrage ich meine Daten auf ein neues iPhone?", "Wenn die iCloud-Synchronisierung aktiviert ist, werden Ihre Daten automatisch übertragen, sobald Sie sich auf einem neuen Gerät anmelden. Alternativ enthält die Wiederherstellung aus einem iCloud- oder iTunes-Backup alle Logica Coffee-Daten."], ["faq", "Die Apple Watch-App synchronisiert sich nicht mit meinem iPhone. Was kann ich tun?", "Stellen Sie sicher, dass beide Geräte dieselbe Apple-ID verwenden und dass Bluetooth aktiviert ist. Öffnen Sie die App zuerst auf Ihrem iPhone und starten Sie sie dann auf Ihrer Watch. Falls das Problem bestehen bleibt, hilft es meist, beide Apps zu beenden und neu zu öffnen."], ["faq", "Wie erstelle ich ein eigenes Rezept?", "Tippen Sie im Tab &ldquo;Brühen&rdquo; auf &ldquo;Methode oder Rezept ändern&rdquo;, wählen Sie &ldquo;Rezept ändern…&rdquo; und tippen Sie dann oben in der Rezeptliste auf die Taste +. Sie können beliebig viele Phasen hinzufügen und für jede die Aufgussmenge, das Timing und die Wasserart festlegen. Noch schneller: Öffnen Sie bei einem mitgelieferten Rezept das Menü ⋯ und wählen Sie &ldquo;Als eigenes Rezept sichern&rdquo; — so erhalten Sie eine bearbeitbare Kopie."], ["faq", "Wie teile ich ein Rezept mit einem Freund?", "Tippen Sie im Tab &ldquo;Brühen&rdquo; auf &ldquo;Methode oder Rezept ändern&rdquo; und wählen Sie &ldquo;Rezept ändern…&rdquo;. Tippen Sie dann bei einem selbst erstellten Rezept auf das Menü ⋯ und wählen Sie &ldquo;Rezept teilen&rdquo;. Sie erhalten einen QR-Code und einen Link, den Sie per Nachrichten, Mail oder anderswo senden können. Ihr Freund tippt auf den Link (oder scannt den Code), um ihn in Logica Coffee zu öffnen, wo er das Rezept als Vorschau sehen und zu seiner eigenen Bibliothek hinzufügen kann. Nur eigene Rezepte können geteilt werden — und ein Rezept wird niemals automatisch hinzugefügt, Sie bestätigen also immer, bevor etwas gespeichert wird."], ["faq", "Welche Brühmethoden unterstützt die App?", "Hario V60, AeroPress, Chemex, French Press, Hario Switch, Clever Dripper, ORIGAMI Dripper, Kalita Wave, OXO Rapid Brewer, Espressokanne (Moka), Syphon, Cold Brew, Türkischer Kaffee, Vietnamesischer Phin, Ceado Hoop, Espresso, Ristretto, Lungo, Americano, Cappuccino, Flat White, Latte, Cortado, Macchiato und Singapore Kopi."], ["faq", "Wie funktioniert der Kaffeetüten-Scanner?", "Tippen Sie beim Hinzufügen neuer Bohnen auf das Scan-Symbol und fotografieren Sie Ihre Kaffeetüte. Die App nutzt geräteinterne KI, um Details wie Rösterei, Herkunft, Aufbereitung und Verkostungsnotizen automatisch zu lesen und auszufüllen."], ["faq", "Wie funktionieren die geführten Dial-in-Sitzungen?", "Dial-in ist nicht nur für Espresso — es funktioniert mit jeder Methode. Starten Sie eine Sitzung, und die App führt Sie durch einen geschlossenen Kreislauf: brühen, angeben, wie die Tasse geschmeckt hat (zu sauer, zu bitter, zu schwach, ausgewogen), und sie schlägt eine einzige konkrete Anpassung an Mahlgrad, Menge oder Verhältnis für den nächsten Versuch vor. Jeder Schritt wird aufgezeichnet, sodass Sie genau sehen, wie Sie zu Ihrem perfekten Rezept gelangt sind, und Sie können eine Sitzung später genau dort fortsetzen, wo Sie aufgehört haben."], ["faq", "Was ist der Coach (James)?", "James ist Ihr integrierter Kaffee-Coach. Sagen Sie ihm, was Sie gebrüht haben und wie es geschmeckt hat, und er erklärt, was in der Tasse passiert und was Sie als Nächstes ändern sollten — Mahlgrad, Temperatur, Verhältnis oder Technik. Er läuft vollständig auf Ihrem Gerät: kein Konto, keine Internetverbindung nötig, und nichts, was Sie ihm sagen, verlässt jemals Ihr Gerät."], ["faq", "Was ist die On-Device-Brühanalyse, und warum wird sie mir vielleicht nicht angezeigt?", "Auf unterstützten iPhones und iPads – solchen mit aktivierter Apple Intelligence – kannst du James bitten, einen protokollierten Brühvorgang zu analysieren, und Apples Modell auf dem Gerät liefert eine maßgeschneiderte Einschätzung deiner Tasse. Sie läuft vollständig auf deinem Gerät; nichts wird an Apple, an uns oder an irgendeinen Server gesendet. Du findest sie in den Einstellungen der App unter Präferenzen (On-Device-Analyse) – wo verfügbar, ist sie standardmäßig aktiviert. Wenn dein Gerät Apple Intelligence nicht unterstützt, siehst du den Schalter nicht – aber James begleitet weiterhin jeden Brühvorgang mit der integrierten Offline-Engine, sodass dir nichts entgeht."], ["faq", "Kann Logica Coffee mein Koffein in Apple Health protokollieren?", "Ja. Aktivieren Sie unter <strong>Einstellungen → Apple Health</strong> die Koffein-Protokollierung und erteilen Sie die Erlaubnis. Von da an schreibt jeder gespeicherte Aufguss eine geschätzte Koffeinmenge in Apple Health, sodass sie zusammen mit Ihren übrigen Gesundheitsdaten erscheint. Die App schreibt diesen Wert nur — sie liest niemals Ihre Gesundheitsdaten — und Sie können dies jederzeit in der Health-App deaktivieren oder den Zugriff widerrufen."], ["faq", "Wie lösche ich alle meine Daten?", "Sie können einzelne Journal-Einträge und Bohnen in der App löschen. Um alle Daten zu entfernen, deinstallieren Sie die App. Wenn die iCloud-Synchronisierung aktiviert ist, können Sie Logica Coffee-Daten auch unter <strong>Einstellungen → [Ihr Name] → iCloud → Account-Speicher verwalten</strong> entfernen."], ["faq", "Ich habe einen Fehler gefunden. Wie melde ich ihn?", "Schreiben Sie uns an <a href=\"mailto:khatskevich.mv@gmail.com\">khatskevich.mv@gmail.com</a> mit einer Beschreibung des Vorfalls, Ihrem iPhone-Modell und Ihrer iOS-Version. Screenshots sind immer hilfreich."], ["h2", "Datenschutz"], ["p", "Logica Coffee erhebt, überträgt oder teilt keinerlei personenbezogene Daten. Lesen Sie die vollständige <a href=\"./privacy.html\">Datenschutzerklärung</a>."]]}, "es": {"title": "Soporte", "updated": "Normalmente respondemos en menos de 24 horas", "blocks": [["highlight", "¿Tienes una pregunta, encontraste un error o quieres sugerir algo? Envía un correo — cada mensaje se lee personalmente."], ["contact", "Correo", "Si informas de un error, incluye el modelo de tu iPhone y tu versión de iOS."], ["h2", "Preguntas frecuentes"], ["faq", "¿Logica Coffee es gratis?", "Sí, totalmente. Sin suscripción, sin muro de pago, sin anuncios. Todas las funciones están completamente desbloqueadas desde el momento en que la instalas. Hay propinas opcionales dentro de la app por si quieres apoyar el desarrollo — totalmente a tu elección."], ["faq", "¿Funciona Logica Coffee en el iPad?", "Sí — desde la versión 1.2.0 la app es universal. En el iPad tienes las mismas funciones en un diseño pensado para la pantalla más grande, con paneles en paralelo para preparar, tu diario y James. Si la sincronización con iCloud está activada, tu diario, tus granos y tus recetas se mantienen al día automáticamente entre tu iPhone y tu iPad."], ["faq", "¿Dónde se guardan mis datos?", "Todas las entradas de tu diario de preparaciones, tu inventario de granos y tus recetas personalizadas se guardan en tu dispositivo. Si tienes iCloud activado, se sincronizan automáticamente entre tus dispositivos a través de tu cuenta personal de iCloud. No se envía nada a ningún servidor externo."], ["faq", "¿Cómo hago una copia de seguridad o transfiero mis datos a un iPhone nuevo?", "Si la sincronización con iCloud está activada, tus datos se transfieren automáticamente al iniciar sesión en un dispositivo nuevo. Como alternativa, restaurar desde una copia de seguridad de iCloud o iTunes incluirá todos los datos de Logica Coffee."], ["faq", "La app del Apple Watch no se sincroniza con mi iPhone. ¿Qué hago?", "Asegúrate de que ambos dispositivos usen la misma cuenta de Apple y de que el Bluetooth esté activado. Abre primero la app en tu iPhone y luego ábrela en tu Watch. Si el problema persiste, forzar el cierre y volver a abrir ambas apps suele resolverlo."], ["faq", "¿Cómo creo una receta personalizada?", "En la pestaña &ldquo;Preparación&rdquo;, toca &ldquo;Cambiar método o receta&rdquo;, elige &ldquo;Cambiar receta…&rdquo; y luego toca el botón + en la parte superior de la lista de recetas. Puedes añadir tantas fases como quieras, ajustando la cantidad de vertido, el tiempo y el tipo de agua de cada una. Más rápido aún: abre el menú ⋯ de cualquier receta incluida y elige &ldquo;Guardar como receta propia&rdquo; para obtener una copia editable."], ["faq", "¿Cómo comparto una receta con un amigo?", "En la pestaña &ldquo;Preparación&rdquo;, toca &ldquo;Cambiar método o receta&rdquo; y elige &ldquo;Cambiar receta…&rdquo;. Después toca el menú ⋯ de cualquier receta personalizada que hayas creado y elige &ldquo;Compartir receta&rdquo;. Obtendrás un código QR y un enlace que puedes enviar por Mensajes, Mail o donde quieras. Tu amigo toca el enlace (o escanea el código) para abrirlo en Logica Coffee, donde puede ver la receta en vista previa y añadirla a su propia biblioteca. Solo se pueden compartir las recetas personalizadas — y una receta nunca se añade automáticamente, así que siempre confirmas antes de que se guarde nada."], ["faq", "¿Qué métodos de preparación admite la app?", "Hario V60, AeroPress, Chemex, prensa francesa, Hario Switch, Clever Dripper, ORIGAMI Dripper, Kalita Wave, OXO Rapid Brewer, cafetera Moka, sifón, cold brew, café turco, Phin vietnamita, Ceado Hoop, espresso, ristretto, lungo, americano, capuchino, flat white, latte, cortado, macchiato y kopi de Singapur."], ["faq", "¿Cómo funciona el escáner de bolsas de café?", "Al añadir granos nuevos, toca el icono de escanear y haz una foto a tu bolsa de café. La app usa IA en el dispositivo para leer y rellenar automáticamente detalles como el tostador, el origen, el proceso y las notas de cata."], ["faq", "¿Cómo funcionan las sesiones guiadas de ajuste (Dial-in)?", "El ajuste no es solo para espresso — funciona con cualquier método. Inicia una sesión y la app te guía por un ciclo cerrado: preparas, le dices cómo sabía la taza (demasiado ácida, demasiado amarga, floja, equilibrada) y te sugiere un único ajuste concreto en la molienda, la dosis o la proporción para el siguiente intento. Registra cada paso para que veas exactamente cómo llegaste a tu receta perfecta, y puedes retomar una sesión más tarde justo donde la dejaste."], ["faq", "¿Qué es el Coach (James)?", "James es tu coach de café integrado. Dile qué preparaste y cómo sabía, y te explicará qué está pasando en la taza y qué cambiar a continuación — molienda, temperatura, proporción o técnica. Funciona por completo en tu dispositivo: sin cuenta, sin necesidad de conexión a internet, y nada de lo que le cuentes sale nunca de tu dispositivo."], ["faq", "¿Qué es el análisis de preparación en el dispositivo y por qué puede que no lo vea?", "En los iPhone y iPad compatibles —los que tienen Apple Intelligence activado— puedes pedirle a James que analice una preparación guardada, y el modelo de Apple en el dispositivo te da una lectura personalizada de la taza. Funciona por completo en tu dispositivo; no se envía nada a Apple, ni a nosotros, ni a ningún servidor. Lo encontrarás en los Ajustes de la app, dentro de Preferencias (Análisis en el dispositivo), activado por defecto donde esté disponible. Si tu dispositivo no es compatible con Apple Intelligence, no verás el interruptor, pero James sigue guiándote en cada preparación con el motor sin conexión integrado, así que no te pierdes nada."], ["faq", "¿Puede Logica Coffee registrar mi cafeína en Apple Health?", "Sí. En <strong>Ajustes → Apple Health</strong>, activa el registro de cafeína y concede el permiso. A partir de entonces, cada preparación que guardes registrará una cantidad estimada de cafeína en Apple Health, para que aparezca junto al resto de tus datos de salud. La app solo escribe este valor — nunca lee ninguno de tus datos de salud — y puedes desactivarlo o revocar el acceso en cualquier momento en la app Salud."], ["faq", "¿Cómo elimino todos mis datos?", "Puedes eliminar entradas individuales del diario y granos desde la app. Para eliminar todos los datos, desinstala la app. Si la sincronización con iCloud está activada, también puedes eliminar los datos de Logica Coffee en <strong>Ajustes → [Tu nombre] → iCloud → Gestionar almacenamiento de la cuenta</strong>."], ["faq", "Encontré un error. ¿Cómo lo informo?", "Escríbenos a <a href=\"mailto:khatskevich.mv@gmail.com\">khatskevich.mv@gmail.com</a> con una descripción de lo ocurrido, el modelo de tu iPhone y tu versión de iOS. Las capturas de pantalla siempre ayudan."], ["h2", "Privacidad"], ["p", "Logica Coffee no recopila, transmite ni comparte ningún dato personal. Lee la <a href=\"./privacy.html\">Política de Privacidad</a> completa."]]}, "fr": {"title": "Assistance", "updated": "Nous répondons généralement sous 24 heures", "blocks": [["highlight", "Une question, un bug repéré ou une suggestion ? Envoyez un e-mail — chaque message est lu personnellement."], ["contact", "E-mail", "En cas de signalement de bug, indiquez le modèle de votre iPhone et votre version d'iOS."], ["h2", "Foire aux questions"], ["faq", "Logica Coffee est-il gratuit ?", "Oui, entièrement. Pas d'abonnement, pas de paywall, pas de publicité. Toutes les fonctionnalités sont entièrement débloquées dès l'installation. Des pourboires facultatifs sont proposés dans l'app si vous souhaitez soutenir le développement — c'est entièrement votre choix."], ["faq", "Logica Coffee fonctionne-t-il sur iPad ?", "Oui — depuis la version 1.2.0, l'app est universelle. Sur iPad, vous retrouvez les mêmes fonctionnalités dans une disposition pensée pour le plus grand écran, avec des volets côte à côte pour l'extraction, votre journal et James. Si la synchronisation iCloud est activée, votre journal, vos grains et vos recettes restent automatiquement synchronisés entre votre iPhone et votre iPad."], ["faq", "Où mes données sont-elles stockées ?", "Toutes les entrées de votre journal d'extractions, votre inventaire de grains et vos recettes personnalisées sont stockés sur votre appareil. Si iCloud est activé, ils se synchronisent automatiquement entre vos appareils via votre compte iCloud personnel. Rien n'est envoyé à un quelconque serveur externe."], ["faq", "Comment sauvegarder ou transférer mes données vers un nouvel iPhone ?", "Si la synchronisation iCloud est activée, vos données sont transférées automatiquement lorsque vous vous connectez sur un nouvel appareil. Sinon, une restauration depuis une sauvegarde iCloud ou iTunes inclura toutes les données de Logica Coffee."], ["faq", "L'app Apple Watch ne se synchronise pas avec mon iPhone. Que faire ?", "Assurez-vous que les deux appareils utilisent le même identifiant Apple et que le Bluetooth est activé. Ouvrez d'abord l'app sur votre iPhone, puis lancez-la sur votre Watch. Si le problème persiste, forcer la fermeture puis rouvrir les deux apps le résout généralement."], ["faq", "Comment créer une recette personnalisée ?", "Dans l'onglet &ldquo;Extraction&rdquo;, touchez &ldquo;Changer méthode ou recette&rdquo;, choisissez &ldquo;Changer de recette…&rdquo;, puis touchez le bouton + en haut de la liste des recettes. Vous pouvez ajouter autant d'étapes que vous le souhaitez, en réglant le volume versé, le minutage et le type d'eau pour chacune. Plus rapide encore : ouvrez le menu ⋯ d'une recette intégrée et choisissez &ldquo;Enregistrer comme ma recette&rdquo; pour en obtenir une copie modifiable."], ["faq", "Comment partager une recette avec un ami ?", "Dans l'onglet &ldquo;Extraction&rdquo;, touchez &ldquo;Changer méthode ou recette&rdquo; et choisissez &ldquo;Changer de recette…&rdquo;. Touchez ensuite le menu ⋯ d'une recette personnalisée que vous avez créée, puis choisissez &ldquo;Partager la recette&rdquo;. Vous obtiendrez un code QR et un lien à envoyer via Messages, Mail ou ailleurs. Votre ami touche le lien (ou scanne le code) pour l'ouvrir dans Logica Coffee, où il peut prévisualiser la recette et l'ajouter à sa propre bibliothèque. Seules les recettes personnalisées peuvent être partagées — et une recette n'est jamais ajoutée automatiquement, vous confirmez donc toujours avant que quoi que ce soit ne soit enregistré."], ["faq", "Quelles méthodes d'extraction l'app prend-elle en charge ?", "Hario V60, AeroPress, Chemex, cafetière à piston, Hario Switch, Clever Dripper, ORIGAMI Dripper, Kalita Wave, OXO Rapid Brewer, cafetière Moka, siphon, cold brew, café turc, Phin vietnamien, Ceado Hoop, espresso, ristretto, lungo, americano, cappuccino, flat white, latte, cortado, macchiato et kopi de Singapour."], ["faq", "Comment fonctionne le scanner de paquets de café ?", "Lors de l'ajout de nouveaux grains, touchez l'icône de numérisation et prenez une photo de votre paquet de café. L'app utilise l'IA sur l'appareil pour lire et remplir automatiquement des détails comme le torréfacteur, l'origine, le procédé et les notes de dégustation."], ["faq", "Comment fonctionnent les sessions de réglage (Dial-in) guidées ?", "Le réglage n'est pas réservé à l'espresso — il fonctionne avec toutes les méthodes. Lancez une session et l'app vous guide dans une boucle fermée : extrayez, dites-lui le goût de la tasse (trop acide, trop amère, faible, équilibrée), et elle suggère un seul ajustement concret de la mouture, de la dose ou du ratio pour la prochaine tentative. Elle enregistre chaque étape pour que vous voyiez exactement comment vous êtes arrivé à votre recette parfaite, et vous pouvez reprendre une session plus tard là où vous l'aviez laissée."], ["faq", "Qu'est-ce que le Coach (James) ?", "James est votre coach café intégré. Dites-lui ce que vous avez préparé et quel goût cela avait, et il vous expliquera ce qui se passe dans la tasse et quoi changer ensuite — mouture, température, ratio ou technique. Il fonctionne entièrement sur votre appareil : aucun compte, aucune connexion internet requise, et rien de ce que vous lui dites ne quitte jamais votre appareil."], ["faq", "Qu’est-ce que l’analyse d’infusion sur l’appareil, et pourquoi pourrais-je ne pas la voir ?", "Sur les iPhone et iPad compatibles — ceux dont Apple Intelligence est activé — vous pouvez demander à James d’analyser une infusion enregistrée, et le modèle d’Apple sur l’appareil vous donne une lecture sur mesure de la tasse. Tout se passe sur votre appareil ; rien n’est envoyé à Apple, à nous, ni à aucun serveur. Vous la trouverez dans les Réglages de l’app, sous Préférences (Analyse sur l’appareil), activée par défaut là où elle est disponible. Si votre appareil ne prend pas en charge Apple Intelligence, vous ne verrez pas l’option — mais James continue de vous accompagner à chaque infusion grâce au moteur hors ligne intégré, vous ne perdez donc rien."], ["faq", "Logica Coffee peut-il enregistrer ma caféine dans Apple Santé ?", "Oui. Dans <strong>Réglages → Apple Santé</strong>, activez l'enregistrement de la caféine et accordez l'autorisation. Dès lors, chaque extraction que vous enregistrez inscrit une quantité estimée de caféine dans Apple Santé, afin qu'elle apparaisse aux côtés du reste de vos données de santé. L'app ne fait qu'écrire cette valeur — elle ne lit jamais aucune de vos données de santé — et vous pouvez la désactiver ou révoquer l'accès à tout moment dans l'app Santé."], ["faq", "Comment supprimer toutes mes données ?", "Vous pouvez supprimer des entrées de journal et des grains individuels depuis l'app. Pour tout supprimer, désinstallez l'app. Si la synchronisation iCloud est activée, vous pouvez aussi supprimer les données de Logica Coffee dans <strong>Réglages → [Votre nom] → iCloud → Gérer le stockage du compte</strong>."], ["faq", "J'ai trouvé un bug. Comment le signaler ?", "Écrivez-nous à <a href=\"mailto:khatskevich.mv@gmail.com\">khatskevich.mv@gmail.com</a> avec une description de ce qui s'est passé, le modèle de votre iPhone et votre version d'iOS. Les captures d'écran sont toujours utiles."], ["h2", "Confidentialité"], ["p", "Logica Coffee ne collecte, ne transmet ni ne partage aucune donnée personnelle. Lisez l'intégralité de la <a href=\"./privacy.html\">politique de confidentialité</a>."]]}, "it": {"title": "Assistenza", "updated": "Di solito rispondiamo entro 24 ore", "blocks": [["highlight", "Hai una domanda, hai trovato un bug o vuoi suggerire qualcosa? Manda una e-mail — ogni messaggio viene letto personalmente."], ["contact", "E-mail", "Se segnali un bug, indica il modello del tuo iPhone e la tua versione di iOS."], ["h2", "Domande frequenti"], ["faq", "Logica Coffee è gratuito?", "Sì, completamente. Nessun abbonamento, nessun paywall, nessuna pubblicità. Ogni funzione è completamente sbloccata dal momento dell'installazione. All'interno sono disponibili mance facoltative, se vuoi sostenere lo sviluppo — del tutto a tua scelta."], ["faq", "Logica Coffee funziona su iPad?", "Sì — dalla versione 1.2.0 l'app è universale. Su iPad ritrovi le stesse funzioni in un layout pensato per lo schermo più grande, con riquadri affiancati per l'estrazione, il tuo diario e James. Se la sincronizzazione iCloud è attiva, il tuo diario, i tuoi chicchi e le tue ricette restano automaticamente allineati tra il tuo iPhone e il tuo iPad."], ["faq", "Dove vengono archiviati i miei dati?", "Tutte le voci del tuo diario delle estrazioni, l'inventario dei chicchi e le ricette personalizzate vengono archiviati sul tuo dispositivo. Se hai iCloud attivo, si sincronizzano automaticamente tra i tuoi dispositivi tramite il tuo account iCloud personale. Nulla viene inviato ad alcun server esterno."], ["faq", "Come eseguo il backup o trasferisco i miei dati su un nuovo iPhone?", "Se la sincronizzazione iCloud è attiva, i tuoi dati vengono trasferiti automaticamente quando accedi su un nuovo dispositivo. In alternativa, il ripristino da un backup iCloud o iTunes includerà tutti i dati di Logica Coffee."], ["faq", "L'app per Apple Watch non si sincronizza con il mio iPhone. Cosa faccio?", "Assicurati che entrambi i dispositivi usino lo stesso ID Apple e che il Bluetooth sia attivo. Apri prima l'app sul tuo iPhone, poi avviala sul tuo Watch. Se il problema persiste, forzare la chiusura e riaprire entrambe le app di solito lo risolve."], ["faq", "Come creo una ricetta personalizzata?", "Nella scheda &ldquo;Estrazione&rdquo; tocca &ldquo;Cambia metodo o ricetta&rdquo;, scegli &ldquo;Cambia ricetta…&rdquo; e poi tocca il pulsante + in alto nell'elenco delle ricette. Puoi aggiungere tutte le fasi che vuoi, impostando per ciascuna la quantità di versamento, i tempi e il tipo di acqua. Ancora più veloce: apri il menu ⋯ di una ricetta inclusa e scegli &ldquo;Salva come ricetta personale&rdquo; per averne una copia modificabile."], ["faq", "Come condivido una ricetta con un amico?", "Nella scheda &ldquo;Estrazione&rdquo; tocca &ldquo;Cambia metodo o ricetta&rdquo; e scegli &ldquo;Cambia ricetta…&rdquo;. Poi tocca il menu ⋯ di una qualsiasi ricetta personalizzata che hai creato e scegli &ldquo;Condividi ricetta&rdquo;. Otterrai un codice QR e un link da inviare tramite Messaggi, Mail o altrove. Il tuo amico tocca il link (o scansiona il codice) per aprirlo in Logica Coffee, dove può vedere l'anteprima della ricetta e aggiungerla alla propria libreria. Solo le ricette personalizzate possono essere condivise — e una ricetta non viene mai aggiunta automaticamente, quindi confermi sempre prima che qualcosa venga salvato."], ["faq", "Quali metodi di estrazione supporta l'app?", "Hario V60, AeroPress, Chemex, French press, Hario Switch, Clever Dripper, ORIGAMI Dripper, Kalita Wave, OXO Rapid Brewer, caffettiera Moka, syphon, cold brew, caffè turco, Phin vietnamita, Ceado Hoop, espresso, ristretto, lungo, americano, cappuccino, flat white, latte, cortado, macchiato e kopi di Singapore."], ["faq", "Come funziona lo scanner dei sacchetti di caffè?", "Quando aggiungi nuovi chicchi, tocca l'icona di scansione e scatta una foto del tuo sacchetto di caffè. L'app usa l'IA sul dispositivo per leggere e compilare automaticamente dettagli come la torrefazione, l'origine, il processo e le note di degustazione."], ["faq", "Come funzionano le sessioni di dial-in guidate?", "Il dial-in non è solo per l'espresso — funziona con qualsiasi metodo. Avvia una sessione e l'app ti guida in un ciclo chiuso: estrai, dille com'era la tazza (troppo acida, troppo amara, debole, bilanciata), e ti suggerisce un'unica regolazione concreta di macinatura, dose o rapporto per il tentativo successivo. Registra ogni passaggio così vedi esattamente come sei arrivato alla tua ricetta perfetta, e puoi riprendere una sessione più tardi esattamente da dove l'avevi lasciata."], ["faq", "Cos'è il Coach (James)?", "James è il tuo coach del caffè integrato. Digli cosa hai preparato e com'era il sapore e ti spiegherà cosa sta succedendo nella tazza e cosa cambiare la prossima volta — macinatura, temperatura, rapporto o tecnica. Funziona interamente sul tuo dispositivo: nessun account, nessuna connessione internet richiesta, e nulla di ciò che gli dici lascia mai il tuo dispositivo."], ["faq", "Che cos’è l’analisi dell’estrazione sul dispositivo e perché potrei non vederla?", "Sugli iPhone e iPad compatibili — quelli con Apple Intelligence attivo — puoi chiedere a James di analizzare un’estrazione registrata, e il modello di Apple sul dispositivo ti offre una lettura su misura della tazza. Funziona interamente sul tuo dispositivo; nulla viene inviato ad Apple, a noi o a qualsiasi server. La trovi nelle Impostazioni dell’app, in Preferenze (Analisi sul dispositivo), attiva per impostazione predefinita dove è disponibile. Se il tuo dispositivo non supporta Apple Intelligence, non vedrai l’interruttore — ma James continua a guidarti in ogni estrazione con il motore offline integrato, così non ti perdi nulla."], ["faq", "Logica Coffee può registrare la mia caffeina in Apple Salute?", "Sì. In <strong>Impostazioni → Apple Salute</strong>, attiva la registrazione della caffeina e concedi il permesso. Da quel momento, ogni estrazione che salvi scrive una quantità stimata di caffeina in Apple Salute, così compare insieme al resto dei tuoi dati sulla salute. L'app si limita a scrivere questo valore — non legge mai alcun tuo dato sulla salute — e puoi disattivarlo o revocare l'accesso in qualsiasi momento nell'app Salute."], ["faq", "Come elimino tutti i miei dati?", "Puoi eliminare singole voci del diario e singoli chicchi dall'app. Per rimuovere tutti i dati, disinstalla l'app. Se la sincronizzazione iCloud è attiva, puoi anche rimuovere i dati di Logica Coffee da <strong>Impostazioni → [Il tuo nome] → iCloud → Gestisci archivio account</strong>."], ["faq", "Ho trovato un bug. Come lo segnalo?", "Scrivici a <a href=\"mailto:khatskevich.mv@gmail.com\">khatskevich.mv@gmail.com</a> con una descrizione di cosa è successo, il modello del tuo iPhone e la tua versione di iOS. Gli screenshot sono sempre utili."], ["h2", "Privacy"], ["p", "Logica Coffee non raccoglie, trasmette né condivide alcun dato personale. Leggi l'<a href=\"./privacy.html\">Informativa sulla privacy</a> completa."]]}, "ja": {"title": "サポート", "updated": "通常24時間以内に返信します", "blocks": [["highlight", "ご質問、バグの発見、ご提案はありますか？メールをお送りください — すべてのメッセージに目を通しています。"], ["contact", "メール", "バグを報告する場合は、お使いのiPhoneのモデルとiOSのバージョンを記載してください。"], ["h2", "よくある質問"], ["faq", "Logica Coffeeは無料ですか？", "はい、完全に無料です。サブスクリプション、ペイウォール、広告はありません。インストールした瞬間からすべての機能が完全に利用できます。開発を支援したい場合は、アプリ内に任意のチップが用意されています — 完全にあなたの自由です。"], ["faq", "Logica CoffeeはiPadで使えますか？", "はい — バージョン1.2.0以降、アプリはユニバーサル対応です。iPadでは、大きな画面に合わせて設計されたレイアウトで同じ機能をお使いいただけ、抽出・ジャーナル・ジェームズを左右に並べたペインで表示します。iCloud同期がオンになっていれば、ジャーナル、豆、レシピがiPhoneとiPadの間で自動的に同期された状態に保たれます。"], ["faq", "私のデータはどこに保存されますか？", "抽出ジャーナルの記録、豆の在庫、カスタムレシピはすべてあなたのデバイスに保存されます。iCloudが有効な場合、あなた個人のiCloudアカウントを通じてデバイス間で自動的に同期されます。外部サーバーには何も送信されません。"], ["faq", "新しいiPhoneにデータをバックアップまたは転送するには？", "iCloud同期が有効な場合、新しいデバイスでサインインするとデータが自動的に転送されます。あるいは、iCloudまたはiTunesのバックアップから復元すると、すべてのLogica Coffeeのデータが含まれます。"], ["faq", "Apple WatchアプリがiPhoneと同期しません。どうすればいいですか？", "両方のデバイスが同じApple IDを使用しており、Bluetoothが有効になっていることを確認してください。まずiPhoneでアプリを開き、それからWatchで起動してください。問題が続く場合は、両方のアプリを強制終了して再度開くと通常は解決します。"], ["faq", "カスタムレシピを作成するには？", "&ldquo;抽出&rdquo;タブで&ldquo;抽出方法・レシピを変更&rdquo;をタップし、&ldquo;レシピを変更…&rdquo;を選んで、レシピ一覧の上部にある + ボタンをタップします。好きなだけステージを追加でき、それぞれに注湯量、タイミング、水の種類を設定できます。さらに手軽な方法として、既存のレシピの ⋯ メニューを開いて&ldquo;マイレシピとして保存&rdquo;を選べば、自由に編集できるコピーが手に入ります。"], ["faq", "友達とレシピを共有するには？", "&ldquo;抽出&rdquo;タブで&ldquo;抽出方法・レシピを変更&rdquo;をタップし、&ldquo;レシピを変更…&rdquo;を選びます。次に、自分で作成したカスタムレシピの ⋯ メニューをタップして&ldquo;レシピを共有&rdquo;を選びます。QRコードとリンクが得られ、メッセージ、メール、その他どこにでも送信できます。友達がリンクをタップ（またはコードをスキャン）するとLogica Coffeeで開き、レシピをプレビューして自分のライブラリに追加できます。共有できるのはカスタムレシピのみで、レシピが自動的に追加されることは決してないため、保存前に必ず確認します。"], ["faq", "アプリはどの抽出メソッドに対応していますか？", "Hario V60、エアロプレス、ケメックス、フレンチプレス、Hario Switch、Clever Dripper、ORIGAMI Dripper、Kalita Wave、OXO Rapid Brewer、モカポット、サイフォン、コールドブリュー、トルココーヒー、ベトナムのフィン、Ceado Hoop、エスプレッソ、リストレット、ルンゴ、アメリカーノ、カプチーノ、フラットホワイト、ラテ、コルタード、マキアート、シンガポールのコピ。"], ["faq", "コーヒーバッグスキャナーはどのように機能しますか？", "新しい豆を追加するときにスキャンアイコンをタップして、コーヒーバッグの写真を撮ります。アプリはオンデバイスAIを使用して、焙煎所、産地、精製方法、テイスティングノートなどの詳細を自動的に読み取って入力します。"], ["faq", "ガイド付きダイヤルインセッションはどのように機能しますか？", "ダイヤルインはエスプレッソだけのものではありません — どのメソッドでも機能します。セッションを開始すると、アプリは閉じたループであなたを導きます：抽出し、カップの味（酸っぱすぎる、苦すぎる、薄い、バランスが良い）を伝えると、次の試行に向けて挽き目、分量、比率への具体的な調整を1つ提案します。すべてのステップを記録するので、どのように完璧なレシピにたどり着いたかを正確に確認でき、セッションは後で中断したところから再開できます。"], ["faq", "コーチ（James）とは？", "Jamesはあなたの内蔵コーヒーコーチです。何を淹れてどんな味だったかを伝えると、カップで何が起きているか、次に何を変えるべきか — 挽き目、温度、比率、テクニック — を説明します。完全にあなたのデバイス上で動作します：アカウント不要、インターネット接続不要で、あなたが伝えたことがデバイスから外に出ることは決してありません。"], ["faq", "デバイス内での抽出分析とは何ですか？また、表示されないことがあるのはなぜですか？", "対応するiPhoneやiPad（Apple Intelligenceをオンにしたもの）では、記録した抽出の分析をジェームズに頼むことができ、Appleのオンデバイスモデルがそのカップに合わせた読み解きを返します。処理はすべてお使いのデバイス内で完結し、Appleにも、私たちにも、どのサーバーにも何も送信されません。アプリの「設定」内の「環境設定」（デバイス内分析）にあり、利用できる環境では初期状態でオンになっています。お使いのデバイスがApple Intelligenceに対応していない場合、このスイッチは表示されませんが、ジェームズは内蔵のオフラインエンジンで引き続きすべての抽出をサポートするので、見逃すことはありません。"], ["faq", "Logica CoffeeはカフェインをAppleヘルスケアに記録できますか？", "はい。<strong>設定 → Appleヘルスケア</strong>でカフェイン記録をオンにして許可を与えます。それ以降、保存する各抽出が推定カフェイン量をAppleヘルスケアに記録し、他の健康データと並んで表示されます。アプリはこの値を書き込むだけで — あなたの健康データを読み取ることは決してありません — ヘルスケアアプリでいつでもオフにしたりアクセスを取り消したりできます。"], ["faq", "すべてのデータを削除するには？", "ジャーナルの個々の記録や豆はアプリ内から削除できます。すべてのデータを削除するには、アプリをアンインストールします。iCloud同期が有効な場合は、<strong>設定 → [あなたの名前] → iCloud → アカウントのストレージを管理</strong>からLogica Coffeeのデータを削除することもできます。"], ["faq", "バグを見つけました。どう報告すればいいですか？", "<a href=\"mailto:khatskevich.mv@gmail.com\">khatskevich.mv@gmail.com</a>まで、何が起きたかの説明、お使いのiPhoneのモデル、iOSのバージョンを添えてメールしてください。スクリーンショットがあるといつも助かります。"], ["h2", "プライバシー"], ["p", "Logica Coffeeは、いかなる個人データも収集、送信、共有しません。<a href=\"./privacy.html\">プライバシーポリシー</a>の全文をお読みください。"]]}, "pl": {"title": "Pomoc", "updated": "Zazwyczaj odpowiadamy w ciągu 24 godzin", "blocks": [["highlight", "Masz pytanie, znalazłeś błąd lub chcesz coś zasugerować? Napisz e-mail — każda wiadomość jest czytana osobiście."], ["contact", "E-mail", "Zgłaszając błąd, podaj model swojego iPhone'a i wersję iOS."], ["h2", "Najczęściej zadawane pytania"], ["faq", "Czy Logica Coffee jest darmowa?", "Tak, całkowicie. Bez subskrypcji, bez paywalla, bez reklam. Wszystkie funkcje są w pełni odblokowane od momentu instalacji. W środku dostępne są opcjonalne napiwki, jeśli chcesz wesprzeć rozwój — całkowicie według Twojego uznania."], ["faq", "Czy Logica Coffee działa na iPadzie?", "Tak — od wersji 1.2.0 aplikacja jest uniwersalna. Na iPadzie masz te same funkcje w układzie zaprojektowanym z myślą o większym ekranie, z panelami obok siebie do parzenia, Twojego dziennika i Jamesa. Jeśli synchronizacja iCloud jest włączona, Twój dziennik, ziarna i przepisy pozostają automatycznie zsynchronizowane między Twoim iPhonem a iPadem."], ["faq", "Gdzie przechowywane są moje dane?", "Wszystkie wpisy Twojego dziennika parzeń, zapas ziaren i własne przepisy są przechowywane na Twoim urządzeniu. Jeśli iCloud jest włączony, synchronizują się automatycznie między Twoimi urządzeniami za pośrednictwem Twojego osobistego konta iCloud. Nic nie jest wysyłane na żaden zewnętrzny serwer."], ["faq", "Jak utworzyć kopię zapasową lub przenieść dane na nowego iPhone'a?", "Jeśli synchronizacja iCloud jest włączona, Twoje dane przenoszą się automatycznie po zalogowaniu na nowym urządzeniu. Alternatywnie, przywrócenie z kopii zapasowej iCloud lub iTunes obejmie wszystkie dane Logica Coffee."], ["faq", "Aplikacja Apple Watch nie synchronizuje się z moim iPhonem. Co robić?", "Upewnij się, że oba urządzenia korzystają z tego samego Apple ID i że Bluetooth jest włączony. Najpierw otwórz aplikację na iPhonie, a następnie uruchom ją na Watch. Jeśli problem nadal występuje, zwykle pomaga wymuszenie zamknięcia i ponowne otwarcie obu aplikacji."], ["faq", "Jak utworzyć własny przepis?", "Na karcie &ldquo;Parzenie&rdquo; stuknij &ldquo;Zmień metodę lub przepis&rdquo;, wybierz &ldquo;Zmień przepis…&rdquo;, a następnie stuknij przycisk + u góry listy przepisów. Możesz dodać dowolną liczbę etapów, ustawiając dla każdego ilość wlewanej wody, czas i rodzaj wody. Jeszcze szybciej: otwórz menu ⋯ przy dowolnym wbudowanym przepisie i wybierz &ldquo;Zapisz jako własny przepis&rdquo; — dostaniesz edytowalną kopię."], ["faq", "Jak udostępnić przepis znajomemu?", "Na karcie &ldquo;Parzenie&rdquo; stuknij &ldquo;Zmień metodę lub przepis&rdquo; i wybierz &ldquo;Zmień przepis…&rdquo;. Następnie stuknij menu ⋯ przy dowolnym utworzonym przez siebie własnym przepisie i wybierz &ldquo;Udostępnij przepis&rdquo;. Otrzymasz kod QR i link, który możesz wysłać przez Wiadomości, Mail lub gdziekolwiek indziej. Twój znajomy stuka link (lub skanuje kod), aby otworzyć go w Logica Coffee, gdzie może wyświetlić podgląd przepisu i dodać go do własnej biblioteki. Udostępniać można tylko własne przepisy — a przepis nigdy nie jest dodawany automatycznie, więc zawsze potwierdzasz przed zapisaniem."], ["faq", "Jakie metody parzenia obsługuje aplikacja?", "Hario V60, AeroPress, Chemex, French press, Hario Switch, Clever Dripper, ORIGAMI Dripper, Kalita Wave, OXO Rapid Brewer, kawiarka (moka), syfon, cold brew, kawa po turecku, wietnamski Phin, Ceado Hoop, espresso, ristretto, lungo, americano, cappuccino, flat white, latte, cortado, macchiato i kopi z Singapuru."], ["faq", "Jak działa skaner opakowań kawy?", "Dodając nowe ziarna, stuknij ikonę skanowania i zrób zdjęcie swojego opakowania kawy. Aplikacja używa AI na urządzeniu, aby automatycznie odczytać i uzupełnić szczegóły, takie jak palarnia, pochodzenie, obróbka i notatki degustacyjne."], ["faq", "Jak działają prowadzone sesje dial-in?", "Dial-in nie jest tylko dla espresso — działa z każdą metodą. Rozpocznij sesję, a aplikacja przeprowadzi Cię przez zamkniętą pętlę: zaparz, powiedz jej, jak smakowała filiżanka (zbyt kwaśna, zbyt gorzka, słaba, zrównoważona), a ona zaproponuje jedną konkretną korektę zmielenia, dawki lub proporcji na następną próbę. Zapisuje każdy krok, abyś widział dokładnie, jak doszedłeś do swojego idealnego przepisu, a sesję możesz wznowić później dokładnie tam, gdzie ją przerwałeś."], ["faq", "Czym jest Coach (James)?", "James to Twój wbudowany trener kawowy. Powiedz mu, co zaparzyłeś i jak smakowało, a wyjaśni, co dzieje się w filiżance i co zmienić następnym razem — zmielenie, temperaturę, proporcję lub technikę. Działa w całości na Twoim urządzeniu: bez konta, bez wymaganego połączenia z internetem, a nic, co mu powiesz, nigdy nie opuszcza Twojego urządzenia."], ["faq", "Czym jest analiza parzenia na urządzeniu i dlaczego mogę jej nie widzieć?", "Na obsługiwanych iPhone’ach i iPadach — tych z włączoną Apple Intelligence — możesz poprosić Jamesa o przeanalizowanie zapisanego parzenia, a działający na urządzeniu model Apple daje spersonalizowaną ocenę filiżanki. Wszystko dzieje się na Twoim urządzeniu; nic nie jest wysyłane do Apple, do nas ani na żaden serwer. Znajdziesz ją w Ustawieniach aplikacji, w sekcji Preferencje (Analiza na urządzeniu), domyślnie włączoną tam, gdzie jest dostępna. Jeśli Twoje urządzenie nie obsługuje Apple Intelligence, nie zobaczysz przełącznika — ale James i tak podpowiada przy każdym parzeniu dzięki wbudowanemu silnikowi offline, więc nic Cię nie omija."], ["faq", "Czy Logica Coffee może zapisywać moją kofeinę w Apple Zdrowie?", "Tak. W <strong>Ustawienia → Apple Zdrowie</strong> włącz zapisywanie kofeiny i udziel zgody. Od tej pory każde zapisane parzenie zapisuje szacunkową ilość kofeiny w Apple Zdrowie, aby pojawiała się obok reszty Twoich danych zdrowotnych. Aplikacja jedynie zapisuje tę wartość — nigdy nie odczytuje żadnych Twoich danych zdrowotnych — a możesz to wyłączyć lub cofnąć dostęp w dowolnym momencie w aplikacji Zdrowie."], ["faq", "Jak usunąć wszystkie moje dane?", "Możesz usuwać pojedyncze wpisy dziennika i ziarna z poziomu aplikacji. Aby usunąć wszystkie dane, odinstaluj aplikację. Jeśli synchronizacja iCloud jest włączona, możesz też usunąć dane Logica Coffee w <strong>Ustawienia → [Twoje imię] → iCloud → Zarządzaj pamięcią konta</strong>."], ["faq", "Znalazłem błąd. Jak go zgłosić?", "Napisz do nas na <a href=\"mailto:khatskevich.mv@gmail.com\">khatskevich.mv@gmail.com</a> z opisem tego, co się stało, modelem swojego iPhone'a i wersją iOS. Zrzuty ekranu zawsze są pomocne."], ["h2", "Prywatność"], ["p", "Logica Coffee nie zbiera, nie przesyła ani nie udostępnia żadnych danych osobowych. Przeczytaj pełną <a href=\"./privacy.html\">Politykę prywatności</a>."]]}, "pt-BR": {"title": "Suporte", "updated": "Normalmente respondemos em até 24 horas", "blocks": [["highlight", "Tem uma pergunta, encontrou um bug ou quer sugerir algo? Mande um e-mail — cada mensagem é lida pessoalmente."], ["contact", "E-mail", "Ao relatar um bug, inclua o modelo do seu iPhone e a sua versão do iOS."], ["h2", "Perguntas frequentes"], ["faq", "O Logica Coffee é gratuito?", "Sim, totalmente. Sem assinatura, sem paywall, sem anúncios. Todos os recursos ficam totalmente desbloqueados desde o momento em que você o instala. Há gorjetas opcionais dentro do app, caso você queira apoiar o desenvolvimento — totalmente a seu critério."], ["faq", "O Logica Coffee funciona no iPad?", "Sim — a partir da versão 1.2.0 o app é universal. No iPad você tem os mesmos recursos em um layout pensado para a tela maior, com painéis lado a lado para o preparo, o seu diário e o James. Se a sincronização com o iCloud estiver ativada, seu diário, seus grãos e suas receitas ficam em sincronia automaticamente entre o seu iPhone e o seu iPad."], ["faq", "Onde meus dados são armazenados?", "Todas as entradas do seu diário de preparos, seu estoque de grãos e suas receitas personalizadas são armazenados no seu dispositivo. Se você tiver o iCloud ativado, eles sincronizam automaticamente entre seus dispositivos pela sua conta pessoal do iCloud. Nada é enviado a nenhum servidor externo."], ["faq", "Como faço backup ou transfiro meus dados para um novo iPhone?", "Se a sincronização com o iCloud estiver ativada, seus dados são transferidos automaticamente ao entrar em um novo dispositivo. Como alternativa, restaurar a partir de um backup do iCloud ou do iTunes incluirá todos os dados do Logica Coffee."], ["faq", "O app do Apple Watch não está sincronizando com o meu iPhone. O que faço?", "Verifique se os dois dispositivos usam o mesmo ID Apple e se o Bluetooth está ativado. Abra o app primeiro no seu iPhone e depois inicie-o no seu Watch. Se o problema persistir, forçar o encerramento e reabrir os dois apps costuma resolver."], ["faq", "Como crio uma receita personalizada?", "Na aba &ldquo;Preparo&rdquo;, toque em &ldquo;Mudar método ou receita&rdquo;, escolha &ldquo;Mudar receita…&rdquo; e toque no botão + no topo da lista de receitas. Você pode adicionar quantas etapas quiser, definindo a quantidade de despejo, o tempo e o tipo de água de cada uma. Mais rápido ainda: abra o menu ⋯ de qualquer receita nativa e escolha &ldquo;Salvar como receita própria&rdquo; para ter uma cópia editável."], ["faq", "Como compartilho uma receita com um amigo?", "Na aba &ldquo;Preparo&rdquo;, toque em &ldquo;Mudar método ou receita&rdquo; e escolha &ldquo;Mudar receita…&rdquo;. Depois toque no menu ⋯ de qualquer receita personalizada que você criou e escolha &ldquo;Compartilhar receita&rdquo;. Você receberá um código QR e um link para enviar por Mensagens, Mail ou em qualquer outro lugar. Seu amigo toca no link (ou escaneia o código) para abri-lo no Logica Coffee, onde pode pré-visualizar a receita e adicioná-la à própria biblioteca. Só receitas personalizadas podem ser compartilhadas — e uma receita nunca é adicionada automaticamente, então você sempre confirma antes de algo ser salvo."], ["faq", "Quais métodos de preparo o app suporta?", "Hario V60, AeroPress, Chemex, prensa francesa, Hario Switch, Clever Dripper, ORIGAMI Dripper, Kalita Wave, OXO Rapid Brewer, cafeteira moka, sifão, cold brew, café turco, Phin vietnamita, Ceado Hoop, espresso, ristretto, lungo, americano, cappuccino, flat white, latte, cortado, macchiato e kopi de Singapura."], ["faq", "Como funciona o scanner de pacotes de café?", "Ao adicionar novos grãos, toque no ícone de digitalização e tire uma foto do seu pacote de café. O app usa IA no dispositivo para ler e preencher automaticamente detalhes como o torrefador, a origem, o processo e as notas de degustação."], ["faq", "Como funcionam as sessões guiadas de dial-in?", "O dial-in não é só para espresso — funciona com qualquer método. Inicie uma sessão e o app o conduz por um ciclo fechado: prepare, diga como a xícara ficou (muito ácida, muito amarga, fraca, equilibrada) e ele sugere um único ajuste concreto de moagem, dose ou proporção para a próxima tentativa. Ele registra cada etapa para você ver exatamente como chegou à sua receita perfeita, e você pode retomar uma sessão mais tarde exatamente de onde parou."], ["faq", "O que é o Coach (James)?", "James é o seu coach de café integrado. Diga a ele o que você preparou e como ficou o sabor, e ele explicará o que está acontecendo na xícara e o que mudar em seguida — moagem, temperatura, proporção ou técnica. Ele funciona inteiramente no seu dispositivo: sem conta, sem necessidade de conexão com a internet, e nada do que você conta a ele jamais sai do seu dispositivo."], ["faq", "O que é a análise de preparo no dispositivo e por que posso não vê-la?", "Nos iPhones e iPads compatíveis — aqueles com a Apple Intelligence ativada — você pode pedir ao James para analisar um preparo registrado, e o modelo da Apple no dispositivo dá uma leitura personalizada da xícara. Tudo acontece no seu dispositivo; nada é enviado à Apple, a nós ou a qualquer servidor. Você encontra o recurso nos Ajustes do app, em Preferências (Análise no dispositivo), ativado por padrão onde estiver disponível. Se o seu dispositivo não for compatível com a Apple Intelligence, você não verá a opção — mas o James continua orientando cada preparo com o motor offline integrado, então você não fica de fora."], ["faq", "O Logica Coffee pode registrar minha cafeína no Apple Saúde?", "Sim. Em <strong>Ajustes → Apple Saúde</strong>, ative o registro de cafeína e conceda a permissão. A partir daí, cada preparo que você salva grava uma quantidade estimada de cafeína no Apple Saúde, para aparecer junto com o restante dos seus dados de saúde. O app apenas grava esse valor — nunca lê nenhum dos seus dados de saúde — e você pode desativá-lo ou revogar o acesso a qualquer momento no app Saúde."], ["faq", "Como excluo todos os meus dados?", "Você pode excluir entradas individuais do diário e grãos pelo app. Para remover todos os dados, desinstale o app. Se a sincronização com o iCloud estiver ativada, você também pode remover os dados do Logica Coffee em <strong>Ajustes → [Seu nome] → iCloud → Gerenciar Armazenamento da Conta</strong>."], ["faq", "Encontrei um bug. Como relato?", "Escreva para <a href=\"mailto:khatskevich.mv@gmail.com\">khatskevich.mv@gmail.com</a> com uma descrição do que aconteceu, o modelo do seu iPhone e a sua versão do iOS. Capturas de tela sempre ajudam."], ["h2", "Privacidade"], ["p", "O Logica Coffee não coleta, transmite nem compartilha nenhum dado pessoal. Leia a <a href=\"./privacy.html\">Política de Privacidade</a> completa."]]}, "ru": {"title": "Поддержка", "updated": "Обычно мы отвечаем в течение 24 часов", "blocks": [["highlight", "Есть вопрос, нашли ошибку или хотите что-то предложить? Напишите на почту — каждое сообщение читается лично."], ["contact", "Почта", "Если сообщаете об ошибке, укажите модель вашего iPhone и версию iOS."], ["h2", "Часто задаваемые вопросы"], ["faq", "Logica Coffee бесплатный?", "Да, полностью. Без подписки, без платного доступа, без рекламы. Все функции полностью разблокированы с момента установки. Внутри доступны необязательные чаевые, если вы хотите поддержать разработку — полностью на ваш выбор."], ["faq", "Работает ли Logica Coffee на iPad?", "Да — начиная с версии 1.2.0 приложение универсальное. На iPad вы получаете те же функции в оформлении, продуманном для большего экрана, с расположенными рядом панелями для заваривания, вашего журнала и Джеймса. Если синхронизация iCloud включена, ваш журнал, зёрна и рецепты автоматически остаются синхронизированными между вашим iPhone и iPad."], ["faq", "Где хранятся мои данные?", "Все записи вашего журнала заварок, запас зёрен и собственные рецепты хранятся на вашем устройстве. Если у вас включён iCloud, они автоматически синхронизируются между вашими устройствами через вашу личную учётную запись iCloud. Ничего не отправляется на внешние серверы."], ["faq", "Как сделать резервную копию или перенести данные на новый iPhone?", "Если синхронизация iCloud включена, ваши данные переносятся автоматически при входе на новом устройстве. Кроме того, восстановление из резервной копии iCloud или iTunes включит все данные Logica Coffee."], ["faq", "Приложение Apple Watch не синхронизируется с моим iPhone. Что делать?", "Убедитесь, что оба устройства используют один и тот же Apple ID и что Bluetooth включён. Сначала откройте приложение на iPhone, затем запустите его на Watch. Если проблема сохраняется, обычно помогает принудительно закрыть и снова открыть оба приложения."], ["faq", "Как создать собственный рецепт?", "На вкладке &ldquo;Заваривание&rdquo; нажмите &ldquo;Сменить метод или рецепт&rdquo;, выберите &ldquo;Сменить рецепт…&rdquo; и нажмите кнопку + вверху списка рецептов. Вы можете добавить сколько угодно этапов, задавая для каждого объём пролива, тайминг и тип воды. Ещё быстрее: откройте меню ⋯ у любого встроенного рецепта и выберите &ldquo;Сохранить как свой рецепт&rdquo; — получите копию, которую можно править."], ["faq", "Как поделиться рецептом с другом?", "На вкладке &ldquo;Заваривание&rdquo; нажмите &ldquo;Сменить метод или рецепт&rdquo; и выберите &ldquo;Сменить рецепт…&rdquo;. Затем нажмите меню ⋯ у любого созданного вами собственного рецепта и выберите &ldquo;Поделиться рецептом&rdquo;. Вы получите QR-код и ссылку, которые можно отправить через Сообщения, Почту или куда угодно. Ваш друг нажимает на ссылку (или сканирует код), чтобы открыть её в Logica Coffee, где он может просмотреть рецепт и добавить его в свою библиотеку. Делиться можно только собственными рецептами — и рецепт никогда не добавляется автоматически, так что вы всегда подтверждаете перед сохранением."], ["faq", "Какие методы заваривания поддерживает приложение?", "Hario V60, AeroPress, Chemex, френч-пресс, Hario Switch, Clever Dripper, ORIGAMI Dripper, Kalita Wave, OXO Rapid Brewer, гейзерная кофеварка (мока), сифон, колд брю, турецкий кофе, вьетнамский фин, Ceado Hoop, эспрессо, ристретто, лунго, американо, капучино, флэт уайт, латте, кортадо, макиато и сингапурский копи."], ["faq", "Как работает сканер пакетов кофе?", "При добавлении новых зёрен нажмите на значок сканирования и сфотографируйте пакет кофе. Приложение использует ИИ на устройстве, чтобы автоматически считать и заполнить такие детали, как обжарщик, происхождение, обработка и дегустационные заметки."], ["faq", "Как работают пошаговые сессии настройки (dial-in)?", "Настройка не только для эспрессо — она работает с любым методом. Начните сессию, и приложение проведёт вас по замкнутому циклу: заварите, скажите, каким был вкус чашки (слишком кислая, слишком горькая, слабая, сбалансированная), и оно предложит одну конкретную корректировку помола, дозы или пропорции для следующей попытки. Оно записывает каждый шаг, чтобы вы видели в точности, как пришли к идеальному рецепту, и вы можете вернуться к сессии позже ровно с того места, где остановились."], ["faq", "Что такое Коуч (Джеймс)?", "Джеймс — это ваш встроенный кофейный коуч. Расскажите ему, что вы заварили и каким был вкус, и он объяснит, что происходит в чашке и что изменить дальше — помол, температуру, пропорцию или технику. Он работает полностью на вашем устройстве: без учётной записи, без необходимости в интернете, и ничего из того, что вы ему рассказываете, никогда не покидает ваше устройство."], ["faq", "Что такое анализ заваривания на устройстве и почему я могу его не видеть?", "На поддерживаемых iPhone и iPad — тех, где включён Apple Intelligence — можно попросить Джеймса разобрать сохранённое заваривание, и модель Apple прямо на устройстве даёт индивидуальную оценку чашки. Всё работает целиком на вашем устройстве; ничего не отправляется ни в Apple, ни нам, ни на какой-либо сервер. Функцию можно найти в настройках приложения, в разделе «Параметры» («Анализ на устройстве»); там, где она доступна, она включена по умолчанию. Если ваше устройство не поддерживает Apple Intelligence, переключателя не будет — но Джеймс всё равно подсказывает по каждому завариванию с помощью встроенного офлайн-движка, так что вы ничего не упустите."], ["faq", "Может ли Logica Coffee записывать мой кофеин в Apple Здоровье?", "Да. В разделе <strong>Настройки → Apple Здоровье</strong> включите запись кофеина и предоставьте разрешение. С этого момента каждая сохранённая вами заварка записывает оценочное количество кофеина в Apple Здоровье, так что оно отображается рядом с остальными вашими данными о здоровье. Приложение только записывает это значение — оно никогда не читает никаких ваших данных о здоровье — и вы можете отключить это или отозвать доступ в любой момент в приложении Здоровье."], ["faq", "Как удалить все мои данные?", "Вы можете удалять отдельные записи журнала и зёрна из приложения. Чтобы удалить все данные, удалите приложение. Если синхронизация iCloud включена, вы также можете удалить данные Logica Coffee в разделе <strong>Настройки → [Ваше имя] → iCloud → Управление хранилищем учётной записи</strong>."], ["faq", "Я нашёл ошибку. Как о ней сообщить?", "Напишите нам на <a href=\"mailto:khatskevich.mv@gmail.com\">khatskevich.mv@gmail.com</a> с описанием произошедшего, моделью вашего iPhone и версией iOS. Скриншоты всегда полезны."], ["h2", "Конфиденциальность"], ["p", "Logica Coffee не собирает, не передаёт и не делится никакими персональными данными. Прочитайте полную <a href=\"./privacy.html\">Политику конфиденциальности</a>."]]}, "uk": {"title": "Підтримка", "updated": "Зазвичай ми відповідаємо протягом 24 годин", "blocks": [["highlight", "Маєте запитання, знайшли помилку чи хочете щось запропонувати? Напишіть на пошту — кожне повідомлення читається особисто."], ["contact", "Пошта", "Якщо повідомляєте про помилку, вкажіть модель вашого iPhone і версію iOS."], ["h2", "Поширені запитання"], ["faq", "Logica Coffee безкоштовний?", "Так, цілком. Без підписки, без платного доступу, без реклами. Усі функції повністю розблоковані з моменту встановлення. Усередині доступні необов'язкові чайові, якщо ви хочете підтримати розробку — цілком на ваш вибір."], ["faq", "Чи працює Logica Coffee на iPad?", "Так — починаючи з версії 1.2.0 застосунок універсальний. На iPad ви отримуєте ті самі функції в оформленні, продуманому для більшого екрана, з розташованими поруч панелями для заварювання, вашого журналу та Джеймса. Якщо синхронізацію iCloud увімкнено, ваш журнал, зерна й рецепти автоматично лишаються синхронізованими між вашим iPhone та iPad."], ["faq", "Де зберігаються мої дані?", "Усі записи вашого журналу заварок, запас зерна й власні рецепти зберігаються на вашому пристрої. Якщо у вас увімкнено iCloud, вони автоматично синхронізуються між вашими пристроями через ваш особистий обліковий запис iCloud. Нічого не надсилається на зовнішні сервери."], ["faq", "Як зробити резервну копію або перенести дані на новий iPhone?", "Якщо синхронізацію iCloud увімкнено, ваші дані переносяться автоматично під час входу на новому пристрої. Крім того, відновлення з резервної копії iCloud або iTunes включить усі дані Logica Coffee."], ["faq", "Застосунок Apple Watch не синхронізується з моїм iPhone. Що робити?", "Переконайтеся, що обидва пристрої використовують той самий Apple ID і що Bluetooth увімкнено. Спочатку відкрийте застосунок на iPhone, потім запустіть його на Watch. Якщо проблема не зникає, зазвичай допомагає примусово закрити й знову відкрити обидва застосунки."], ["faq", "Як створити власний рецепт?", "На вкладці &ldquo;Заварювання&rdquo; торкніться &ldquo;Змінити метод або рецепт&rdquo;, виберіть &ldquo;Змінити рецепт…&rdquo; і торкніться кнопки + угорі списку рецептів. Ви можете додати скільки завгодно етапів, задаючи для кожного об'єм проливу, тайминг і тип води. Ще швидше: відкрийте меню ⋯ у будь-якого вбудованого рецепта й виберіть &ldquo;Зберегти як власний рецепт&rdquo; — отримаєте копію, яку можна редагувати."], ["faq", "Як поділитися рецептом з другом?", "На вкладці &ldquo;Заварювання&rdquo; торкніться &ldquo;Змінити метод або рецепт&rdquo; і виберіть &ldquo;Змінити рецепт…&rdquo;. Потім торкніться меню ⋯ будь-якого створеного вами власного рецепта й виберіть &ldquo;Поділитися рецептом&rdquo;. Ви отримаєте QR-код і посилання, які можна надіслати через Повідомлення, Пошту чи деінде. Ваш друг торкається посилання (або сканує код), щоб відкрити його в Logica Coffee, де він може переглянути рецепт і додати його до своєї бібліотеки. Ділитися можна лише власними рецептами — і рецепт ніколи не додається автоматично, тож ви завжди підтверджуєте перед збереженням."], ["faq", "Які методи заварювання підтримує застосунок?", "Hario V60, AeroPress, Chemex, френч-прес, Hario Switch, Clever Dripper, ORIGAMI Dripper, Kalita Wave, OXO Rapid Brewer, гейзерна кавоварка (мока), сифон, колд брю, турецька кава, в'єтнамський фін, Ceado Hoop, еспресо, ристрето, лунго, американо, капучино, флет вайт, лате, кортадо, макіато й сінгапурський копі."], ["faq", "Як працює сканер пакетів кави?", "Додаючи нові зерна, торкніться значка сканування й сфотографуйте пакет кави. Застосунок використовує ШІ на пристрої, щоб автоматично зчитати й заповнити такі деталі, як обсмажувач, походження, обробка та дегустаційні нотатки."], ["faq", "Як працюють покрокові сесії налаштування (dial-in)?", "Налаштування не лише для еспресо — воно працює з будь-яким методом. Розпочніть сесію, і застосунок проведе вас замкненим циклом: заваріть, скажіть, яким був смак чашки (надто кисла, надто гірка, слабка, збалансована), і він запропонує одне конкретне коригування помелу, дози чи пропорції для наступної спроби. Він записує кожен крок, щоб ви бачили точно, як прийшли до ідеального рецепта, і ви можете повернутися до сесії пізніше саме з того місця, де зупинилися."], ["faq", "Що таке Коуч (Джеймс)?", "Джеймс — це ваш вбудований кавовий коуч. Розкажіть йому, що ви заварили і яким був смак, і він пояснить, що відбувається в чашці й що змінити далі — помел, температуру, пропорцію чи техніку. Він працює повністю на вашому пристрої: без облікового запису, без потреби в інтернеті, і нічого з того, що ви йому розповідаєте, ніколи не залишає ваш пристрій."], ["faq", "Що таке аналіз заварювання на пристрої і чому я можу його не бачити?", "На підтримуваних iPhone та iPad — тих, де ввімкнено Apple Intelligence — можна попросити Джеймса розібрати збережене заварювання, і модель Apple просто на пристрої дає індивідуальну оцінку чашки. Усе працює повністю на вашому пристрої; нічого не надсилається ні до Apple, ні до нас, ні на будь-який сервер. Функцію можна знайти в налаштуваннях застосунку, у розділі «Параметри» («Аналіз на пристрої»); там, де вона доступна, її ввімкнено за замовчуванням. Якщо ваш пристрій не підтримує Apple Intelligence, перемикача не буде — але Джеймс усе одно підказує щодо кожного заварювання за допомогою вбудованого офлайн-рушія, тож ви нічого не втратите."], ["faq", "Чи може Logica Coffee записувати мій кофеїн в Apple Здоров'я?", "Так. У розділі <strong>Налаштування → Apple Здоров'я</strong> увімкніть запис кофеїну й надайте дозвіл. Відтоді кожна збережена вами заварка записує орієнтовну кількість кофеїну в Apple Здоров'я, тож воно відображається поруч з рештою ваших даних про здоров'я. Застосунок лише записує це значення — він ніколи не читає жодних ваших даних про здоров'я — і ви можете вимкнути це або відкликати доступ будь-коли в застосунку Здоров'я."], ["faq", "Як видалити всі мої дані?", "Ви можете видаляти окремі записи журналу й зерна із застосунку. Щоб видалити всі дані, видаліть застосунок. Якщо синхронізацію iCloud увімкнено, ви також можете видалити дані Logica Coffee в розділі <strong>Налаштування → [Ваше ім'я] → iCloud → Керування сховищем облікового запису</strong>."], ["faq", "Я знайшов помилку. Як про неї повідомити?", "Напишіть нам на <a href=\"mailto:khatskevich.mv@gmail.com\">khatskevich.mv@gmail.com</a> з описом того, що сталося, моделлю вашого iPhone і версією iOS. Знімки екрана завжди корисні."], ["h2", "Конфіденційність"], ["p", "Logica Coffee не збирає, не передає й не надає доступ до жодних персональних даних. Прочитайте повну <a href=\"./privacy.html\">Політику конфіденційності</a>."]]}, "zh-Hans": {"title": "支持", "updated": "我们通常在 24 小时内回复", "blocks": [["highlight", "有问题、发现了 bug，或想提建议？发一封邮件 — 每条消息都会有人亲自阅读。"], ["contact", "邮箱", "报告 bug 时，请附上您的 iPhone 型号和 iOS 版本。"], ["h2", "常见问题"], ["faq", "Logica Coffee 是免费的吗？", "是的，完全免费。没有订阅、没有付费墙、没有广告。从您安装的那一刻起，所有功能都已完全解锁。如果您想支持开发，应用内
