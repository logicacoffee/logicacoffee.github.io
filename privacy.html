<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Privacy Policy — Logica Coffee</title>
  <style>
    :root {
      --bg:      #100f0d;
      --surface: #1a1613;
      --orange:  #d68757;
      --white:   #f4f1ea;
      --gray:    #8a8076;
      --border:  #2c2722;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--white);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      font-size: 16px;
      line-height: 1.7;
      padding: 0 16px 80px;
    }
    .wrap { max-width: 680px; margin: 0 auto; }
    header {
      padding: 56px 0 40px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 48px;
    }
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin-bottom: 14px;
    }
    .app-label {
      font-family: "SF Mono", "Fira Mono", monospace;
      font-size: 12px;
      letter-spacing: 0.12em;
      color: var(--orange);
      text-transform: uppercase;
    }
    .lang-switch {
      position: relative;
      flex-shrink: 0;
    }
    .lang-switch select {
      appearance: none;
      -webkit-appearance: none;
      background: var(--surface);
      color: var(--white);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 7px 30px 7px 12px;
      font-size: 13px;
      font-family: inherit;
      cursor: pointer;
      letter-spacing: 0.02em;
    }
    .lang-switch::after {
      content: "";
      position: absolute;
      right: 12px;
      top: 50%;
      width: 7px;
      height: 7px;
      border-right: 1.5px solid var(--gray);
      border-bottom: 1.5px solid var(--gray);
      transform: translateY(-65%) rotate(45deg);
      pointer-events: none;
    }
    .lang-switch select:focus { outline: none; border-color: var(--orange); }
    h1 {
      font-family: "New York", "Iowan Old Style", Georgia, "Times New Roman", serif;
      font-size: clamp(34px, 6.5vw, 56px);
      font-weight: 700;
      letter-spacing: -0.01em;
      line-height: 1.08;
      color: var(--white);
    }
    .updated {
      margin-top: 16px;
      font-size: 13px;
      color: var(--gray);
      font-family: "SF Mono", "Fira Mono", monospace;
      letter-spacing: 0.05em;
    }
    section { margin-bottom: 48px; }
    h2 {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--orange);
      font-family: "SF Mono", "Fira Mono", monospace;
      margin-bottom: 16px;
    }
    p { color: #ccc; margin-bottom: 14px; }
    p:last-child { margin-bottom: 0; }
    ul { list-style: none; padding: 0; }
    ul li {
      color: #ccc;
      padding: 10px 0 10px 20px;
      border-bottom: 1px solid var(--border);
      position: relative;
    }
    ul li:first-child { border-top: 1px solid var(--border); }
    ul li::before {
      content: "—";
      position: absolute;
      left: 0;
      color: var(--orange);
      font-weight: 700;
    }
    .highlight-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-left: 3px solid var(--orange);
      border-radius: 8px;
      padding: 20px 24px;
      margin-bottom: 32px;
    }
    .highlight-box p { color: var(--white); font-size: 15px; margin: 0; }
    .faq-item { border-bottom: 1px solid var(--border); padding: 20px 0; }
    .faq-item:first-of-type { border-top: 1px solid var(--border); }
    .faq-q { color: var(--white); font-weight: 600; margin-bottom: 8px; }
    .faq-a { color: #ccc; margin: 0; }
    .faq-a strong { color: var(--white); }
    a { color: var(--orange); text-decoration: none; }
    a:hover { text-decoration: underline; }
    .contact-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .contact-card .label {
      font-family: "SF Mono", "Fira Mono", monospace;
      font-size: 11px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--gray);
    }
    .contact-card .email { font-size: 17px; font-weight: 600; color: var(--orange); }
    .contact-card .note { font-size: 13px; color: var(--gray); margin-top: 4px; }
    footer {
      border-top: 1px solid var(--border);
      padding-top: 32px;
      font-size: 13px;
      color: var(--gray);
      font-family: "SF Mono", "Fira Mono", monospace;
    }
    footer a { color: var(--gray); }
    footer a:hover { color: var(--orange); text-decoration: underline; }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="topbar">
        <p class="app-label">Logica Coffee</p>
        <div class="lang-switch">
          <label id="langLabel" for="lang" style="display:none"></label>
          <select id="lang" aria-label="Language">
          <option value="en" selected>English</option>
          <option value="be">Беларуская</option>
          <option value="de">Deutsch</option>
          <option value="es">Español</option>
          <option value="fr">Français</option>
          <option value="it">Italiano</option>
          <option value="ja">日本語</option>
          <option value="pl">Polski</option>
          <option value="pt-BR">Português (BR)</option>
          <option value="ru">Русский</option>
          <option value="uk">Українська</option>
          <option value="zh-Hans">中文</option>
          </select>
        </div>
      </div>
      <h1 id="title">Privacy Policy</h1>
      <p class="updated" id="updated"></p>
    </header>

    <div id="content"></div>

    <footer><p id="footer"></p></footer>
  </div>
  <script>
  var LANGS = [["en", "English"], ["be", "Беларуская"], ["de", "Deutsch"], ["es", "Español"], ["fr", "Français"], ["it", "Italiano"], ["ja", "日本語"], ["pl", "Polski"], ["pt-BR", "Português (BR)"], ["ru", "Русский"], ["uk", "Українська"], ["zh-Hans", "中文"]];
  var STR = {"en": {"title": "Privacy Policy", "updated": "Last updated: July 17, 2026 — iPad support noted alongside on-device brew analysis.", "blocks": [["highlight", "Logica Coffee does not collect, transmit, or share any personal data. Your data stays under your control — on your device and, if you choose, in your own iCloud account."], ["h2", "Overview"], ["p", "Logica Coffee is a personal coffee brewing companion. Your brew journal, bean inventory, recipes, and settings are stored on your device and — if you have iCloud enabled — synced across your devices via your personal iCloud account. We do not operate any servers, and no data is ever sent to us. No account is required."], ["h2", "Data stored on your device"], ["p", "The following information is saved on your device and, if iCloud is enabled, in your personal iCloud account:"], ["ul", ["Brew journal entries (method, dose, ratio, tasting notes, star rating)", "Coffee bean inventory (name, origin, roast level, flavour notes, remaining weight)", "Custom recipes and brew timelines you create", "Photos of your coffee bags that you choose to take or import", "App preferences and settings (grinder, temperature, filter type)"]], ["p", "This data is not accessible to us or any third party. You can delete it at any time from within the app or by uninstalling the app. You can disable iCloud sync for Logica Coffee at any time in <strong>Settings → [Your Name] → iCloud</strong> on your iPhone."], ["h2", "Camera &amp; photos"], ["p", "Logica Coffee can take a photo of a coffee bag to save with a bean, and can scan a bag's label to auto-fill bean details such as name, origin, and roast date. Reading the label is done entirely on your device using Apple's on-device text recognition — the image is never uploaded to us or any server, and the scanning happens offline."], ["p", "The camera is used only when you tap to take a photo, and only after you grant camera permission. If you instead choose a photo from your library, the app uses Apple's system photo picker, which hands over only the single image you select — Logica Coffee never gets access to the rest of your photo library. Any bag photos you save are stored on your device and, if iCloud is enabled, in your personal iCloud account, exactly like the rest of your data. You can remove a photo at any time from the bean's edit screen."], ["h2", "Notifications"], ["p", "If you add a roast date to a bean, Logica Coffee can schedule a local notification to remind you when those beans reach their peak freshness window. These reminders are scheduled and delivered entirely on your device — no information is sent anywhere, and notifications are only used after you grant permission. You can turn them off at any time in <strong>Settings → Notifications → Logica Coffee</strong>."], ["h2", "iCloud sync"], ["p", "If you have iCloud enabled on your device, Logica Coffee uses Apple's iCloud Documents service to sync your journal, bean inventory, and recipes across your iPhone and any other devices signed into the same Apple ID. This sync happens through your personal iCloud account — the data is stored by Apple under <a href=\"https://www.apple.com/legal/privacy/\" target=\"_blank\">Apple's Privacy Policy</a> and is not accessible to us in any way."], ["p", "iCloud sync is entirely optional and controlled by your device settings. If iCloud is unavailable or disabled, the app stores your data locally on-device as normal."], ["h2", "Apple Watch sync"], ["p", "If you use the Logica Coffee Apple Watch app, brew session data is shared between your iPhone and Apple Watch using Apple's WatchConnectivity framework. This communication happens directly between your two devices over your local network or Bluetooth — it does not pass through any external server."], ["h2", "Apple Health"], ["p", "Logica Coffee can write an estimated caffeine amount for each brew you save to Apple Health, so your caffeine intake appears alongside the rest of your health data. This is entirely optional and off until you turn it on and grant permission in <strong>Settings → Apple Health</strong> inside the app."], ["p", "The app only ever <em>writes</em> caffeine entries — it never reads any of your health data. Apple requires the read permission prompt to enable caffeine logging at all, but Logica Coffee requests no read access and queries nothing from Health. All caffeine values are calculated on your device from the brew you logged, and the data is stored by Apple in Health under <a href=\"https://www.apple.com/legal/privacy/\" target=\"_blank\">Apple's Privacy Policy</a> — it is never sent to us. You can revoke access at any time in <strong>Settings → Health → Data Access &amp; Devices → Logica Coffee</strong>."], ["h2", "On-Device Brew Analysis"], ["p", "On iPhones and iPads that support Apple Intelligence, Logica Coffee can analyze a logged brew using Apple's on-device foundation model. This analysis runs entirely on your device. Your brew data is never sent to Apple, to us, or to any server, and no account is required. The feature is on by default where it is available and can be turned off at any time in Settings. On devices without Apple Intelligence, James's built-in coaching provides the same guidance, also entirely on-device."], ["h2", "Recipe sharing"], ["p", "Logica Coffee lets you share a custom recipe with someone else as a link or a QR code. This is always optional and only happens when you tap Share. The entire recipe — its name, author, and brewing steps — is encoded directly into the link itself; nothing is uploaded to or stored on a server by us, and the QR code is generated on your device."], ["p", "Where the link goes is your choice: it is handed to Apple's standard share sheet, so you decide whether to send it via Messages, Mail, or anywhere else. When someone opens a shared link, it first loads a small static redirect page (hosted on GitHub Pages) that simply bounces the link into the Logica Coffee app. As with any web page, GitHub's hosting may record routine request logs; no recipe data is collected, stored, or used by us. Recipes you receive are never added automatically — you always see a preview and confirm before anything is saved to your library."], ["h2", "Data we do not collect"], ["ul", ["We do not collect your name, email address, or any account information", "We do not track your location", "We do not read your Apple Health data — caffeine logging is write-only", "We do not collect analytics, crash reports, or usage statistics", "We do not use advertising SDKs or track you across apps", "We do not share any data with third parties"]], ["h2", "Third-party services"], ["p", "Logica Coffee does not integrate any third-party analytics, advertising, or crash reporting services. The only external frameworks used are Apple's own system frameworks (WatchConnectivity, WidgetKit, ActivityKit, iCloud Documents, HealthKit, the Vision on-device text recognition framework, the system photo picker, and local notifications), all of which operate under <a href=\"https://www.apple.com/legal/privacy/\" target=\"_blank\">Apple's Privacy Policy</a>."], ["h2", "Children's privacy"], ["p", "Logica Coffee does not knowingly collect any data from users of any age. The app is suitable for all ages."], ["h2", "Changes to this policy"], ["p", "If this policy changes in a meaningful way (for example, if a future version of the app introduces network features), the updated date at the top of this page will reflect that, and the new policy will be available before the update reaches the App Store."], ["h2", "Contact"], ["p", "Questions about this privacy policy? Reach out at <a href=\"mailto:khatskevich.mv@gmail.com\">khatskevich.mv@gmail.com</a>."]]}, "be": {"title": "Палітыка прыватнасці", "updated": "Апошняе абнаўленне: 17 ліпеня 2026 г. — дададзена падтрымка iPad побач з аналізам заваркі на прыладзе", "blocks": [["highlight", "Logica Coffee не збірае, не перадае і не дзеліцца ніякімі асабістымі данымі. Вашы даныя застаюцца пад вашым кантролем — на вашай прыладзе і, калі пажадаеце, у вашым уласным уліковым запісе iCloud."], ["h2", "Агляд"], ["p", "Logica Coffee — гэта асабісты памочнік для заварвання кавы. Ваш журнал заварак, запас зерня, рэцэпты і налады захоўваюцца на вашай прыладзе і — калі iCloud уключаны — сінхранізуюцца паміж вашымі прыладамі праз ваш асабісты ўліковы запіс iCloud. Мы не выкарыстоўваем ніякіх сервераў, і ніякія даныя нам не адпраўляюцца. Уліковы запіс не патрабуецца."], ["h2", "Даныя, што захоўваюцца на вашай прыладзе"], ["p", "Наступная інфармацыя захоўваецца на вашай прыладзе і, калі iCloud уключаны, у вашым асабістым уліковым запісе iCloud:"], ["ul", ["Запісы журнала заварак (метад, доза, прапорцыя, дэгустацыйныя нататкі, ацэнка ў зорках)", "Запас кававых зерняў (назва, паходжанне, ступень абсмажвання, смакавыя ноты, рэшта вагі)", "Уласныя рэцэпты і таймінгі заварвання, якія вы ствараеце", "Фатаграфіі вашых пакетаў кавы, якія вы вырашыце зрабіць або імпартаваць", "Перавагі і налады праграмы (кававамолка, тэмпература, тып фільтра)"]], ["p", "Гэтыя даныя недаступныя нам або трэцім асобам. Вы можаце выдаліць іх у любы момант з праграмы або выдаліўшы праграму. Вы можаце адключыць сінхранізацыю iCloud для Logica Coffee у любы момант у раздзеле <strong>Налады → [Ваша імя] → iCloud</strong> на вашым iPhone."], ["h2", "Камера і фатаграфіі"], ["p", "Logica Coffee можа зрабіць фатаграфію пакета кавы, каб захаваць яе з зернем, і можа адсканіраваць этыкетку пакета, каб аўтаматычна запоўніць такія дэталі, як назва, паходжанне і дата абсмажвання. Распазнаванне этыкеткі выконваецца цалкам на вашай прыладзе з дапамогай убудаванага распазнавання тэксту Apple — выява ніколі не загружаецца ні да нас, ні на які-небудзь сервер, і сканіраванне адбываецца афлайн."], ["p", "Камера выкарыстоўваецца толькі калі вы націскаеце, каб зрабіць фота, і толькі пасля таго, як вы дасце дазвол на доступ да камеры. Калі ж вы выбіраеце фота са сваёй медыятэкі, праграма выкарыстоўвае сістэмны выбар фатаграфій Apple, які перадае толькі адну выбраную вамі выяву — Logica Coffee ніколі не атрымлівае доступ да астатняй часткі вашай фотамедыятэкі. Захаваныя фатаграфіі пакетаў захоўваюцца на вашай прыладзе і, калі iCloud уключаны, у вашым асабістым уліковым запісе iCloud, гэтак жа як і астатнія вашы даныя. Вы можаце выдаліць фатаграфію ў любы момант на экране рэдагавання зерня."], ["h2", "Апавяшчэнні"], ["p", "Калі вы дадасце дату абсмажвання да зерня, Logica Coffee можа запланаваць лакальнае апавяшчэнне, каб нагадаць вам, калі гэтыя зерні дасягнуць піку свежасці. Гэтыя нагадванні плануюцца і дастаўляюцца цалкам на вашай прыладзе — ніякая інфармацыя нікуды не адпраўляецца, і апавяшчэнні выкарыстоўваюцца толькі пасля таго, як вы дасце дазвол. Вы можаце адключыць іх у любы момант у раздзеле <strong>Налады → Апавяшчэнні → Logica Coffee</strong>."], ["h2", "Сінхранізацыя iCloud"], ["p", "Калі на вашай прыладзе ўключаны iCloud, Logica Coffee выкарыстоўвае службу iCloud Drive (Дакументы) ад Apple для сінхранізацыі вашага журнала, запасу зерня і рэцэптаў паміж вашым iPhone і любымі іншымі прыладамі, якія ўвайшлі пад тым жа Apple ID. Гэтая сінхранізацыя адбываецца праз ваш асабісты ўліковы запіс iCloud — даныя захоўваюцца Apple у адпаведнасці з <a href=\"https://www.apple.com/legal/privacy/\" target=\"_blank\">Палітыкай прыватнасці Apple</a> і ніякім чынам не даступныя нам."], ["p", "Сінхранізацыя iCloud цалкам неабавязковая і кіруецца наладамі вашай прылады. Калі iCloud недаступны або адключаны, праграма захоўвае вашы даныя лакальна на прыладзе, як звычайна."], ["h2", "Сінхранізацыя з Apple Watch"], ["p", "Калі вы выкарыстоўваеце праграму Logica Coffee для Apple Watch, даныя сесіі заварвання перадаюцца паміж вашым iPhone і Apple Watch з дапамогай фрэймворка WatchConnectivity ад Apple. Гэтая сувязь адбываецца непасрэдна паміж вашымі дзвюма прыладамі праз лакальную сетку або Bluetooth — яна не праходзіць праз ніякі знешні сервер."], ["h2", "Apple Здароўе"], ["p", "Logica Coffee можа запісваць арыентоўную колькасць кафеіну для кожнай захаванай вамі заваркі ў Apple Здароўе, каб ваша спажыванне кафеіну адлюстроўвалася побач з астатнімі вашымі данымі пра здароўе. Гэта цалкам неабавязкова і адключана, пакуль вы не ўключыце гэта і не дасце дазвол у раздзеле <strong>Налады → Apple Здароўе</strong> унутры праграмы."], ["p", "Праграма толькі <em>запісвае</em> даныя пра кафеін — яна ніколі не чытае ніякіх вашых даных пра здароўе. Apple патрабуе запыт дазволу на чытанне, каб увогуле ўключыць запіс кафеіну, але Logica Coffee не запытвае доступ на чытанне і нічога не запытвае са Здароўя. Усе значэнні кафеіну вылічваюцца на вашай прыладзе на аснове запісанай вамі заваркі, а даныя захоўваюцца Apple у Здароўі ў адпаведнасці з <a href=\"https://www.apple.com/legal/privacy/\" target=\"_blank\">Палітыкай прыватнасці Apple</a> — яны ніколі не адпраўляюцца нам. Вы можаце адклікаць доступ у любы момант у раздзеле <strong>Налады → Здароўе → Доступ да даных і прылады → Logica Coffee</strong>."], ["h2", "Аналіз заваркі на прыладзе"], ["p", "На iPhone і iPad, якія падтрымліваюць Apple Intelligence, Logica Coffee можа прааналізаваць захаваную заварку з дапамогай базавай мадэлі Apple на прыладзе. Гэты аналіз цалкам выконваецца на вашай прыладзе. Дадзеныя пра вашы заваркі ніколі не адпраўляюцца ні ў Apple, ні нам, ні на які-небудзь сервер, і ўліковы запіс не патрэбны. Там, дзе функцыя даступная, яна ўключана па змаўчанні, і яе ў любы момант можна выключыць у Наладах. На прыладах без Apple Intelligence убудаваны трэнер Джэймс дае тыя ж парады — таксама цалкам на прыладзе."], ["h2", "Абмен рэцэптамі"], ["p", "Logica Coffee дазваляе падзяліцца ўласным рэцэптам з кімсьці іншым у выглядзе спасылкі або QR-кода. Гэта заўсёды неабавязкова і адбываецца толькі калі вы націскаеце «Падзяліцца». Увесь рэцэпт — яго назва, аўтар і крокі заварвання — кадзіруецца непасрэдна ў самай спасылцы; нічога не загружаецца на сервер і не захоўваецца ў нас, а QR-код ствараецца на вашай прыладзе."], ["p", "Куды адправіць спасылку — ваш выбар: яна перадаецца ў стандартнае меню «Падзяліцца» Apple, так што вы вырашаеце, адправіць яе праз Паведамленні, Пошту ці куды-небудзь яшчэ. Калі хтосьці адкрывае дасланую спасылку, спачатку загружаецца невялікая статычная старонка перанакіравання (размешчаная на GitHub Pages), якая проста перанакіроўвае спасылку ў праграму Logica Coffee. Як і з любой вэб-старонкай, хостынг GitHub можа весці звычайныя журналы запытаў; ніякія даныя рэцэпта намі не збіраюцца, не захоўваюцца і не выкарыстоўваюцца. Атрыманыя рэцэпты ніколі не дадаюцца аўтаматычна — вы заўсёды бачыце папярэдні прагляд і пацвярджаеце, перш чым нешта захаваецца ў вашу бібліятэку."], ["h2", "Даныя, якія мы не збіраем"], ["ul", ["Мы не збіраем ваша імя, адрас электроннай пошты ці якую-небудзь інфармацыю пра ўліковы запіс", "Мы не адсочваем ваша месцазнаходжанне", "Мы не чытаем вашы даныя Apple Здароўе — запіс кафеіну працуе толькі на запіс", "Мы не збіраем аналітыку, справаздачы пра збоі ці статыстыку выкарыстання", "Мы не выкарыстоўваем рэкламныя SDK і не адсочваем вас паміж праграмамі", "Мы не перадаём ніякіх даных трэцім асобам"]], ["h2", "Староннія сэрвісы"], ["p", "Logica Coffee не інтэгруе ніякіх старонніх сэрвісаў аналітыкі, рэкламы ці справаздач пра збоі. Адзіныя выкарыстоўваныя знешнія фрэймворкі — гэта ўласныя сістэмныя фрэймворкі Apple (WatchConnectivity, WidgetKit, ActivityKit, iCloud Documents, HealthKit, фрэймворк распазнавання тэксту на прыладзе Vision, сістэмны выбар фатаграфій і лакальныя апавяшчэнні), усе з якіх працуюць у адпаведнасці з <a href=\"https://www.apple.com/legal/privacy/\" target=\"_blank\">Палітыкай прыватнасці Apple</a>."], ["h2", "Прыватнасць дзяцей"], ["p", "Logica Coffee свядома не збірае ніякіх даных ад карыстальнікаў любога ўзросту. Праграма падыходзіць для ўсіх узростаў."], ["h2", "Змены ў гэтай палітыцы"], ["p", "Калі гэтая палітыка зменіцца істотным чынам (напрыклад, калі будучая версія праграмы дадасць сеткавыя функцыі), дата абнаўлення ўверсе гэтай старонкі адлюструе гэта, і новая палітыка будзе даступная да таго, як абнаўленне з'явіцца ў App Store."], ["h2", "Кантакты"], ["p", "Пытанні пра гэтую палітыку прыватнасці? Напішыце нам на <a href=\"mailto:khatskevich.mv@gmail.com\">khatskevich.mv@gmail.com</a>."]]}, "de": {"title": "Datenschutzerklärung", "updated": "Zuletzt aktualisiert: 17. Juli 2026 — iPad-Unterstützung neben der On-Device-Brühanalyse ergänzt", "blocks": [["highlight", "Logica Coffee erhebt, überträgt oder teilt keinerlei personenbezogene Daten. Ihre Daten bleiben unter Ihrer Kontrolle — auf Ihrem Gerät und, wenn Sie möchten, in Ihrem eigenen iCloud-Konto."], ["h2", "Überblick"], ["p", "Logica Coffee ist ein persönlicher Begleiter zum Kaffeebrühen. Ihr Brüh-Journal, Ihr Bohnenbestand, Ihre Rezepte und Einstellungen werden auf Ihrem Gerät gespeichert und — wenn iCloud aktiviert ist — über Ihr persönliches iCloud-Konto zwischen Ihren Geräten synchronisiert. Wir betreiben keine Server, und es werden niemals Daten an uns gesendet. Es ist kein Konto erforderlich."], ["h2", "Auf Ihrem Gerät gespeicherte Daten"], ["p", "Die folgenden Informationen werden auf Ihrem Gerät und, wenn iCloud aktiviert ist, in Ihrem persönlichen iCloud-Konto gespeichert:"], ["ul", ["Einträge im Brüh-Journal (Methode, Menge, Verhältnis, Verkostungsnotizen, Sternebewertung)", "Kaffeebohnen-Bestand (Name, Herkunft, Röstgrad, Aromanotizen, verbleibendes Gewicht)", "Eigene Rezepte und Brüh-Abläufe, die Sie erstellen", "Fotos Ihrer Kaffeetüten, die Sie aufnehmen oder importieren", "App-Einstellungen und Präferenzen (Mühle, Temperatur, Filtertyp)"]], ["p", "Diese Daten sind für uns oder Dritte nicht zugänglich. Sie können sie jederzeit in der App oder durch Deinstallation der App löschen. Sie können die iCloud-Synchronisierung für Logica Coffee jederzeit unter <strong>Einstellungen → [Ihr Name] → iCloud</strong> auf Ihrem iPhone deaktivieren."], ["h2", "Kamera &amp; Fotos"], ["p", "Logica Coffee kann ein Foto einer Kaffeetüte aufnehmen, um es bei einer Bohne zu speichern, und kann das Etikett einer Tüte scannen, um Bohnendetails wie Name, Herkunft und Röstdatum automatisch auszufüllen. Das Lesen des Etiketts erfolgt vollständig auf Ihrem Gerät mit Apples geräteinterner Texterkennung — das Bild wird niemals an uns oder einen Server hochgeladen, und das Scannen erfolgt offline."], ["p", "Die Kamera wird nur verwendet, wenn Sie auf Aufnehmen tippen, und nur nachdem Sie die Kameraberechtigung erteilt haben. Wenn Sie stattdessen ein Foto aus Ihrer Mediathek wählen, verwendet die App Apples System-Fotoauswahl, die nur das eine ausgewählte Bild übergibt — Logica Coffee erhält niemals Zugriff auf den Rest Ihrer Fotomediathek. Gespeicherte Tütenfotos werden auf Ihrem Gerät und, wenn iCloud aktiviert ist, in Ihrem persönlichen iCloud-Konto gespeichert, genau wie Ihre übrigen Daten. Sie können ein Foto jederzeit im Bearbeitungsbildschirm der Bohne entfernen."], ["h2", "Mitteilungen"], ["p", "Wenn Sie einer Bohne ein Röstdatum hinzufügen, kann Logica Coffee eine lokale Mitteilung planen, um Sie zu erinnern, wenn diese Bohnen ihr optimales Frischefenster erreichen. Diese Erinnerungen werden vollständig auf Ihrem Gerät geplant und zugestellt — es werden keine Informationen irgendwohin gesendet, und Mitteilungen werden nur nach Ihrer Erlaubnis verwendet. Sie können sie jederzeit unter <strong>Einstellungen → Mitteilungen → Logica Coffee</strong> deaktivieren."], ["h2", "iCloud-Synchronisierung"], ["p", "Wenn iCloud auf Ihrem Gerät aktiviert ist, verwendet Logica Coffee Apples iCloud-Dokumente-Dienst, um Ihr Journal, Ihren Bohnenbestand und Ihre Rezepte zwischen Ihrem iPhone und allen anderen mit derselben Apple-ID angemeldeten Geräten zu synchronisieren. Diese Synchronisierung erfolgt über Ihr persönliches iCloud-Konto — die Daten werden von Apple gemäß <a href=\"https://www.apple.com/legal/privacy/\" target=\"_blank\">Apples Datenschutzrichtlinie</a> gespeichert und sind für uns in keiner Weise zugänglich."], ["p", "Die iCloud-Synchronisierung ist völlig optional und wird über Ihre Geräteeinstellungen gesteuert. Wenn iCloud nicht verfügbar oder deaktiviert ist, speichert die App Ihre Daten wie gewohnt lokal auf dem Gerät."], ["h2", "Apple Watch-Synchronisierung"], ["p", "Wenn Sie die Logica Coffee Apple Watch-App verwenden, werden Brüh-Sitzungsdaten über Apples WatchConnectivity-Framework zwischen Ihrem iPhone und Ihrer Apple Watch geteilt. Diese Kommunikation erfolgt direkt zwischen Ihren beiden Geräten über Ihr lokales Netzwerk oder Bluetooth — sie läuft über keinen externen Server."], ["h2", "Apple Health"], ["p", "Logica Coffee kann für jeden gespeicherten Aufguss eine geschätzte Koffeinmenge in Apple Health schreiben, sodass Ihre Koffeinaufnahme zusammen mit Ihren übrigen Gesundheitsdaten erscheint. Dies ist völlig optional und deaktiviert, bis Sie es aktivieren und in der App unter <strong>Einstellungen → Apple Health</strong> die Erlaubnis erteilen."], ["p", "Die App <em>schreibt</em> ausschließlich Koffeineinträge — sie liest niemals Ihre Gesundheitsdaten. Apple verlangt die Leseberechtigungsabfrage, um die Koffein-Protokollierung überhaupt zu aktivieren, aber Logica Coffee fordert keinen Lesezugriff an und fragt nichts aus Health ab. Alle Koffeinwerte werden auf Ihrem Gerät aus dem von Ihnen protokollierten Aufguss berechnet, und die Daten werden von Apple in Health gemäß <a href=\"https://www.apple.com/legal/privacy/\" target=\"_blank\">Apples Datenschutzrichtlinie</a> gespeichert — sie werden niemals an uns gesendet. Sie können den Zugriff jederzeit unter <strong>Einstellungen → Health → Datenzugriff &amp; Geräte → Logica Coffee</strong> widerrufen."], ["h2", "Brew-Analyse auf dem Gerät"], ["p", "Auf iPhones und iPads, die Apple Intelligence unterstützen, kann Logica Coffee einen protokollierten Brew mit Apples geräteinternem Foundation-Modell analysieren. Diese Analyse läuft vollständig auf deinem Gerät. Deine Brew-Daten werden niemals an Apple, an uns oder an einen Server gesendet, und es ist kein Konto erforderlich. Wo verfügbar, ist die Funktion standardmäßig aktiviert und kann jederzeit in den Einstellungen deaktiviert werden. Auf Geräten ohne Apple Intelligence liefert James’ integriertes Coaching dieselben Hinweise – ebenfalls vollständig auf dem Gerät."], ["h2", "Rezepte teilen"], ["p", "Mit Logica Coffee können Sie ein eigenes Rezept als Link oder QR-Code mit jemandem teilen. Dies ist immer optional und geschieht nur, wenn Sie auf Teilen tippen. Das gesamte Rezept — Name, Autor und Brühschritte — wird direkt in den Link selbst codiert; nichts wird von uns auf einen Server hochgeladen oder dort gespeichert, und der QR-Code wird auf Ihrem Gerät erzeugt."], ["p", "Wohin der Link geht, ist Ihre Entscheidung: Er wird an Apples Standard-Teilen-Dialog übergeben, sodass Sie entscheiden, ob Sie ihn per Nachrichten, Mail oder anderswo senden. Wenn jemand einen geteilten Link öffnet, wird zunächst eine kleine statische Weiterleitungsseite (gehostet auf GitHub Pages) geladen, die den Link einfach in die Logica Coffee-App weiterleitet. Wie bei jeder Webseite kann GitHubs Hosting routinemäßige Anfrageprotokolle aufzeichnen; es werden von uns keine Rezeptdaten erfasst, gespeichert oder verwendet. Empfangene Rezepte werden niemals automatisch hinzugefügt — Sie sehen immer eine Vorschau und bestätigen, bevor etwas in Ihrer Bibliothek gespeichert wird."], ["h2", "Daten, die wir nicht erheben"], ["ul", ["Wir erheben weder Ihren Namen, Ihre E-Mail-Adresse noch Kontoinformationen", "Wir verfolgen Ihren Standort nicht", "Wir lesen Ihre Apple-Health-Daten nicht — die Koffein-Protokollierung erfolgt nur schreibend", "Wir erheben keine Analyse-, Absturz- oder Nutzungsdaten", "Wir verwenden keine Werbe-SDKs und verfolgen Sie nicht über Apps hinweg", "Wir geben keine Daten an Dritte weiter"]], ["h2", "Drittanbieterdienste"], ["p", "Logica Coffee bindet keine Analyse-, Werbe- oder Absturzberichtsdienste von Drittanbietern ein. Die einzigen verwendeten externen Frameworks sind Apples eigene System-Frameworks (WatchConnectivity, WidgetKit, ActivityKit, iCloud-Dokumente, HealthKit, das geräteinterne Texterkennungs-Framework Vision, die System-Fotoauswahl und lokale Mitteilungen), die alle gemäß <a href=\"https://www.apple.com/legal/privacy/\" target=\"_blank\">Apples Datenschutzrichtlinie</a> arbeiten."], ["h2", "Datenschutz für Kinder"], ["p", "Logica Coffee erhebt wissentlich keine Daten von Nutzern jeglichen Alters. Die App ist für alle Altersgruppen geeignet."], ["h2", "Änderungen dieser Erklärung"], ["p", "Falls sich diese Erklärung in wesentlicher Weise ändert (zum Beispiel, wenn eine zukünftige Version der App Netzwerkfunktionen einführt), wird das Aktualisierungsdatum oben auf dieser Seite dies widerspiegeln, und die neue Erklärung wird verfügbar sein, bevor das Update den App Store erreicht."], ["h2", "Kontakt"], ["p", "Fragen zu dieser Datenschutzerklärung? Schreiben Sie an <a href=\"mailto:khatskevich.mv@gmail.com\">khatskevich.mv@gmail.com</a>."]]}, "es": {"title": "Política de Privacidad", "updated": "Última actualización: 17 de julio de 2026 — se añadió la compatibilidad con iPad junto al análisis de preparación en el dispositivo", "blocks": [["highlight", "Logica Coffee no recopila, transmite ni comparte ningún dato personal. Tus datos permanecen bajo tu control — en tu dispositivo y, si así lo decides, en tu propia cuenta de iCloud."], ["h2", "Resumen"], ["p", "Logica Coffee es un compañero personal para preparar café. Tu diario de preparaciones, tu inventario de granos, tus recetas y tus ajustes se guardan en tu dispositivo y — si tienes iCloud activado — se sincronizan entre tus dispositivos a través de tu cuenta personal de iCloud. No operamos ningún servidor y nunca se nos envía ningún dato. No se requiere ninguna cuenta."], ["h2", "Datos guardados en tu dispositivo"], ["p", "La siguiente información se guarda en tu dispositivo y, si iCloud está activado, en tu cuenta personal de iCloud:"], ["ul", ["Entradas del diario de preparaciones (método, dosis, proporción, notas de cata, valoración con estrellas)", "Inventario de granos de café (nombre, origen, nivel de tueste, notas de sabor, peso restante)", "Recetas personalizadas y secuencias de preparación que creas", "Fotos de tus bolsas de café que decidas tomar o importar", "Preferencias y ajustes de la app (molino, temperatura, tipo de filtro)"]], ["p", "Estos datos no son accesibles para nosotros ni para terceros. Puedes eliminarlos en cualquier momento desde la app o desinstalándola. Puedes desactivar la sincronización de iCloud para Logica Coffee en cualquier momento en <strong>Ajustes → [Tu nombre] → iCloud</strong> en tu iPhone."], ["h2", "Cámara y fotos"], ["p", "Logica Coffee puede tomar una foto de una bolsa de café para guardarla junto a un grano, y puede escanear la etiqueta de una bolsa para autocompletar detalles como el nombre, el origen y la fecha de tueste. La lectura de la etiqueta se realiza por completo en tu dispositivo mediante el reconocimiento de texto en el dispositivo de Apple — la imagen nunca se sube a nosotros ni a ningún servidor, y el escaneo ocurre sin conexión."], ["p", "La cámara solo se usa cuando tocas para tomar una foto, y únicamente después de que concedas permiso de cámara. Si en su lugar eliges una foto de tu galería, la app usa el selector de fotos del sistema de Apple, que entrega únicamente la imagen que seleccionas — Logica Coffee nunca obtiene acceso al resto de tu fototeca. Las fotos de bolsas que guardes se almacenan en tu dispositivo y, si iCloud está activado, en tu cuenta personal de iCloud, igual que el resto de tus datos. Puedes eliminar una foto en cualquier momento desde la pantalla de edición del grano."], ["h2", "Notificaciones"], ["p", "Si añades una fecha de tueste a un grano, Logica Coffee puede programar una notificación local para recordarte cuándo esos granos alcanzan su ventana óptima de frescura. Estos recordatorios se programan y se entregan por completo en tu dispositivo — no se envía ninguna información a ningún sitio, y las notificaciones solo se usan después de que concedas permiso. Puedes desactivarlas en cualquier momento en <strong>Ajustes → Notificaciones → Logica Coffee</strong>."], ["h2", "Sincronización con iCloud"], ["p", "Si tienes iCloud activado en tu dispositivo, Logica Coffee usa el servicio iCloud Drive (Documentos) de Apple para sincronizar tu diario, tu inventario de granos y tus recetas entre tu iPhone y cualquier otro dispositivo con la misma cuenta de Apple. Esta sincronización ocurre a través de tu cuenta personal de iCloud — los datos los almacena Apple según la <a href=\"https://www.apple.com/legal/privacy/\" target=\"_blank\">Política de Privacidad de Apple</a> y no son accesibles para nosotros de ninguna manera."], ["p", "La sincronización con iCloud es totalmente opcional y se controla desde los ajustes de tu dispositivo. Si iCloud no está disponible o está desactivado, la app guarda tus datos localmente en el dispositivo con normalidad."], ["h2", "Sincronización con Apple Watch"], ["p", "Si usas la app de Logica Coffee para Apple Watch, los datos de la sesión de preparación se comparten entre tu iPhone y tu Apple Watch mediante el framework WatchConnectivity de Apple. Esta comunicación ocurre directamente entre tus dos dispositivos a través de tu red local o Bluetooth — no pasa por ningún servidor externo."], ["h2", "Apple Health"], ["p", "Logica Coffee puede registrar en Apple Health una cantidad estimada de cafeína por cada preparación que guardas, de modo que tu consumo de cafeína aparezca junto al resto de tus datos de salud. Esto es totalmente opcional y está desactivado hasta que lo actives y concedas permiso en <strong>Ajustes → Apple Health</strong> dentro de la app."], ["p", "La app únicamente <em>escribe</em> entradas de cafeína — nunca lee ninguno de tus datos de salud. Apple exige la solicitud de permiso de lectura para poder habilitar el registro de cafeína, pero Logica Coffee no solicita acceso de lectura ni consulta nada de Salud. Todos los valores de cafeína se calculan en tu dispositivo a partir de la preparación que registraste, y los datos los almacena Apple en Salud según la <a href=\"https://www.apple.com/legal/privacy/\" target=\"_blank\">Política de Privacidad de Apple</a> — nunca se nos envían. Puedes revocar el acceso en cualquier momento en <strong>Ajustes → Salud → Acceso a datos y dispositivos → Logica Coffee</strong>."], ["h2", "Análisis de preparación en el dispositivo"], ["p", "En los iPhone y iPad compatibles con Apple Intelligence, Logica Coffee puede analizar una preparación registrada con el modelo fundacional de Apple en el dispositivo. Este análisis se ejecuta por completo en tu dispositivo. Los datos de tus preparaciones nunca se envían a Apple, a nosotros ni a ningún servidor, y no se requiere ninguna cuenta. La función está activada por defecto donde está disponible y puede desactivarse en cualquier momento en Ajustes. En los dispositivos sin Apple Intelligence, el asesoramiento integrado de James ofrece la misma orientación, también por completo en el dispositivo."], ["h2", "Compartir recetas"], ["p", "Logica Coffee te permite compartir una receta personalizada con otra persona mediante un enlace o un código QR. Esto siempre es opcional y solo ocurre cuando tocas Compartir. La receta completa — su nombre, autor y pasos de preparación — se codifica directamente en el propio enlace; no subimos ni almacenamos nada en ningún servidor, y el código QR se genera en tu dispositivo."], ["p", "A dónde va el enlace es decisión tuya: se entrega a la hoja de compartir estándar de Apple, así que tú decides si enviarlo por Mensajes, Mail o cualquier otro sitio. Cuando alguien abre un enlace compartido, primero se carga una pequeña página estática de redirección (alojada en GitHub Pages) que simplemente reenvía el enlace a la app Logica Coffee. Como con cualquier página web, el alojamiento de GitHub puede registrar registros de solicitudes rutinarios; nosotros no recopilamos, almacenamos ni usamos ningún dato de la receta. Las recetas que recibes nunca se añaden automáticamente — siempre ves una vista previa y confirmas antes de que se guarde algo en tu biblioteca."], ["h2", "Datos que no recopilamos"], ["ul", ["No recopilamos tu nombre, tu dirección de correo ni ninguna información de cuenta", "No rastreamos tu ubicación", "No leemos tus datos de Apple Health — el registro de cafeína es de solo escritura", "No recopilamos analíticas, informes de fallos ni estadísticas de uso", "No usamos SDK de publicidad ni te rastreamos entre apps", "No compartimos ningún dato con terceros"]], ["h2", "Servicios de terceros"], ["p", "Logica Coffee no integra ningún servicio de analítica, publicidad ni informes de fallos de terceros. Los únicos frameworks externos utilizados son los propios frameworks del sistema de Apple (WatchConnectivity, WidgetKit, ActivityKit, iCloud Documents, HealthKit, el framework de reconocimiento de texto en el dispositivo Vision, el selector de fotos del sistema y las notificaciones locales), todos los cuales operan según la <a href=\"https://www.apple.com/legal/privacy/\" target=\"_blank\">Política de Privacidad de Apple</a>."], ["h2", "Privacidad de los menores"], ["p", "Logica Coffee no recopila a sabiendas ningún dato de usuarios de ninguna edad. La app es apta para todas las edades."], ["h2", "Cambios en esta política"], ["p", "Si esta política cambia de forma significativa (por ejemplo, si una versión futura de la app introduce funciones de red), la fecha de actualización en la parte superior de esta página lo reflejará, y la nueva política estará disponible antes de que la actualización llegue a la App Store."], ["h2", "Contacto"], ["p", "¿Tienes preguntas sobre esta política de privacidad? Escríbenos a <a href=\"mailto:khatskevich.mv@gmail.com\">khatskevich.mv@gmail.com</a>."]]}, "fr": {"title": "Politique de confidentialité", "updated": "Dernière mise à jour : 17 juillet 2026 — prise en charge de l’iPad ajoutée à côté de l’analyse d’infusion sur l’appareil", "blocks": [["highlight", "Logica Coffee ne collecte, ne transmet ni ne partage aucune donnée personnelle. Vos données restent sous votre contrôle — sur votre appareil et, si vous le souhaitez, dans votre propre compte iCloud."], ["h2", "Aperçu"], ["p", "Logica Coffee est un compagnon personnel pour la préparation du café. Votre journal d'extractions, votre inventaire de grains, vos recettes et vos réglages sont enregistrés sur votre appareil et — si iCloud est activé — synchronisés entre vos appareils via votre compte iCloud personnel. Nous n'exploitons aucun serveur et aucune donnée ne nous est jamais envoyée. Aucun compte n'est requis."], ["h2", "Données enregistrées sur votre appareil"], ["p", "Les informations suivantes sont enregistrées sur votre appareil et, si iCloud est activé, dans votre compte iCloud personnel :"], ["ul", ["Entrées du journal d'extractions (méthode, dose, ratio, notes de dégustation, note en étoiles)", "Inventaire des grains de café (nom, origine, niveau de torréfaction, notes aromatiques, poids restant)", "Recettes personnalisées et déroulés d'extraction que vous créez", "Photos de vos paquets de café que vous choisissez de prendre ou d'importer", "Préférences et réglages de l'app (moulin, température, type de filtre)"]], ["p", "Ces données ne sont accessibles ni à nous ni à des tiers. Vous pouvez les supprimer à tout moment depuis l'app ou en la désinstallant. Vous pouvez désactiver la synchronisation iCloud pour Logica Coffee à tout moment dans <strong>Réglages → [Votre nom] → iCloud</strong> sur votre iPhone."], ["h2", "Appareil photo et photos"], ["p", "Logica Coffee peut prendre une photo d'un paquet de café pour l'enregistrer avec un grain, et peut scanner l'étiquette d'un paquet pour remplir automatiquement des détails comme le nom, l'origine et la date de torréfaction. La lecture de l'étiquette est entièrement effectuée sur votre appareil grâce à la reconnaissance de texte sur l'appareil d'Apple — l'image n'est jamais envoyée à nous ni à aucun serveur, et la numérisation se fait hors ligne."], ["p", "L'appareil photo n'est utilisé que lorsque vous touchez pour prendre une photo, et uniquement après que vous avez accordé l'autorisation d'accès à l'appareil photo. Si vous choisissez plutôt une photo dans votre photothèque, l'app utilise le sélecteur de photos du système d'Apple, qui ne transmet que l'unique image que vous sélectionnez — Logica Coffee n'obtient jamais accès au reste de votre photothèque. Les photos de paquets que vous enregistrez sont stockées sur votre appareil et, si iCloud est activé, dans votre compte iCloud personnel, exactement comme le reste de vos données. Vous pouvez retirer une photo à tout moment depuis l'écran de modification du grain."], ["h2", "Notifications"], ["p", "Si vous ajoutez une date de torréfaction à un grain, Logica Coffee peut programmer une notification locale pour vous rappeler quand ces grains atteignent leur fenêtre de fraîcheur optimale. Ces rappels sont programmés et délivrés entièrement sur votre appareil — aucune information n'est envoyée où que ce soit, et les notifications ne sont utilisées qu'après votre autorisation. Vous pouvez les désactiver à tout moment dans <strong>Réglages → Notifications → Logica Coffee</strong>."], ["h2", "Synchronisation iCloud"], ["p", "Si iCloud est activé sur votre appareil, Logica Coffee utilise le service iCloud Drive (Documents) d'Apple pour synchroniser votre journal, votre inventaire de grains et vos recettes entre votre iPhone et tout autre appareil connecté au même identifiant Apple. Cette synchronisation passe par votre compte iCloud personnel — les données sont stockées par Apple selon la <a href=\"https://www.apple.com/legal/privacy/\" target=\"_blank\">politique de confidentialité d'Apple</a> et ne nous sont accessibles d'aucune manière."], ["p", "La synchronisation iCloud est entièrement facultative et contrôlée par les réglages de votre appareil. Si iCloud est indisponible ou désactivé, l'app enregistre vos données localement sur l'appareil, comme d'habitude."], ["h2", "Synchronisation avec l'Apple Watch"], ["p", "Si vous utilisez l'app Logica Coffee pour Apple Watch, les données de session d'extraction sont partagées entre votre iPhone et votre Apple Watch via le framework WatchConnectivity d'Apple. Cette communication se fait directement entre vos deux appareils via votre réseau local ou le Bluetooth — elle ne transite par aucun serveur externe."], ["h2", "Apple Santé"], ["p", "Logica Coffee peut inscrire une quantité estimée de caféine pour chaque extraction que vous enregistrez dans Apple Santé, afin que votre consommation de caféine apparaisse aux côtés du reste de vos données de santé. C'est entièrement facultatif et désactivé jusqu'à ce que vous l'activiez et accordiez l'autorisation dans <strong>Réglages → Apple Santé</strong> au sein de l'app."], ["p", "L'app ne fait qu'<em>écrire</em> des entrées de caféine — elle ne lit jamais aucune de vos données de santé. Apple exige la demande d'autorisation de lecture pour activer l'enregistrement de la caféine, mais Logica Coffee ne demande aucun accès en lecture et n'interroge rien dans Santé. Toutes les valeurs de caféine sont calculées sur votre appareil à partir de l'extraction que vous avez enregistrée, et les données sont stockées par Apple dans Santé selon la <a href=\"https://www.apple.com/legal/privacy/\" target=\"_blank\">politique de confidentialité d'Apple</a> — elles ne nous sont jamais envoyées. Vous pouvez révoquer l'accès à tout moment dans <strong>Réglages → Santé → Accès aux données et appareils → Logica Coffee</strong>."], ["h2", "Analyse d’extraction sur l’appareil"], ["p", "Sur les iPhone et iPad compatibles avec Apple Intelligence, Logica Coffee peut analyser une extraction enregistrée à l’aide du modèle de fondation d’Apple exécuté sur l’appareil. Cette analyse se déroule entièrement sur votre appareil. Les données de vos extractions ne sont jamais envoyées à Apple, à nous ni à aucun serveur, et aucun compte n’est requis. La fonctionnalité est activée par défaut là où elle est disponible et peut être désactivée à tout moment dans Réglages. Sur les appareils sans Apple Intelligence, le coaching intégré de James fournit les mêmes conseils, également entièrement sur l’appareil."], ["h2", "Partage de recettes"], ["p", "Logica Coffee vous permet de partager une recette personnalisée avec quelqu'un sous forme de lien ou de code QR. C'est toujours facultatif et cela ne se produit que lorsque vous touchez Partager. La recette entière — son nom, son auteur et ses étapes d'extraction — est encodée directement dans le lien lui-même ; rien n'est envoyé ni stocké sur un serveur par nous, et le code QR est généré sur votre appareil."], ["p", "La destination du lien est votre choix : il est transmis à la feuille de partage standard d'Apple, vous décidez donc de l'envoyer via Messages, Mail ou ailleurs. Lorsque quelqu'un ouvre un lien partagé, une petite page de redirection statique (hébergée sur GitHub Pages) se charge d'abord et renvoie simplement le lien vers l'app Logica Coffee. Comme pour toute page web, l'hébergement de GitHub peut enregistrer des journaux de requêtes ordinaires ; aucune donnée de recette n'est collectée, stockée ou utilisée par nous. Les recettes que vous recevez ne sont jamais ajoutées automatiquement — vous voyez toujours un aperçu et confirmez avant que quoi que ce soit ne soit enregistré dans votre bibliothèque."], ["h2", "Données que nous ne collectons pas"], ["ul", ["Nous ne collectons pas votre nom, votre adresse e-mail ni aucune information de compte", "Nous ne suivons pas votre position", "Nous ne lisons pas vos données Apple Santé — l'enregistrement de la caféine se fait en écriture seule", "Nous ne collectons ni statistiques, ni rapports de plantage, ni données d'utilisation", "Nous n'utilisons aucun SDK publicitaire et ne vous suivons pas d'une app à l'autre", "Nous ne partageons aucune donnée avec des tiers"]], ["h2", "Services tiers"], ["p", "Logica Coffee n'intègre aucun service tiers d'analyse, de publicité ou de rapport de plantage. Les seuls frameworks externes utilisés sont les frameworks système d'Apple eux-mêmes (WatchConnectivity, WidgetKit, ActivityKit, iCloud Documents, HealthKit, le framework de reconnaissance de texte sur l'appareil Vision, le sélecteur de photos du système et les notifications locales), qui fonctionnent tous selon la <a href=\"https://www.apple.com/legal/privacy/\" target=\"_blank\">politique de confidentialité d'Apple</a>."], ["h2", "Confidentialité des enfants"], ["p", "Logica Coffee ne collecte sciemment aucune donnée d'utilisateurs, quel que soit leur âge. L'app convient à tous les âges."], ["h2", "Modifications de cette politique"], ["p", "Si cette politique change de manière significative (par exemple, si une future version de l'app introduit des fonctionnalités réseau), la date de mise à jour en haut de cette page le reflétera, et la nouvelle politique sera disponible avant que la mise à jour n'atteigne l'App Store."], ["h2", "Contact"], ["p", "Des questions sur cette politique de confidentialité ? Écrivez-nous à <a href=\"mailto:khatskevich.mv@gmail.com\">khatskevich.mv@gmail.com</a>."]]}, "it": {"title": "Informativa sulla privacy", "updated": "Ultimo aggiornamento: 17 luglio 2026 — aggiunto il supporto per iPad accanto all’analisi dell’estrazione sul dispositivo", "blocks": [["highlight", "Logica Coffee non raccoglie, trasmette né condivide alcun dato personale. I tuoi dati restano sotto il tuo controllo — sul tuo dispositivo e, se lo desideri, nel tuo account iCloud personale."], ["h2", "Panoramica"], ["p", "Logica Coffee è un compagno personale per la preparazione del caffè. Il tuo diario delle estrazioni, l'inventario dei chicchi, le ricette e le impostazioni sono salvati sul tuo dispositivo e — se hai iCloud attivo — sincronizzati tra i tuoi dispositivi tramite il tuo account iCloud personale. Non gestiamo alcun server e nessun dato ci viene mai inviato. Non è richiesto alcun account."], ["h2", "Dati salvati sul tuo dispositivo"], ["p", "Le seguenti informazioni vengono salvate sul tuo dispositivo e, se iCloud è attivo, nel tuo account iCloud personale:"], ["ul", ["Voci del diario delle estrazioni (metodo, dose, rapporto, note di degustazione, valutazione a stelle)", "Inventario dei chicchi di caffè (nome, origine, livello di tostatura, note aromatiche, peso rimanente)", "Ricette personalizzate e sequenze di estrazione che crei", "Foto dei tuoi sacchetti di caffè che scegli di scattare o importare", "Preferenze e impostazioni dell'app (macinino, temperatura, tipo di filtro)"]], ["p", "Questi dati non sono accessibili a noi né a terzi. Puoi eliminarli in qualsiasi momento dall'app o disinstallandola. Puoi disattivare la sincronizzazione iCloud per Logica Coffee in qualsiasi momento in <strong>Impostazioni → [Il tuo nome] → iCloud</strong> sul tuo iPhone."], ["h2", "Fotocamera e foto"], ["p", "Logica Coffee può scattare una foto di un sacchetto di caffè per salvarla con un chicco e può scansionare l'etichetta di un sacchetto per compilare automaticamente dettagli come nome, origine e data di tostatura. La lettura dell'etichetta avviene interamente sul tuo dispositivo tramite il riconoscimento del testo sul dispositivo di Apple — l'immagine non viene mai caricata a noi né su alcun server, e la scansione avviene offline."], ["p", "La fotocamera viene usata solo quando tocchi per scattare una foto e solo dopo che hai concesso il permesso per la fotocamera. Se invece scegli una foto dalla tua libreria, l'app usa il selettore di foto di sistema di Apple, che consegna solo la singola immagine che selezioni — Logica Coffee non ottiene mai accesso al resto della tua libreria foto. Le foto dei sacchetti che salvi vengono archiviate sul tuo dispositivo e, se iCloud è attivo, nel tuo account iCloud personale, esattamente come il resto dei tuoi dati. Puoi rimuovere una foto in qualsiasi momento dalla schermata di modifica del chicco."], ["h2", "Notifiche"], ["p", "Se aggiungi una data di tostatura a un chicco, Logica Coffee può programmare una notifica locale per ricordarti quando quei chicchi raggiungono la loro finestra di freschezza ottimale. Questi promemoria vengono programmati e consegnati interamente sul tuo dispositivo — nessuna informazione viene inviata da nessuna parte, e le notifiche vengono usate solo dopo che hai concesso il permesso. Puoi disattivarle in qualsiasi momento in <strong>Impostazioni → Notifiche → Logica Coffee</strong>."], ["h2", "Sincronizzazione iCloud"], ["p", "Se hai iCloud attivo sul tuo dispositivo, Logica Coffee usa il servizio iCloud Drive (Documenti) di Apple per sincronizzare il tuo diario, l'inventario dei chicchi e le ricette tra il tuo iPhone e qualsiasi altro dispositivo collegato allo stesso ID Apple. Questa sincronizzazione avviene tramite il tuo account iCloud personale — i dati sono archiviati da Apple secondo l'<a href=\"https://www.apple.com/legal/privacy/\" target=\"_blank\">Informativa sulla privacy di Apple</a> e non ci sono accessibili in alcun modo."], ["p", "La sincronizzazione iCloud è del tutto facoltativa ed è controllata dalle impostazioni del tuo dispositivo. Se iCloud non è disponibile o è disattivato, l'app archivia i tuoi dati localmente sul dispositivo come di consueto."], ["h2", "Sincronizzazione con Apple Watch"], ["p", "Se usi l'app Logica Coffee per Apple Watch, i dati della sessione di estrazione vengono condivisi tra il tuo iPhone e il tuo Apple Watch tramite il framework WatchConnectivity di Apple. Questa comunicazione avviene direttamente tra i tuoi due dispositivi tramite la rete locale o il Bluetooth — non passa attraverso alcun server esterno."], ["h2", "Apple Salute"], ["p", "Logica Coffee può registrare una quantità stimata di caffeina per ogni estrazione che salvi in Apple Salute, in modo che il tuo consumo di caffeina compaia insieme al resto dei tuoi dati sulla salute. Questo è del tutto facoltativo e disattivato finché non lo attivi e concedi il permesso in <strong>Impostazioni → Apple Salute</strong> all'interno dell'app."], ["p", "L'app si limita a <em>scrivere</em> voci sulla caffeina — non legge mai alcun tuo dato sulla salute. Apple richiede la richiesta di permesso di lettura per abilitare del tutto la registrazione della caffeina, ma Logica Coffee non richiede alcun accesso in lettura e non interroga nulla da Salute. Tutti i valori di caffeina vengono calcolati sul tuo dispositivo a partire dall'estrazione che hai registrato, e i dati sono archiviati da Apple in Salute secondo l'<a href=\"https://www.apple.com/legal/privacy/\" target=\"_blank\">Informativa sulla privacy di Apple</a> — non ci vengono mai inviati. Puoi revocare l'accesso in qualsiasi momento in <strong>Impostazioni → Salute → Accesso ai dati e dispositivi → Logica Coffee</strong>."], ["h2", "Analisi dell’estrazione sul dispositivo"], ["p", "Sugli iPhone e iPad che supportano Apple Intelligence, Logica Coffee può analizzare un’estrazione registrata usando il modello di base di Apple sul dispositivo. Questa analisi viene eseguita interamente sul tuo dispositivo. I dati delle tue estrazioni non vengono mai inviati ad Apple, a noi o a qualsiasi server, e non è richiesto alcun account. La funzione è attiva per impostazione predefinita dove disponibile e può essere disattivata in qualsiasi momento in Impostazioni. Sui dispositivi senza Apple Intelligence, il coaching integrato di James offre la stessa guida, anch’essa interamente sul dispositivo."], ["h2", "Condivisione delle ricette"], ["p", "Logica Coffee ti permette di condividere una ricetta personalizzata con qualcun altro come link o codice QR. È sempre facoltativo e avviene solo quando tocchi Condividi. L'intera ricetta — il nome, l'autore e i passaggi di estrazione — viene codificata direttamente nel link stesso; nulla viene caricato o archiviato su un server da noi, e il codice QR viene generato sul tuo dispositivo."], ["p", "La destinazione del link è una tua scelta: viene consegnato al foglio di condivisione standard di Apple, quindi decidi tu se inviarlo tramite Messaggi, Mail o altrove. Quando qualcuno apre un link condiviso, viene prima caricata una piccola pagina di reindirizzamento statica (ospitata su GitHub Pages) che si limita a rimbalzare il link nell'app Logica Coffee. Come per qualsiasi pagina web, l'hosting di GitHub può registrare normali log delle richieste; nessun dato della ricetta viene raccolto, archiviato o usato da noi. Le ricette che ricevi non vengono mai aggiunte automaticamente — vedi sempre un'anteprima e confermi prima che qualcosa venga salvato nella tua libreria."], ["h2", "Dati che non raccogliamo"], ["ul", ["Non raccogliamo il tuo nome, il tuo indirizzo e-mail né alcuna informazione sull'account", "Non tracciamo la tua posizione", "Non leggiamo i tuoi dati Apple Salute — la registrazione della caffeina è di sola scrittura", "Non raccogliamo statistiche, report sugli arresti anomali o dati di utilizzo", "Non usiamo SDK pubblicitari né ti tracciamo tra le app", "Non condividiamo alcun dato con terzi"]], ["h2", "Servizi di terze parti"], ["p", "Logica Coffee non integra alcun servizio di analisi, pubblicità o segnalazione di arresti anomali di terze parti. Gli unici framework esterni utilizzati sono i framework di sistema di Apple stessa (WatchConnectivity, WidgetKit, ActivityKit, iCloud Documents, HealthKit, il framework di riconoscimento del testo sul dispositivo Vision, il selettore di foto di sistema e le notifiche locali), tutti operanti secondo l'<a href=\"https://www.apple.com/legal/privacy/\" target=\"_blank\">Informativa sulla privacy di Apple</a>."], ["h2", "Privacy dei minori"], ["p", "Logica Coffee non raccoglie consapevolmente alcun dato da utenti di qualsiasi età. L'app è adatta a tutte le età."], ["h2", "Modifiche a questa informativa"], ["p", "Se questa informativa cambia in modo significativo (ad esempio, se una futura versione dell'app introduce funzionalità di rete), la data di aggiornamento in cima a questa pagina lo rifletterà, e la nuova informativa sarà disponibile prima che l'aggiornamento raggiunga l'App Store."], ["h2", "Contatti"], ["p", "Domande su questa informativa sulla privacy? Scrivici a <a href=\"mailto:khatskevich.mv@gmail.com\">khatskevich.mv@gmail.com</a>."]]}, "ja": {"title": "プライバシーポリシー", "updated": "最終更新日：2026年7月17日 — デバイス内での抽出分析に加えてiPad対応を追記", "blocks": [["highlight", "Logica Coffeeは、いかなる個人データも収集、送信、共有しません。あなたのデータはあなたの管理下に留まります — あなたのデバイス上、そしてご希望であればあなた自身のiCloudアカウント内に。"], ["h2", "概要"], ["p", "Logica Coffeeは、コーヒーを淹れるための個人向けコンパニオンです。抽出ジャーナル、豆の在庫、レシピ、設定はあなたのデバイスに保存され、iCloudが有効な場合はあなた個人のiCloudアカウントを通じてデバイス間で同期されます。当社はサーバーを一切運用しておらず、データが当社に送信されることは決してありません。アカウントは不要です。"], ["h2", "デバイスに保存されるデータ"], ["p", "以下の情報はあなたのデバイスに、iCloudが有効な場合はあなた個人のiCloudアカウントに保存されます："], ["ul", ["抽出ジャーナルの記録（メソッド、分量、比率、テイスティングノート、星評価）", "コーヒー豆の在庫（名前、産地、焙煎度、フレーバーノート、残量）", "あなたが作成したカスタムレシピと抽出タイムライン", "あなたが撮影またはインポートを選んだコーヒーバッグの写真", "アプリの設定と環境設定（グラインダー、温度、フィルターの種類）"]], ["p", "これらのデータは当社や第三者がアクセスすることはできません。アプリ内からいつでも削除でき、アプリをアンインストールすることでも削除できます。Logica CoffeeのiCloud同期は、iPhoneの<strong>設定 → [あなたの名前] → iCloud</strong>からいつでも無効にできます。"], ["h2", "カメラと写真"], ["p", "Logica Coffeeは、コーヒーバッグの写真を撮影して豆と一緒に保存したり、バッグのラベルをスキャンして名前、産地、焙煎日などの詳細を自動入力したりできます。ラベルの読み取りは、Appleのオンデバイステキスト認識を使用して完全にあなたのデバイス上で行われます — 画像が当社やいかなるサーバーにアップロードされることは決してなく、スキャンはオフラインで行われます。"], ["p", "カメラは、あなたが撮影をタップしたときのみ、かつカメラの許可を与えた後にのみ使用されます。代わりにライブラリから写真を選ぶ場合、アプリはAppleのシステム写真ピッカーを使用し、あなたが選択した1枚の画像のみを受け取ります — Logica Coffeeがあなたの写真ライブラリの残りにアクセスすることは決してありません。保存したバッグの写真は、他のデータとまったく同じように、あなたのデバイスに、iCloudが有効な場合はあなた個人のiCloudアカウントに保存されます。写真は豆の編集画面からいつでも削除できます。"], ["h2", "通知"], ["p", "豆に焙煎日を追加すると、Logica Coffeeはその豆が最高の鮮度の時期に達したときに知らせるローカル通知をスケジュールできます。これらのリマインダーは完全にあなたのデバイス上でスケジュールされ配信されます — 情報がどこかに送信されることはなく、通知は許可を与えた後にのみ使用されます。<strong>設定 → 通知 → Logica Coffee</strong>からいつでもオフにできます。"], ["h2", "iCloud同期"], ["p", "デバイスでiCloudが有効になっている場合、Logica CoffeeはAppleのiCloud Drive（書類）サービスを使用して、ジャーナル、豆の在庫、レシピを、あなたのiPhoneと同じApple IDでサインインしている他のデバイスとの間で同期します。この同期はあなた個人のiCloudアカウントを通じて行われます — データはAppleによって<a href=\"https://www.apple.com/legal/privacy/\" target=\"_blank\">Appleのプライバシーポリシー</a>に従って保存され、当社がアクセスすることは一切できません。"], ["p", "iCloud同期は完全に任意であり、デバイスの設定で制御されます。iCloudが利用できないか無効になっている場合、アプリは通常どおりデバイス上にローカルでデータを保存します。"], ["h2", "Apple Watch同期"], ["p", "Logica CoffeeのApple Watchアプリを使用する場合、抽出セッションのデータはAppleのWatchConnectivityフレームワークを使用してあなたのiPhoneとApple Watchの間で共有されます。この通信はローカルネットワークまたはBluetooth経由であなたの2つのデバイス間で直接行われます — 外部サーバーを経由することはありません。"], ["h2", "Appleヘルスケア"], ["p", "Logica Coffeeは、保存した各抽出について推定カフェイン量をAppleヘルスケアに記録でき、あなたのカフェイン摂取量が他の健康データと並んで表示されるようにします。これは完全に任意であり、アプリ内の<strong>設定 → Appleヘルスケア</strong>でオンにして許可を与えるまでオフになっています。"], ["p", "アプリはカフェインのエントリを<em>書き込む</em>だけで — あなたの健康データを読み取ることは決してありません。Appleはカフェイン記録を有効にするために読み取り許可のプロンプトを要求しますが、Logica Coffeeは読み取りアクセスを一切要求せず、ヘルスケアから何も照会しません。すべてのカフェイン値は、あなたが記録した抽出からデバイス上で計算され、データはAppleによってヘルスケア内に<a href=\"https://www.apple.com/legal/privacy/\" target=\"_blank\">Appleのプライバシーポリシー</a>に従って保存されます — 当社に送信されることは決してありません。アクセスは<strong>設定 → ヘルスケア → データアクセスとデバイス → Logica Coffee</strong>からいつでも取り消せます。"], ["h2", "デバイス内での抽出分析"], ["p", "Apple Intelligence に対応した iPhone や iPad では、Logica Coffee は Apple のオンデバイス基盤モデルを使って、記録した抽出を分析できます。この分析はすべてあなたのデバイス内で実行されます。抽出データが Apple や当社、いかなるサーバーにも送信されることはなく、アカウントも不要です。この機能は利用できる環境では初期設定でオンになっており、いつでも「設定」でオフにできます。Apple Intelligence がないデバイスでは、内蔵コーチのジェームズが同じアドバイスを提供します。これもすべてデバイス内で行われます。"], ["h2", "レシピの共有"], ["p", "Logica Coffeeでは、カスタムレシピをリンクまたはQRコードとして他の人と共有できます。これは常に任意であり、共有をタップしたときにのみ行われます。レシピ全体 — 名前、作成者、抽出ステップ — はリンク自体に直接エンコードされます。当社によってサーバーにアップロードまたは保存されるものは何もなく、QRコードはあなたのデバイス上で生成されます。"], ["p", "リンクの送り先はあなたの選択です：Apple標準の共有シートに渡されるので、メッセージ、メール、その他どこに送るかをあなたが決めます。誰かが共有リンクを開くと、まず小さな静的リダイレクトページ（GitHub Pagesでホスト）が読み込まれ、リンクをLogica Coffeeアプリに転送するだけです。どのウェブページとも同様に、GitHubのホスティングは通常のリクエストログを記録する場合があります。レシピデータが当社によって収集、保存、使用されることはありません。受け取ったレシピが自動的に追加されることは決してありません — 何かがライブラリに保存される前に、必ずプレビューを見て確認します。"], ["h2", "当社が収集しないデータ"], ["ul", ["あなたの名前、メールアドレス、アカウント情報を収集しません", "あなたの位置情報を追跡しません", "あなたのAppleヘルスケアのデータを読み取りません — カフェイン記録は書き込み専用です", "分析、クラッシュレポート、使用統計を収集しません", "広告SDKを使用せず、アプリをまたいであなたを追跡しません", "いかなるデータも第三者と共有しません"]], ["h2", "サードパーティのサービス"], ["p", "Logica Coffeeは、サードパーティの分析、広告、クラッシュレポートサービスを一切組み込んでいません。使用される唯一の外部フレームワークはApple自身のシステムフレームワーク（WatchConnectivity、WidgetKit、ActivityKit、iCloud Documents、HealthKit、オンデバイステキスト認識フレームワークVision、システム写真ピッカー、ローカル通知）であり、これらはすべて<a href=\"https://www.apple.com/legal/privacy/\" target=\"_blank\">Appleのプライバシーポリシー</a>の下で動作します。"], ["h2", "子どものプライバシー"], ["p", "Logica Coffeeは、年齢を問わずユーザーからいかなるデータも故意に収集しません。このアプリはすべての年齢に適しています。"], ["h2", "このポリシーの変更"], ["p", "このポリシーが重要な形で変更される場合（例えば、将来のバージョンのアプリがネットワーク機能を導入する場合）、このページ上部の更新日にそれが反映され、新しいポリシーはアップデートがApp Storeに届く前に利用可能になります。"], ["h2", "お問い合わせ"], ["p", "このプライバシーポリシーについてご質問がありますか？<a href=\"mailto:khatskevich.mv@gmail.com\">khatskevich.mv@gmail.com</a>までご連絡ください。"]]}, "pl": {"title": "Polityka prywatności", "updated": "Ostatnia aktualizacja: 17 lipca 2026 — dodano obsługę iPada obok analizy parzenia na urządzeniu", "blocks": [["highlight", "Logica Coffee nie zbiera, nie przesyła ani nie udostępnia żadnych danych osobowych. Twoje dane pozostają pod Twoją kontrolą — na Twoim urządzeniu i, jeśli zechcesz, na Twoim własnym koncie iCloud."], ["h2", "Przegląd"], ["p", "Logica Coffee to osobisty towarzysz parzenia kawy. Twój dziennik parzeń, zapas ziaren, przepisy i ustawienia są zapisywane na Twoim urządzeniu i — jeśli iCloud jest włączony — synchronizowane między Twoimi urządzeniami za pośrednictwem Twojego osobistego konta iCloud. Nie prowadzimy żadnych serwerów i żadne dane nigdy nie są do nas wysyłane. Konto nie jest wymagane."], ["h2", "Dane przechowywane na Twoim urządzeniu"], ["p", "Następujące informacje są zapisywane na Twoim urządzeniu i, jeśli iCloud jest włączony, na Twoim osobistym koncie iCloud:"], ["ul", ["Wpisy dziennika parzeń (metoda, dawka, proporcja, notatki degustacyjne, ocena w gwiazdkach)", "Zapas ziaren kawy (nazwa, pochodzenie, stopień palenia, nuty smakowe, pozostała waga)", "Tworzone przez Ciebie własne przepisy i harmonogramy parzenia", "Zdjęcia Twoich opakowań kawy, które zdecydujesz się zrobić lub zaimportować", "Preferencje i ustawienia aplikacji (młynek, temperatura, rodzaj filtra)"]], ["p", "Te dane nie są dostępne dla nas ani dla osób trzecich. Możesz je usunąć w dowolnym momencie z poziomu aplikacji lub odinstalowując aplikację. Synchronizację iCloud dla Logica Coffee możesz wyłączyć w dowolnym momencie w <strong>Ustawienia → [Twoje imię] → iCloud</strong> na swoim iPhonie."], ["h2", "Aparat i zdjęcia"], ["p", "Logica Coffee może zrobić zdjęcie opakowania kawy, aby zapisać je przy ziarnie, oraz może zeskanować etykietę opakowania, aby automatycznie uzupełnić takie szczegóły jak nazwa, pochodzenie i data palenia. Odczyt etykiety odbywa się w całości na Twoim urządzeniu za pomocą rozpoznawania tekstu na urządzeniu firmy Apple — obraz nigdy nie jest przesyłany do nas ani na żaden serwer, a skanowanie odbywa się offline."], ["p", "Aparat jest używany tylko wtedy, gdy stukniesz, aby zrobić zdjęcie, i tylko po udzieleniu zgody na dostęp do aparatu. Jeśli zamiast tego wybierzesz zdjęcie z biblioteki, aplikacja korzysta z systemowego selektora zdjęć Apple, który przekazuje tylko to jedno wybrane przez Ciebie zdjęcie — Logica Coffee nigdy nie uzyskuje dostępu do reszty Twojej biblioteki zdjęć. Zapisane zdjęcia opakowań są przechowywane na Twoim urządzeniu i, jeśli iCloud jest włączony, na Twoim osobistym koncie iCloud, dokładnie tak jak reszta Twoich danych. Zdjęcie możesz usunąć w dowolnym momencie z ekranu edycji ziarna."], ["h2", "Powiadomienia"], ["p", "Jeśli dodasz datę palenia do ziarna, Logica Coffee może zaplanować lokalne powiadomienie, aby przypomnieć Ci, kiedy te ziarna osiągną szczyt świeżości. Te przypomnienia są planowane i dostarczane w całości na Twoim urządzeniu — żadne informacje nie są nigdzie wysyłane, a powiadomienia są używane dopiero po udzieleniu zgody. Możesz je wyłączyć w dowolnym momencie w <strong>Ustawienia → Powiadomienia → Logica Coffee</strong>."], ["h2", "Synchronizacja iCloud"], ["p", "Jeśli na Twoim urządzeniu włączony jest iCloud, Logica Coffee korzysta z usługi iCloud Drive (Dokumenty) firmy Apple, aby synchronizować Twój dziennik, zapas ziaren i przepisy między Twoim iPhonem a wszelkimi innymi urządzeniami zalogowanymi na to samo Apple ID. Ta synchronizacja odbywa się za pośrednictwem Twojego osobistego konta iCloud — dane są przechowywane przez Apple zgodnie z <a href=\"https://www.apple.com/legal/privacy/\" target=\"_blank\">Polityką prywatności Apple</a> i w żaden sposób nie są dla nas dostępne."], ["p", "Synchronizacja iCloud jest całkowicie opcjonalna i kontrolowana przez ustawienia Twojego urządzenia. Jeśli iCloud jest niedostępny lub wyłączony, aplikacja przechowuje Twoje dane lokalnie na urządzeniu, jak zwykle."], ["h2", "Synchronizacja z Apple Watch"], ["p", "Jeśli korzystasz z aplikacji Logica Coffee na Apple Watch, dane sesji parzenia są współdzielone między Twoim iPhonem a Apple Watch za pomocą frameworka WatchConnectivity firmy Apple. Ta komunikacja odbywa się bezpośrednio między Twoimi dwoma urządzeniami przez sieć lokalną lub Bluetooth — nie przechodzi przez żaden zewnętrzny serwer."], ["h2", "Apple Zdrowie"], ["p", "Logica Coffee może zapisać szacunkową ilość kofeiny dla każdego zapisanego przez Ciebie parzenia w Apple Zdrowie, aby Twoje spożycie kofeiny pojawiało się obok reszty Twoich danych zdrowotnych. Jest to całkowicie opcjonalne i wyłączone, dopóki tego nie włączysz i nie udzielisz zgody w <strong>Ustawienia → Apple Zdrowie</strong> w aplikacji."], ["p", "Aplikacja jedynie <em>zapisuje</em> wpisy dotyczące kofeiny — nigdy nie odczytuje żadnych Twoich danych zdrowotnych. Apple wymaga monitu o zgodę na odczyt, aby w ogóle umożliwić zapisywanie kofeiny, ale Logica Coffee nie żąda dostępu do odczytu i niczego nie odpytuje ze Zdrowia. Wszystkie wartości kofeiny są obliczane na Twoim urządzeniu na podstawie zapisanego przez Ciebie parzenia, a dane są przechowywane przez Apple w Zdrowiu zgodnie z <a href=\"https://www.apple.com/legal/privacy/\" target=\"_blank\">Polityką prywatności Apple</a> — nigdy nie są do nas wysyłane. Dostęp możesz cofnąć w dowolnym momencie w <strong>Ustawienia → Zdrowie → Dostęp do danych i urządzenia → Logica Coffee</strong>."], ["h2", "Analiza parzenia na urządzeniu"], ["p", "Na iPhone’ach i iPadach obsługujących Apple Intelligence Logica Coffee może przeanalizować zapisane parzenie za pomocą modelu podstawowego Apple działającego na urządzeniu. Ta analiza odbywa się w całości na Twoim urządzeniu. Dane o Twoich parzeniach nigdy nie są wysyłane do Apple, do nas ani na żaden serwer, a konto nie jest wymagane. Funkcja jest domyślnie włączona tam, gdzie jest dostępna, i można ją w każdej chwili wyłączyć w Ustawieniach. Na urządzeniach bez Apple Intelligence wbudowany coaching Jamesa zapewnia te same wskazówki — również w całości na urządzeniu."], ["h2", "Udostępnianie przepisów"], ["p", "Logica Coffee pozwala udostępnić własny przepis komuś innemu w postaci linku lub kodu QR. Jest to zawsze opcjonalne i następuje tylko wtedy, gdy stukniesz Udostępnij. Cały przepis — jego nazwa, autor i kroki parzenia — jest zakodowany bezpośrednio w samym linku; nic nie jest przez nas przesyłane ani przechowywane na serwerze, a kod QR jest generowany na Twoim urządzeniu."], ["p", "Dokąd trafi link, zależy od Ciebie: jest przekazywany do standardowego arkusza udostępniania Apple, więc to Ty decydujesz, czy wysłać go przez Wiadomości, Mail czy gdziekolwiek indziej. Gdy ktoś otworzy udostępniony link, najpierw ładuje się mała statyczna strona przekierowująca (hostowana na GitHub Pages), która po prostu odsyła link do aplikacji Logica Coffee. Jak w przypadku każdej strony internetowej, hosting GitHub może rejestrować rutynowe logi żądań; żadne dane przepisu nie są przez nas zbierane, przechowywane ani wykorzystywane. Otrzymane przepisy nigdy nie są dodawane automatycznie — zawsze widzisz podgląd i potwierdzasz, zanim cokolwiek zostanie zapisane w Twojej bibliotece."], ["h2", "Dane, których nie zbieramy"], ["ul", ["Nie zbieramy Twojego imienia, adresu e-mail ani żadnych informacji o koncie", "Nie śledzimy Twojej lokalizacji", "Nie odczytujemy Twoich danych Apple Zdrowie — zapisywanie kofeiny działa tylko do zapisu", "Nie zbieramy analityki, raportów o awariach ani statystyk użytkowania", "Nie używamy reklamowych SDK ani nie śledzimy Cię między aplikacjami", "Nie udostępniamy żadnych danych osobom trzecim"]], ["h2", "Usługi firm trzecich"], ["p", "Logica Coffee nie integruje żadnych zewnętrznych usług analitycznych, reklamowych ani raportowania awarii. Jedynymi używanymi zewnętrznymi frameworkami są własne frameworki systemowe Apple (WatchConnectivity, WidgetKit, ActivityKit, iCloud Documents, HealthKit, framework rozpoznawania tekstu na urządzeniu Vision, systemowy selektor zdjęć i powiadomienia lokalne), z których wszystkie działają zgodnie z <a href=\"https://www.apple.com/legal/privacy/\" target=\"_blank\">Polityką prywatności Apple</a>."], ["h2", "Prywatność dzieci"], ["p", "Logica Coffee świadomie nie zbiera żadnych danych od użytkowników w żadnym wieku. Aplikacja jest odpowiednia dla wszystkich grup wiekowych."], ["h2", "Zmiany w tej polityce"], ["p", "Jeśli ta polityka zmieni się w istotny sposób (na przykład, jeśli przyszła wersja aplikacji wprowadzi funkcje sieciowe), data aktualizacji u góry tej strony to odzwierciedli, a nowa polityka będzie dostępna, zanim aktualizacja trafi do App Store."], ["h2", "Kontakt"], ["p", "Pytania dotyczące tej polityki prywatności? Napisz do nas na <a href=\"mailto:khatskevich.mv@gmail.com\">khatskevich.mv@gmail.com</a>."]]}, "pt-BR": {"title": "Política de Privacidade", "updated": "Última atualização: 17 de julho de 2026 — suporte a iPad adicionado junto à análise de preparo no dispositivo", "blocks": [["highlight", "O Logica Coffee não coleta, transmite nem compartilha nenhum dado pessoal. Seus dados permanecem sob seu controle — no seu dispositivo e, se você quiser, na sua própria conta do iCloud."], ["h2", "Visão geral"], ["p", "O Logica Coffee é um companheiro pessoal para o preparo de café. Seu diário de preparos, seu estoque de grãos, suas receitas e ajustes são salvos no seu dispositivo e — se você tiver o iCloud ativado — sincronizados entre seus dispositivos pela sua conta pessoal do iCloud. Não operamos nenhum servidor e nenhum dado é enviado a nós. Nenhuma conta é necessária."], ["h2", "Dados armazenados no seu dispositivo"], ["p", "As seguintes informações são salvas no seu dispositivo e, se o iCloud estiver ativado, na sua conta pessoal do iCloud:"], ["ul", ["Entradas do diário de preparos (método, dose, proporção, notas de degustação, avaliação por estrelas)", "Estoque de grãos de café (nome, origem, nível de torra, notas de sabor, peso restante)", "Receitas personalizadas e sequências de preparo que você cria", "Fotos dos seus pacotes de café que você optar por tirar ou importar", "Preferências e ajustes do app (moedor, temperatura, tipo de filtro)"]], ["p", "Esses dados não são acessíveis a nós nem a terceiros. Você pode excluí-los a qualquer momento pelo app ou desinstalando-o. Você pode desativar a sincronização do iCloud para o Logica Coffee a qualquer momento em <strong>Ajustes → [Seu nome] → iCloud</strong> no seu iPhone."], ["h2", "Câmera e fotos"], ["p", "O Logica Coffee pode tirar uma foto de um pacote de café para salvar junto a um grão e pode escanear o rótulo de um pacote para preencher automaticamente detalhes como nome, origem e data de torra. A leitura do rótulo é feita inteiramente no seu dispositivo usando o reconhecimento de texto no dispositivo da Apple — a imagem nunca é enviada a nós nem a nenhum servidor, e a digitalização acontece offline."], ["p", "A câmera só é usada quando você toca para tirar uma foto, e somente depois de você conceder permissão de câmera. Se você optar por escolher uma foto da sua biblioteca, o app usa o seletor de fotos do sistema da Apple, que entrega apenas a única imagem que você seleciona — o Logica Coffee nunca obtém acesso ao restante da sua fototeca. As fotos de pacotes que você salva são armazenadas no seu dispositivo e, se o iCloud estiver ativado, na sua conta pessoal do iCloud, exatamente como o restante dos seus dados. Você pode remover uma foto a qualquer momento na tela de edição do grão."], ["h2", "Notificações"], ["p", "Se você adicionar uma data de torra a um grão, o Logica Coffee pode agendar uma notificação local para lembrá-lo de quando aqueles grãos atingem a janela ideal de frescor. Esses lembretes são agendados e entregues inteiramente no seu dispositivo — nenhuma informação é enviada a lugar nenhum, e as notificações só são usadas depois de você conceder permissão. Você pode desativá-las a qualquer momento em <strong>Ajustes → Notificações → Logica Coffee</strong>."], ["h2", "Sincronização com o iCloud"], ["p", "Se você tiver o iCloud ativado no seu dispositivo, o Logica Coffee usa o serviço iCloud Drive (Documentos) da Apple para sincronizar seu diário, seu estoque de grãos e suas receitas entre o seu iPhone e qualquer outro dispositivo conectado ao mesmo ID Apple. Essa sincronização acontece pela sua conta pessoal do iCloud — os dados são armazenados pela Apple conforme a <a href=\"https://www.apple.com/legal/privacy/\" target=\"_blank\">Política de Privacidade da Apple</a> e não são acessíveis a nós de forma alguma."], ["p", "A sincronização com o iCloud é totalmente opcional e controlada pelos ajustes do seu dispositivo. Se o iCloud estiver indisponível ou desativado, o app armazena seus dados localmente no dispositivo normalmente."], ["h2", "Sincronização com o Apple Watch"], ["p", "Se você usa o app Logica Coffee para Apple Watch, os dados da sessão de preparo são compartilhados entre o seu iPhone e o seu Apple Watch usando o framework WatchConnectivity da Apple. Essa comunicação acontece diretamente entre os seus dois dispositivos pela sua rede local ou Bluetooth — não passa por nenhum servidor externo."], ["h2", "Apple Saúde"], ["p", "O Logica Coffee pode registrar uma quantidade estimada de cafeína para cada preparo que você salva no Apple Saúde, para que seu consumo de cafeína apareça junto com o restante dos seus dados de saúde. Isso é totalmente opcional e fica desativado até você ativá-lo e conceder permissão em <strong>Ajustes → Apple Saúde</strong> dentro do app."], ["p", "O app apenas <em>grava</em> entradas de cafeína — ele nunca lê nenhum dos seus dados de saúde. A Apple exige a solicitação de permissão de leitura para habilitar o registro de cafeína, mas o Logica Coffee não solicita acesso de leitura e não consulta nada do Saúde. Todos os valores de cafeína são calculados no seu dispositivo a partir do preparo que você registrou, e os dados são armazenados pela Apple no Saúde conforme a <a href=\"https://www.apple.com/legal/privacy/\" target=\"_blank\">Política de Privacidade da Apple</a> — nunca são enviados a nós. Você pode revogar o acesso a qualquer momento em <strong>Ajustes → Saúde → Acesso a Dados e Dispositivos → Logica Coffee</strong>."], ["h2", "Análise de preparo no dispositivo"], ["p", "Em iPhones e iPads compatíveis com a Apple Intelligence, o Logica Coffee pode analisar um preparo registrado usando o modelo de fundação da Apple no dispositivo. Essa análise é executada inteiramente no seu dispositivo. Os dados dos seus preparos nunca são enviados à Apple, a nós ou a qualquer servidor, e nenhuma conta é necessária. O recurso vem ativado por padrão onde está disponível e pode ser desativado a qualquer momento nos Ajustes. Em dispositivos sem a Apple Intelligence, o coaching integrado do James oferece a mesma orientação, també
