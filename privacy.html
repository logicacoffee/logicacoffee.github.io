m inteiramente no dispositivo."], ["h2", "Compartilhamento de receitas"], ["p", "O Logica Coffee permite que você compartilhe uma receita personalizada com outra pessoa como um link ou um código QR. Isso é sempre opcional e só acontece quando você toca em Compartilhar. A receita inteira — seu nome, autor e etapas de preparo — é codificada diretamente no próprio link; nada é enviado nem armazenado em um servidor por nós, e o código QR é gerado no seu dispositivo."], ["p", "Para onde o link vai é escolha sua: ele é entregue à folha de compartilhamento padrão da Apple, então você decide se o envia por Mensagens, Mail ou em qualquer outro lugar. Quando alguém abre um link compartilhado, primeiro carrega uma pequena página estática de redirecionamento (hospedada no GitHub Pages) que apenas devolve o link para o app Logica Coffee. Como em qualquer página web, a hospedagem do GitHub pode registrar logs de solicitação rotineiros; nenhum dado de receita é coletado, armazenado ou usado por nós. Receitas que você recebe nunca são adicionadas automaticamente — você sempre vê uma pré-visualização e confirma antes de algo ser salvo na sua biblioteca."], ["h2", "Dados que não coletamos"], ["ul", ["Não coletamos seu nome, seu endereço de e-mail nem nenhuma informação de conta", "Não rastreamos sua localização", "Não lemos seus dados do Apple Saúde — o registro de cafeína é somente de gravação", "Não coletamos análises, relatórios de falhas nem estatísticas de uso", "Não usamos SDKs de publicidade nem rastreamos você entre apps", "Não compartilhamos nenhum dado com terceiros"]], ["h2", "Serviços de terceiros"], ["p", "O Logica Coffee não integra nenhum serviço de análise, publicidade ou relatório de falhas de terceiros. Os únicos frameworks externos usados são os próprios frameworks de sistema da Apple (WatchConnectivity, WidgetKit, ActivityKit, iCloud Documents, HealthKit, o framework de reconhecimento de texto no dispositivo Vision, o seletor de fotos do sistema e as notificações locais), todos operando conforme a <a href=\"https://www.apple.com/legal/privacy/\" target=\"_blank\">Política de Privacidade da Apple</a>."], ["h2", "Privacidade infantil"], ["p", "O Logica Coffee não coleta intencionalmente nenhum dado de usuários de qualquer idade. O app é adequado para todas as idades."], ["h2", "Alterações nesta política"], ["p", "Se esta política mudar de forma significativa (por exemplo, se uma versão futura do app introduzir recursos de rede), a data de atualização no topo desta página refletirá isso, e a nova política estará disponível antes de a atualização chegar à App Store."], ["h2", "Contato"], ["p", "Dúvidas sobre esta política de privacidade? Entre em contato pelo <a href=\"mailto:khatskevich.mv@gmail.com\">khatskevich.mv@gmail.com</a>."]]}, "ru": {"title": "Политика конфиденциальности", "updated": "Последнее обновление: 17 июля 2026 г. — добавлена поддержка iPad наряду с анализом заваривания на устройстве", "blocks": [["highlight", "Logica Coffee не собирает, не передаёт и не делится никакими персональными данными. Ваши данные остаются под вашим контролем — на вашем устройстве и, по вашему желанию, в вашей собственной учётной записи iCloud."], ["h2", "Обзор"], ["p", "Logica Coffee — это персональный помощник для заваривания кофе. Ваш журнал заварок, запас зёрен, рецепты и настройки хранятся на вашем устройстве и — если iCloud включён — синхронизируются между вашими устройствами через вашу личную учётную запись iCloud. Мы не используем никаких серверов, и никакие данные нам не отправляются. Учётная запись не требуется."], ["h2", "Данные, хранящиеся на вашем устройстве"], ["p", "Следующая информация сохраняется на вашем устройстве и, если iCloud включён, в вашей личной учётной записи iCloud:"], ["ul", ["Записи журнала заварок (метод, доза, пропорция, дегустационные заметки, оценка в звёздах)", "Запас кофейных зёрен (название, происхождение, степень обжарки, вкусовые ноты, остаток веса)", "Создаваемые вами собственные рецепты и тайминги заваривания", "Фотографии ваших пакетов кофе, которые вы решите сделать или импортировать", "Предпочтения и настройки приложения (кофемолка, температура, тип фильтра)"]], ["p", "Эти данные недоступны нам или третьим лицам. Вы можете удалить их в любой момент из приложения или удалив приложение. Вы можете отключить синхронизацию iCloud для Logica Coffee в любой момент в разделе <strong>Настройки → [Ваше имя] → iCloud</strong> на вашем iPhone."], ["h2", "Камера и фотографии"], ["p", "Logica Coffee может сделать фотографию пакета кофе, чтобы сохранить её с зерном, и может отсканировать этикетку пакета, чтобы автоматически заполнить такие детали, как название, происхождение и дату обжарки. Распознавание этикетки выполняется полностью на вашем устройстве с помощью встроенного распознавания текста Apple — изображение никогда не загружается ни к нам, ни на какой-либо сервер, и сканирование происходит офлайн."], ["p", "Камера используется только когда вы нажимаете, чтобы сделать фото, и только после того, как вы предоставите разрешение на доступ к камере. Если же вы выбираете фото из своей медиатеки, приложение использует системный выбор фотографий Apple, который передаёт только одно выбранное вами изображение — Logica Coffee никогда не получает доступ к остальной части вашей фотомедиатеки. Сохранённые фотографии пакетов хранятся на вашем устройстве и, если iCloud включён, в вашей личной учётной записи iCloud, точно так же, как и остальные ваши данные. Вы можете удалить фотографию в любой момент на экране редактирования зерна."], ["h2", "Уведомления"], ["p", "Если вы добавите дату обжарки к зерну, Logica Coffee может запланировать локальное уведомление, чтобы напомнить вам, когда эти зёрна достигнут пика свежести. Эти напоминания планируются и доставляются полностью на вашем устройстве — никакая информация никуда не отправляется, и уведомления используются только после того, как вы предоставите разрешение. Вы можете отключить их в любой момент в разделе <strong>Настройки → Уведомления → Logica Coffee</strong>."], ["h2", "Синхронизация iCloud"], ["p", "Если на вашем устройстве включён iCloud, Logica Coffee использует службу iCloud Drive (Документы) Apple для синхронизации вашего журнала, запаса зёрен и рецептов между вашим iPhone и любыми другими устройствами, вошедшими под тем же Apple ID. Эта синхронизация происходит через вашу личную учётную запись iCloud — данные хранятся Apple в соответствии с <a href=\"https://www.apple.com/legal/privacy/\" target=\"_blank\">Политикой конфиденциальности Apple</a> и никоим образом не доступны нам."], ["p", "Синхронизация iCloud полностью необязательна и управляется настройками вашего устройства. Если iCloud недоступен или отключён, приложение хранит ваши данные локально на устройстве, как обычно."], ["h2", "Синхронизация с Apple Watch"], ["p", "Если вы используете приложение Logica Coffee для Apple Watch, данные сессии заваривания передаются между вашим iPhone и Apple Watch с помощью фреймворка WatchConnectivity от Apple. Эта связь происходит напрямую между вашими двумя устройствами через локальную сеть или Bluetooth — она не проходит через какой-либо внешний сервер."], ["h2", "Apple Здоровье"], ["p", "Logica Coffee может записывать оценочное количество кофеина для каждой сохранённой вами заварки в Apple Здоровье, чтобы потребление кофеина отображалось рядом с остальными вашими данными о здоровье. Это полностью необязательно и отключено, пока вы не включите это и не предоставите разрешение в разделе <strong>Настройки → Apple Здоровье</strong> внутри приложения."], ["p", "Приложение только <em>записывает</em> данные о кофеине — оно никогда не читает никаких ваших данных о здоровье. Apple требует запрос разрешения на чтение, чтобы вообще включить запись кофеина, но Logica Coffee не запрашивает доступ на чтение и ничего не запрашивает из Здоровья. Все значения кофеина вычисляются на вашем устройстве на основе записанной вами заварки, и данные хранятся Apple в Здоровье в соответствии с <a href=\"https://www.apple.com/legal/privacy/\" target=\"_blank\">Политикой конфиденциальности Apple</a> — они никогда не отправляются нам. Вы можете отозвать доступ в любой момент в разделе <strong>Настройки → Здоровье → Доступ к данным и устройства → Logica Coffee</strong>."], ["h2", "Анализ заварки на устройстве"], ["p", "На iPhone и iPad с поддержкой Apple Intelligence приложение Logica Coffee может проанализировать сохранённую заварку с помощью базовой модели Apple прямо на устройстве. Этот анализ полностью выполняется на вашем устройстве. Данные о ваших заварках никогда не отправляются в Apple, нам или на какой-либо сервер, а учётная запись не требуется. Там, где функция доступна, она включена по умолчанию и может быть в любой момент отключена в Настройках. На устройствах без Apple Intelligence встроенный тренер Джеймс даёт те же рекомендации — тоже полностью на устройстве."], ["h2", "Обмен рецептами"], ["p", "Logica Coffee позволяет поделиться собственным рецептом с кем-то ещё в виде ссылки или QR-кода. Это всегда необязательно и происходит только когда вы нажимаете «Поделиться». Весь рецепт — его название, автор и шаги заваривания — кодируется прямо в самой ссылке; ничего не загружается на сервер и не хранится у нас, а QR-код создаётся на вашем устройстве."], ["p", "Куда отправить ссылку — ваш выбор: она передаётся в стандартное меню «Поделиться» Apple, так что вы решаете, отправить её через Сообщения, Почту или куда-либо ещё. Когда кто-то открывает присланную ссылку, сначала загружается небольшая статическая страница перенаправления (размещённая на GitHub Pages), которая просто перенаправляет ссылку в приложение Logica Coffee. Как и с любой веб-страницей, хостинг GitHub может вести обычные журналы запросов; никакие данные рецепта нами не собираются, не хранятся и не используются. Полученные рецепты никогда не добавляются автоматически — вы всегда видите предварительный просмотр и подтверждаете, прежде чем что-либо сохранится в вашу библиотеку."], ["h2", "Данные, которые мы не собираем"], ["ul", ["Мы не собираем ваше имя, адрес электронной почты или какую-либо информацию об учётной записи", "Мы не отслеживаем ваше местоположение", "Мы не читаем ваши данные Apple Здоровье — запись кофеина работает только на запись", "Мы не собираем аналитику, отчёты о сбоях или статистику использования", "Мы не используем рекламные SDK и не отслеживаем вас между приложениями", "Мы не передаём никакие данные третьим лицам"]], ["h2", "Сторонние сервисы"], ["p", "Logica Coffee не интегрирует никаких сторонних сервисов аналитики, рекламы или отчётов о сбоях. Единственные используемые внешние фреймворки — это собственные системные фреймворки Apple (WatchConnectivity, WidgetKit, ActivityKit, iCloud Documents, HealthKit, фреймворк распознавания текста на устройстве Vision, системный выбор фотографий и локальные уведомления), все из которых работают в соответствии с <a href=\"https://www.apple.com/legal/privacy/\" target=\"_blank\">Политикой конфиденциальности Apple</a>."], ["h2", "Конфиденциальность детей"], ["p", "Logica Coffee сознательно не собирает никаких данных от пользователей любого возраста. Приложение подходит для всех возрастов."], ["h2", "Изменения в этой политике"], ["p", "Если эта политика изменится существенным образом (например, если будущая версия приложения добавит сетевые функции), дата обновления вверху этой страницы отразит это, и новая политика будет доступна до того, как обновление достигнет App Store."], ["h2", "Контакты"], ["p", "Вопросы об этой политике конфиденциальности? Напишите нам на <a href=\"mailto:khatskevich.mv@gmail.com\">khatskevich.mv@gmail.com</a>."]]}, "uk": {"title": "Політика конфіденційності", "updated": "Останнє оновлення: 17 липня 2026 р. — додано підтримку iPad поряд з аналізом заварювання на пристрої", "blocks": [["highlight", "Logica Coffee не збирає, не передає й не надає доступ до жодних персональних даних. Ваші дані залишаються під вашим контролем — на вашому пристрої та, за бажанням, у вашому власному обліковому записі iCloud."], ["h2", "Огляд"], ["p", "Logica Coffee — це персональний помічник для заварювання кави. Ваш журнал заварок, запас зерна, рецепти й налаштування зберігаються на вашому пристрої та — якщо iCloud увімкнено — синхронізуються між вашими пристроями через ваш особистий обліковий запис iCloud. Ми не використовуємо жодних серверів, і жодні дані нам не надсилаються. Обліковий запис не потрібен."], ["h2", "Дані, що зберігаються на вашому пристрої"], ["p", "Наступна інформація зберігається на вашому пристрої та, якщо iCloud увімкнено, у вашому особистому обліковому записі iCloud:"], ["ul", ["Записи журналу заварок (метод, доза, пропорція, дегустаційні нотатки, оцінка в зірках)", "Запас кавових зерен (назва, походження, ступінь обсмаження, смакові ноти, залишок ваги)", "Власні рецепти й тайминги заварювання, які ви створюєте", "Фотографії ваших пакетів кави, які ви вирішите зробити або імпортувати", "Уподобання й налаштування застосунку (кавомолка, температура, тип фільтра)"]], ["p", "Ці дані недоступні нам або третім сторонам. Ви можете видалити їх будь-коли із застосунку або видаливши застосунок. Ви можете вимкнути синхронізацію iCloud для Logica Coffee будь-коли в розділі <strong>Налаштування → [Ваше ім'я] → iCloud</strong> на вашому iPhone."], ["h2", "Камера та фотографії"], ["p", "Logica Coffee може зробити фотографію пакета кави, щоб зберегти її із зерном, і може відсканувати етикетку пакета, щоб автоматично заповнити такі деталі, як назва, походження та дата обсмаження. Розпізнавання етикетки виконується повністю на вашому пристрої за допомогою вбудованого розпізнавання тексту Apple — зображення ніколи не завантажується ні до нас, ні на будь-який сервер, і сканування відбувається офлайн."], ["p", "Камера використовується лише коли ви торкаєтеся, щоб зробити фото, і лише після того, як ви надасте дозвіл на доступ до камери. Якщо ж ви обираєте фото зі своєї медіатеки, застосунок використовує системний вибір фотографій Apple, який передає лише одне обране вами зображення — Logica Coffee ніколи не отримує доступ до решти вашої фотомедіатеки. Збережені фотографії пакетів зберігаються на вашому пристрої та, якщо iCloud увімкнено, у вашому особистому обліковому записі iCloud, так само як і решта ваших даних. Ви можете видалити фотографію будь-коли на екрані редагування зерна."], ["h2", "Сповіщення"], ["p", "Якщо ви додасте дату обсмаження до зерна, Logica Coffee може запланувати локальне сповіщення, щоб нагадати вам, коли ці зерна досягнуть піку свіжості. Ці нагадування плануються та доставляються повністю на вашому пристрої — жодна інформація нікуди не надсилається, і сповіщення використовуються лише після того, як ви надасте дозвіл. Ви можете вимкнути їх будь-коли в розділі <strong>Налаштування → Сповіщення → Logica Coffee</strong>."], ["h2", "Синхронізація iCloud"], ["p", "Якщо на вашому пристрої увімкнено iCloud, Logica Coffee використовує службу iCloud Drive (Документи) від Apple для синхронізації вашого журналу, запасу зерна та рецептів між вашим iPhone та будь-якими іншими пристроями, що ввійшли під тим самим Apple ID. Ця синхронізація відбувається через ваш особистий обліковий запис iCloud — дані зберігаються Apple відповідно до <a href=\"https://www.apple.com/legal/privacy/\" target=\"_blank\">Політики конфіденційності Apple</a> і жодним чином не доступні нам."], ["p", "Синхронізація iCloud є цілком необов'язковою та керується налаштуваннями вашого пристрою. Якщо iCloud недоступний або вимкнений, застосунок зберігає ваші дані локально на пристрої, як зазвичай."], ["h2", "Синхронізація з Apple Watch"], ["p", "Якщо ви використовуєте застосунок Logica Coffee для Apple Watch, дані сесії заварювання передаються між вашим iPhone та Apple Watch за допомогою фреймворку WatchConnectivity від Apple. Цей зв'язок відбувається безпосередньо між вашими двома пристроями через локальну мережу або Bluetooth — він не проходить через жоден зовнішній сервер."], ["h2", "Apple Здоров'я"], ["p", "Logica Coffee може записувати орієнтовну кількість кофеїну для кожної збереженої вами заварки в Apple Здоров'я, щоб ваше споживання кофеїну відображалося поруч з рештою ваших даних про здоров'я. Це цілком необов'язково й вимкнено, доки ви не ввімкнете це й не надасте дозвіл у розділі <strong>Налаштування → Apple Здоров'я</strong> всередині застосунку."], ["p", "Застосунок лише <em>записує</em> дані про кофеїн — він ніколи не читає жодних ваших даних про здоров'я. Apple вимагає запит дозволу на читання, щоб взагалі ввімкнути запис кофеїну, але Logica Coffee не запитує доступ на читання й нічого не запитує зі Здоров'я. Усі значення кофеїну обчислюються на вашому пристрої на основі записаної вами заварки, а дані зберігаються Apple у Здоров'ї відповідно до <a href=\"https://www.apple.com/legal/privacy/\" target=\"_blank\">Політики конфіденційності Apple</a> — вони ніколи не надсилаються нам. Ви можете відкликати доступ будь-коли в розділі <strong>Налаштування → Здоров'я → Доступ до даних і пристрої → Logica Coffee</strong>."], ["h2", "Аналіз заварювання на пристрої"], ["p", "На iPhone та iPad із підтримкою Apple Intelligence застосунок Logica Coffee може проаналізувати збережене заварювання за допомогою базової моделі Apple безпосередньо на пристрої. Цей аналіз повністю виконується на вашому пристрої. Дані про ваші заварювання ніколи не надсилаються ані Apple, ані нам, ані на будь-який сервер, і обліковий запис не потрібен. Там, де функція доступна, вона ввімкнена за замовчуванням, і її будь-коли можна вимкнути в Налаштуваннях. На пристроях без Apple Intelligence вбудований тренер Джеймс надає ті самі поради — теж повністю на пристрої."], ["h2", "Обмін рецептами"], ["p", "Logica Coffee дозволяє поділитися власним рецептом з кимось іншим у вигляді посилання або QR-коду. Це завжди необов'язково й відбувається лише коли ви торкаєтеся «Поділитися». Увесь рецепт — його назва, автор і кроки заварювання — кодується безпосередньо в самому посиланні; нічого не завантажується на сервер і не зберігається в нас, а QR-код створюється на вашому пристрої."], ["p", "Куди надіслати посилання — ваш вибір: воно передається у стандартне меню «Поділитися» Apple, тож ви вирішуєте, надіслати його через Повідомлення, Пошту чи деінде. Коли хтось відкриває надіслане посилання, спершу завантажується невелика статична сторінка переспрямування (розміщена на GitHub Pages), яка просто перенаправляє посилання в застосунок Logica Coffee. Як і з будь-якою вебсторінкою, хостинг GitHub може вести звичайні журнали запитів; жодні дані рецепта нами не збираються, не зберігаються й не використовуються. Отримані рецепти ніколи не додаються автоматично — ви завжди бачите попередній перегляд і підтверджуєте, перш ніж щось збережеться у вашу бібліотеку."], ["h2", "Дані, які ми не збираємо"], ["ul", ["Ми не збираємо ваше ім'я, адресу електронної пошти чи будь-яку інформацію про обліковий запис", "Ми не відстежуємо ваше місцеперебування", "Ми не читаємо ваші дані Apple Здоров'я — запис кофеїну працює лише на запис", "Ми не збираємо аналітику, звіти про збої чи статистику використання", "Ми не використовуємо рекламні SDK і не відстежуємо вас між застосунками", "Ми не передаємо жодних даних третім сторонам"]], ["h2", "Сторонні сервіси"], ["p", "Logica Coffee не інтегрує жодних сторонніх сервісів аналітики, реклами чи звітування про збої. Єдині використовувані зовнішні фреймворки — це власні системні фреймворки Apple (WatchConnectivity, WidgetKit, ActivityKit, iCloud Documents, HealthKit, фреймворк розпізнавання тексту на пристрої Vision, системний вибір фотографій і локальні сповіщення), усі з яких працюють відповідно до <a href=\"https://www.apple.com/legal/privacy/\" target=\"_blank\">Політики конфіденційності Apple</a>."], ["h2", "Конфіденційність дітей"], ["p", "Logica Coffee свідомо не збирає жодних даних від користувачів будь-якого віку. Застосунок підходить для всіх вікових груп."], ["h2", "Зміни до цієї політики"], ["p", "Якщо ця політика зміниться суттєвим чином (наприклад, якщо майбутня версія застосунку додасть мережеві функції), дата оновлення вгорі цієї сторінки відобразить це, і нова політика буде доступна до того, як оновлення з'явиться в App Store."], ["h2", "Контакти"], ["p", "Питання щодо цієї політики конфіденційності? Напишіть нам на <a href=\"mailto:khatskevich.mv@gmail.com\">khatskevich.mv@gmail.com</a>."]]}, "zh-Hans": {"title": "隐私政策", "updated": "最后更新：2026年7月17日 — 在设备端冲煮分析之外新增 iPad 支持", "blocks": [["highlight", "Logica Coffee 不收集、传输或共享任何个人数据。您的数据始终在您的掌控之中 — 保存在您的设备上，并在您选择时保存在您自己的 iCloud 账户中。"], ["h2", "概述"], ["p", "Logica Coffee 是一款个人咖啡冲煮伴侣。您的冲煮日志、咖啡豆库存、配方和设置都保存在您的设备上，并且 — 如果您启用了 iCloud — 会通过您的个人 iCloud 账户在您的设备之间同步。我们不运营任何服务器，也绝不会向我们发送任何数据。无需账户。"], ["h2", "存储在您设备上的数据"], ["p", "以下信息会保存在您的设备上，如果启用了 iCloud，则保存在您的个人 iCloud 账户中："], ["ul", ["冲煮日志条目（方法、用量、比例、品鉴记录、星级评分）", "咖啡豆库存（名称、产地、烘焙度、风味记录、剩余重量）", "您创建的自定义配方和冲煮时间线", "您选择拍摄或导入的咖啡袋照片", "应用偏好和设置（磨豆机、温度、滤纸类型）"]], ["p", "这些数据我们和任何第三方都无法访问。您可以随时在应用内删除它们，或通过卸载应用删除。您可以随时在 iPhone 上的<strong>设置 → [您的姓名] → iCloud</strong>中关闭 Logica Coffee 的 iCloud 同步。"], ["h2", "相机与照片"], ["p", "Logica Coffee 可以拍摄咖啡袋的照片以与咖啡豆一起保存，并可以扫描袋子的标签以自动填写名称、产地和烘焙日期等详情。标签的读取完全在您的设备上使用 Apple 的设备端文字识别完成 — 图像绝不会上传给我们或任何服务器，扫描在离线状态下进行。"], ["p", "相机仅在您点按拍照时使用，且仅在您授予相机权限后。如果您改为从图库中选择照片，应用会使用 Apple 的系统照片选择器，它只会交出您所选择的那一张图像 — Logica Coffee 绝不会访问您照片图库的其余部分。您保存的袋子照片会保存在您的设备上，如果启用了 iCloud，则保存在您的个人 iCloud 账户中，与您的其余数据完全一样。您可以随时在咖啡豆的编辑界面中移除照片。"], ["h2", "通知"], ["p", "如果您为某款咖啡豆添加烘焙日期，Logica Coffee 可以安排一条本地通知，在这些咖啡豆达到最佳新鲜期时提醒您。这些提醒完全在您的设备上安排和发送 — 不会向任何地方发送任何信息，且通知仅在您授予权限后才会使用。您可以随时在<strong>设置 → 通知 → Logica Coffee</strong>中关闭它们。"], ["h2", "iCloud 同步"], ["p", "如果您的设备启用了 iCloud，Logica Coffee 会使用 Apple 的 iCloud 云盘（文稿）服务，在您的 iPhone 和使用同一 Apple ID 登录的任何其他设备之间同步您的日志、咖啡豆库存和配方。此同步通过您的个人 iCloud 账户进行 — 数据由 Apple 依据 <a href=\"https://www.apple.com/legal/privacy/\" target=\"_blank\">Apple 隐私政策</a>存储，我们无法以任何方式访问。"], ["p", "iCloud 同步完全可选，并由您的设备设置控制。如果 iCloud 不可用或被关闭，应用会照常将您的数据本地存储在设备上。"], ["h2", "Apple Watch 同步"], ["p", "如果您使用 Logica Coffee 的 Apple Watch 应用，冲煮会话数据会通过 Apple 的 WatchConnectivity 框架在您的 iPhone 和 Apple Watch 之间共享。此通信通过您的本地网络或蓝牙直接在您的两台设备之间进行 — 不会经过任何外部服务器。"], ["h2", "Apple 健康"], ["p", "Logica Coffee 可以为您保存的每次冲煮向 Apple 健康写入估算的咖啡因量，让您的咖啡因摄入量与您的其余健康数据一同显示。这完全可选，并且在您于应用内的<strong>设置 → Apple 健康</strong>中开启并授予权限之前都处于关闭状态。"], ["p", "应用只会<em>写入</em>咖啡因条目 — 绝不会读取您的任何健康数据。Apple 要求读取权限提示才能启用咖啡因记录，但 Logica Coffee 不请求任何读取访问权限，也不从健康查询任何内容。所有咖啡因数值都根据您记录的冲煮在您的设备上计算，数据由 Apple 依据 <a href=\"https://www.apple.com/legal/privacy/\" target=\"_blank\">Apple 隐私政策</a>存储在健康中 — 绝不会发送给我们。您可以随时在<strong>设置 → 健康 → 数据访问与设备 → Logica Coffee</strong>中撤销访问权限。"], ["h2", "设备端冲煮分析"], ["p", "在支持 Apple 智能的 iPhone 和 iPad 上，Logica Coffee 可以使用 Apple 的设备端基础模型分析已记录的冲煮。该分析完全在你的设备上运行。你的冲煮数据绝不会发送给 Apple、我们或任何服务器，也无需账户。在支持的设备上，此功能默认开启，并可随时在「设置」中关闭。在没有 Apple 智能的设备上，内置冲煮教练 James 会提供同样的指导，同样完全在设备端进行。"], ["h2", "配方共享"], ["p", "Logica Coffee 允许您以链接或二维码的形式与他人共享自定义配方。这始终是可选的，仅在您点按共享时才会发生。整个配方 — 其名称、作者和冲煮步骤 — 都直接编码在链接本身中；我们不会上传任何内容到服务器或存储在服务器上，二维码在您的设备上生成。"], ["p", "链接发送到哪里由您决定：它会交给 Apple 标准的共享面板，因此由您决定是通过信息、邮件还是其他任何方式发送。当有人打开共享链接时，首先会加载一个小型静态重定向页面（托管在 GitHub Pages 上），它只是将链接跳转到 Logica Coffee 应用。与任何网页一样，GitHub 的托管可能会记录常规的请求日志；我们不会收集、存储或使用任何配方数据。您收到的配方绝不会自动添加 — 在任何内容保存到您的库之前，您总会看到预览并进行确认。"], ["h2", "我们不收集的数据"], ["ul", ["我们不收集您的姓名、电子邮件地址或任何账户信息", "我们不追踪您的位置", "我们不读取您的 Apple 健康数据 — 咖啡因记录为只写", "我们不收集分析、崩溃报告或使用统计", "我们不使用广告 SDK，也不跨应用追踪您", "我们不与任何第三方共享任何数据"]], ["h2", "第三方服务"], ["p", "Logica Coffee 不集成任何第三方分析、广告或崩溃报告服务。所使用的唯一外部框架是 Apple 自有的系统框架（WatchConnectivity、WidgetKit、ActivityKit、iCloud Documents、HealthKit、设备端文字识别框架 Vision、系统照片选择器和本地通知），它们全部依据 <a href=\"https://www.apple.com/legal/privacy/\" target=\"_blank\">Apple 隐私政策</a>运行。"], ["h2", "儿童隐私"], ["p", "Logica Coffee 不会在知情的情况下收集任何年龄用户的任何数据。本应用适合所有年龄段。"], ["h2", "本政策的变更"], ["p", "如果本政策发生重大变更（例如，应用的未来版本引入网络功能），本页面顶部的更新日期将反映这一点，并且新政策将在更新到达 App Store 之前提供。"], ["h2", "联系方式"], ["p", "对本隐私政策有疑问？请通过 <a href=\"mailto:khatskevich.mv@gmail.com\">khatskevich.mv@gmail.com</a> 与我们联系。"]]}};
  var UI  = {"en": {"langLabel": "Language", "contactEmail": "Email", "footerPrivacy": "Privacy Policy"}, "be": {"langLabel": "Мова", "contactEmail": "Пошта", "footerPrivacy": "Палітыка прыватнасці"}, "de": {"langLabel": "Sprache", "contactEmail": "E-Mail", "footerPrivacy": "Datenschutzerklärung"}, "es": {"langLabel": "Idioma", "contactEmail": "Correo", "footerPrivacy": "Política de Privacidad"}, "fr": {"langLabel": "Langue", "contactEmail": "E-mail", "footerPrivacy": "Politique de confidentialité"}, "it": {"langLabel": "Lingua", "contactEmail": "E-mail", "footerPrivacy": "Informativa sulla privacy"}, "ja": {"langLabel": "言語", "contactEmail": "メール", "footerPrivacy": "プライバシーポリシー"}, "pl": {"langLabel": "Język", "contactEmail": "E-mail", "footerPrivacy": "Polityka prywatności"}, "pt-BR": {"langLabel": "Idioma", "contactEmail": "E-mail", "footerPrivacy": "Política de Privacidade"}, "ru": {"langLabel": "Язык", "contactEmail": "Почта", "footerPrivacy": "Политика конфиденциальности"}, "uk": {"langLabel": "Мова", "contactEmail": "Пошта", "footerPrivacy": "Політика конфіденційності"}, "zh-Hans": {"langLabel": "语言", "contactEmail": "邮箱", "footerPrivacy": "隐私政策"}};
  var KIND = "privacy"; // 'privacy' or 'support'

  function esc(){return arguments[0];}

  function pickLang() {
    var h = location.hash.replace('#','');
    if (STR[h]) return h;
    try { var s = localStorage.getItem('lc_lang'); if (s && STR[s]) return s; } catch(e){}
    var n = (navigator.language || navigator.userLanguage || 'en');
    if (STR[n]) return n;
    var base = n.toLowerCase().split('-')[0];
    if (base === 'pt') return STR['pt-BR'] ? 'pt-BR' : 'en';
    if (base === 'zh') return STR['zh-Hans'] ? 'zh-Hans' : 'en';
    for (var i=0;i<LANGS.length;i++){ if (LANGS[i][0].toLowerCase().split('-')[0] === base && STR[LANGS[i][0]]) return LANGS[i][0]; }
    return 'en';
  }

  function renderBlocks(blocks, ui) {
    var html = '';
    var open = false;
    function openSec(){ if(!open){ html += '<section>'; open = true; } }
    function closeSec(){ if(open){ html += '</section>'; open = false; } }
    for (var i=0;i<blocks.length;i++) {
      var b = blocks[i];
      var t = b[0];
      if (t === 'highlight') {
        closeSec();
        html += '<section><div class="highlight-box"><p>' + b[1] + '</p></div></section>';
      } else if (t === 'h2') {
        closeSec(); openSec();
        html += '<h2>' + b[1] + '</h2>';
      } else if (t === 'p') {
        openSec();
        html += '<p>' + b[1] + '</p>';
      } else if (t === 'ul') {
        openSec();
        html += '<ul>';
        for (var j=0;j<b[1].length;j++) html += '<li>' + b[1][j] + '</li>';
        html += '</ul>';
      } else if (t === 'faq') {
        openSec();
        html += '<div class="faq-item"><p class="faq-q">' + b[1] + '</p><p class="faq-a">' + b[2] + '</p></div>';
      } else if (t === 'contact') {
        closeSec();
        html += '<section><div class="contact-card"><span class="label">' + b[1] +
                '</span><a class="email" href="mailto:khatskevich.mv@gmail.com">khatskevich.mv@gmail.com</a><span class="note">' +
                b[2] + '</span></div></section>';
      }
    }
    closeSec();
    return html;
  }

  function apply(loc) {
    var d = STR[loc] || STR['en'];
    var ui = UI[loc] || UI['en'];
    document.documentElement.lang = loc;
    document.title = d.title + ' — Logica Coffee';
    document.getElementById('title').textContent = d.title;
    document.getElementById('updated').textContent = d.updated;
    document.getElementById('langLabel').textContent = '';
    document.getElementById('content').innerHTML = renderBlocks(d.blocks, ui);
    var foot = document.getElementById('footer');
    if (foot) {
      foot.innerHTML = 'Logica Coffee &mdash; Mikita Khatskevich &mdash; 2026' +
        (KIND === 'support' ? ' &mdash; <a href="./privacy.html">' + ui.footerPrivacy + '</a>' : '');
    }
    document.getElementById('lang').value = loc;
    try { localStorage.setItem('lc_lang', loc); } catch(e){}
  }

  var sel = document.getElementById('lang');
  sel.addEventListener('change', function(){ location.hash = this.value; apply(this.value); });
  window.addEventListener('hashchange', function(){ var h = location.hash.replace('#',''); if (STR[h]) apply(h); });
  apply(pickLang());
</script>
